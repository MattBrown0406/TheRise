        carryId = spans[spans.length - 1].id;
      });
      passageAttribution = { text, byWater };
      return byWater;
    }

    function passageAboutWater(water, sourceText) {
      if (!aliasesForWater(water).filter((alias) => alias.length > 3).length) return "";
      return (passagesByWater(sourceText).get(water.id) || []).join(" ");
    }

    /* The longest name is read first and blanked, so "October caddis" is an
       October Caddis report and not also a generic Caddis one, and "green
       drake" is not counted again as "drake". */
    function assertedSignals(clauses, signalMap) {
      const found = new Set();
      const ordered = [...signalMap].sort((a, b) => b[0].length - a[0].length);
      clauses.filter((clause) => clause.aboutFishing).forEach((clause) => {
        let working = clause.text.toLowerCase();
        ordered.forEach(([needle, value]) => {
          const spans = phraseSpans(working, needle, true);
          if (!spans.length) return;
          if (spans.some((span) => !negatedAt(clause, span.start, working))) found.add(value);
          working = maskSpans(working, spans);
        });
      });
      return uniqueItems(signalMap.map(([, value]) => value).filter((value) => found.has(value)));
    }

    function extractSignalsForWater(water, sourceText, source) {
      // A source that could not be read has nothing to say and is named nowhere.
      if (!source.readable) return null;
      const named = passageAboutWater(water, sourceText).toLowerCase();
      if (!named) return null;
      // Water names are blanked before anything is read: "Clear Lake" is not
      // a clear-water report, and "lake" in a name is not fishing content.
      const passage = maskSpans(named, waterMentionSpans(named)).replace(/\s+/g, " ").trim();
      // Insect and fly names are read only where they are asserted. "There is
      // no caddis activity yet" used to put caddis on the card.
      const clauses = passageClauses(passage);
      const hatches = assertedSignals(clauses, hatchSignalMap)
        .filter((hatch) => hatchAllowedForWater(normalizeHatchForWater(hatch, water), water));
      const flies = assertedSignals(clauses, flySignalMap)
        .filter((fly) => flyAllowedForWater(fly, water));
      const cues = cueSignalsFromText(passage);
      // A passage that names the water and says nothing about fishing it is
      // not intel. It is not credited, not scored, and its source is not named
      // on the card - "local signal from ODFW" over a road-opening notice is
      // the same overclaim as inventing the report outright.
      if (!hatches.length && !flies.length && !cues.length) return null;
      return {
        hatches: uniqueItems(hatches),
        flies: uniqueItems(flies),
        cues,
        sources: [source.label],
        scoreBoost: scoreBoostFromSignals(passage, source, hatches, flies)
      };
    }

    function mergeIntelSignals(current, next) {
      if (!next) return current;
      return {
        hatches: uniqueItems([...(current.hatches || []), ...(next.hatches || [])]).slice(0, 6),
        flies: uniqueItems([...(current.flies || []), ...(next.flies || [])]).slice(0, 8),
        cues: uniqueItems([...(current.cues || []), ...(next.cues || [])]).slice(0, 6),
        sources: uniqueItems([...(current.sources || []), ...(next.sources || [])]).slice(0, 6),
        scoreBoost: Math.max(-.5, Math.min(.65, (current.scoreBoost || 0) + (next.scoreBoost || 0)))
      };
    }

    async function scrubLocalResources(mode = "daily-open") {
      const sourceResults = [];
      const errors = [];
      for (const source of localIntelSources) {
        let text = "";
        let readable = false;
        try {
          text = textFromHtml(await fetchTextWithTimeout(source.url, source.label));
          readable = text.length > 80;
          if (!readable) errors.push(`${source.label}: response too short to read`);
        } catch (error) {
          errors.push(`${source.label}: ${error.message}`);
          text = "";
          readable = false;
        }
        sourceResults.push({
          label: source.label,
          type: source.type,
          url: source.url,
          readable,
          text: readable ? text : ""
        });
      }

      const cache = liveReports.cache || readWaterCache();
      // No source could be read - no signal in the canyon. That says nothing
      // about the water, so the last good intel stands until it expires rather
      // than being replaced with an empty read stamped as current.
      if (!sourceResults.some((result) => result.readable) && cache.localIntel?.updatedAt) {
        cache.localIntel = { ...cache.localIntel, errors };
        writeWaterCache(cache);
        return cache.localIntel;
      }

      /* Each source's reading is kept on its own. When only one page fails -
         the weekly report times out while the static overview loads - the
         failed page's last good reading stands until it expires, instead of
         the whole day's intel being rebuilt from the overview alone and the
         report's hatches vanishing. */
      const nowIso = new Date().toISOString();
      const previousBySource = cache.localIntel?.bySource || {};
      const bySource = {};
      sourceResults.forEach((sourceResult) => {
        if (sourceResult.readable) {
          const signals = {};
          waters.forEach((water) => {
            const found = extractSignalsForWater(water, sourceResult.text, sourceResult);
            if (found) signals[water.id] = found;
          });
          bySource[sourceResult.label] = { updatedAt: nowIso, byWater: signals };
          return;
        }
        const kept = previousBySource[sourceResult.label];
        const age = hoursSince(kept?.updatedAt);
        if (kept && age !== null && age <= INTEL_EXPIRY_HOURS) bySource[sourceResult.label] = kept;
      });

      const byWater = {};
      waters.forEach((water) => {
        let intel = { hatches: [], flies: [], cues: [], sources: [], scoreBoost: 0 };
        Object.values(bySource).forEach((source) => {
          intel = mergeIntelSignals(intel, source.byWater[water.id] || null);
        });
        if (intel.sources.length || intel.hatches.length || intel.flies.length) byWater[water.id] = intel;
      });

      // Aged by its oldest contributing reading, so a kept page still expires.
      const updatedAt = Object.values(bySource).map((source) => source.updatedAt).sort()[0] || nowIso;
      cache.localIntel = {
        byWater,
        bySource,
        sources: sourceResults.map(({ label, type, url, readable }) => ({ label, type, url, readable })),
        updatedAt,
        mode,
        errors
      };
      cache.lastSavedAt = cache.lastSavedAt || cache.localIntel.updatedAt;
      writeWaterCache(cache);
      return cache.localIntel;
    }

    const USGS_MAX_READING_AGE_HOURS = 24;

    async function fetchUsgsReport(meta) {
      if (!meta.usgs) return null;
      const url = `https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${meta.usgs}&parameterCd=00060,00010&siteStatus=all`;
      const json = await fetchJsonWithTimeout(url, "USGS");
      const timeSeries = json?.value?.timeSeries || [];
      let flow = null;
      let waterTemp = null;
      let observedAt = null;
      timeSeries.forEach((series) => {
        const code = series?.variable?.variableCode?.[0]?.value;
        const latest = latestUsgsValue(series);
        if (!latest) return;
        // An iced, broken or seasonally retired sensor reports USGS's no-data
        // value (-999999), which used to show as "-999,999 cfs" and a water
        // temperature of -1799966 F, both labelled measured.
        const raw = Number(latest.value);
        const noData = Number(series?.variable?.noDataValue ?? -999999);
        if (!Number.isFinite(raw) || raw === noData || raw <= -999) return;
        // siteStatus=all returns a sensor's last value however old it is. A
        // reading from weeks ago is not a current measurement.
        const age = hoursSince(latest.dateTime);
        if (age === null || age > USGS_MAX_READING_AGE_HOURS) return;
        const keep = () => {
          if (!observedAt || new Date(latest.dateTime).getTime() < new Date(observedAt).getTime()) observedAt = latest.dateTime;
        };
        if (code === "00060" && raw >= 0) {
          // Formatted en-US so flowFromText can read it back: a German-region
          // phone wrote 4160 as "4.160" and parsed it as 4.16 cfs.
          flow = `${raw.toLocaleString("en-US")} cfs`;
          keep();
        }
        if (code === "00010" && raw > -5 && raw < 40) {
          waterTemp = `${fahrenheitFromC(raw)} F`;
          keep();
        }
      });
      // A gauge that answered with nothing usable - every series no-data, or
      // too old - has not been read. Returning an empty report counted as a
      // successful refresh, replaced a still-fresh earlier reading with the
      // reference value, and marked the day's sync done.
      if (flow === null && waterTemp === null) throw new Error("USGS returned no current readings");
      return { site: meta.usgs, flow, waterTemp, observedAt: safeText(observedAt, 40), url };
    }

    /* ---------------------------------------------------------------------
       Weather requests.

       One daily open used to fire two api.weather.gov calls for each of the
       62 waters - a /points lookup and a forecast - in bursts of four. That is
       roughly 124 requests per user per open at a rate-limited government API,
       and it earns 429s.

       Three things changed:
         - /points is a pure function of a coordinate and the coordinates are
           constants, so the grid it resolves to is cached on the device and
           never looked up twice.
         - Waters that resolve to the same NWS grid share one forecast fetch
           within a sync instead of asking for the same grid repeatedly.
         - Requests to api.weather.gov are serialised behind a minimum spacing,
           so nothing bursts.
       --------------------------------------------------------------------- */

    const NWS_GRID_CACHE_KEY = "riseNwsGrids.v1";
    const NWS_MIN_REQUEST_SPACING_MS = 350;
    let nwsGridCache = readStoredObject(NWS_GRID_CACHE_KEY);
    let nwsRequestChain = Promise.resolve();
    let nwsForecastInFlight = new Map();

    // Serialises weather requests and spaces them out.
    function queueWeatherRequest(run) {
      const queued = nwsRequestChain.then(async () => {
        const pause = () => new Promise((resolve) => setTimeout(resolve, NWS_MIN_REQUEST_SPACING_MS));
        let result;
        try {
          result = await run();
        } catch (error) {
          // A request the server answered with an error is spaced like any
          // other: a fast 429 used to send the next request straight back at
          // the API that had just refused one. A request that never left the
          // phone (no signal) is not traffic, and is not held up.
          if (/\b[45]\d\d\b/.test(error?.message || "")) await pause();
          throw error;
        }
        await pause();
        return result;
      });
      // The chain must survive a rejected link, or one failure stops the queue.
      nwsRequestChain = queued.catch(() => {});
      return queued;
    }

    function nwsGridKey(lat, lon) {
      return `${lat.toFixed(4)},${lon.toFixed(4)}`;
    }

    // Resolves a coordinate to its NWS forecast URL, once, ever.
    async function nwsForecastUrlFor(lat, lon) {
      const key = nwsGridKey(lat, lon);
      const cached = nwsGridCache[key];
      if (typeof cached === "string" && cached.startsWith("https://api.weather.gov/")) return cached;
      const pointUrl = `https://api.weather.gov/points/${key}`;
      const pointJson = await queueWeatherRequest(() => fetchJsonWithTimeout(pointUrl, "NWS points"));
      const forecastUrl = pointJson?.properties?.forecastHourly || pointJson?.properties?.forecast;
      if (typeof forecastUrl !== "string" || !forecastUrl.startsWith("https://api.weather.gov/")) {
        throw new Error("NWS points returned no forecast grid");
      }
      nwsGridCache = { ...nwsGridCache, [key]: forecastUrl };
      writeStoredObject(NWS_GRID_CACHE_KEY, nwsGridCache);
      return forecastUrl;
    }

    // Waters sharing an NWS grid share the single forecast fetch for it.
    function fetchNwsForecast(forecastUrl) {
      if (nwsForecastInFlight.has(forecastUrl)) return nwsForecastInFlight.get(forecastUrl);
      const request = queueWeatherRequest(() => fetchJsonWithTimeout(forecastUrl, "NWS forecast"))
        .finally(() => nwsForecastInFlight.delete(forecastUrl));
      nwsForecastInFlight.set(forecastUrl, request);
      return request;
    }

    async function fetchNwsReport(meta) {
      if (typeof meta.lat !== "number" || typeof meta.lon !== "number") {
        throw new Error("No mapped coordinates for this water");
      }
      const pointUrl = `https://api.weather.gov/points/${nwsGridKey(meta.lat, meta.lon)}`;
      const forecastUrl = await nwsForecastUrlFor(meta.lat, meta.lon);
      let forecastJson;
      try {
        forecastJson = await fetchNwsForecast(forecastUrl);
      } catch (error) {
        // The grid is cached forever, so a grid NWS has since moved would 404
        // on every request for good. A 404 drops it to be looked up again.
        if (/\b404\b/.test(error?.message || "")) {
          const { [nwsGridKey(meta.lat, meta.lon)]: _dropped, ...rest } = nwsGridCache;
          nwsGridCache = rest;
          writeStoredObject(NWS_GRID_CACHE_KEY, nwsGridCache);
        }
        throw error;
      }
      const period = forecastJson?.properties?.periods?.[0];
      const airTemp = Number(period?.temperature);
      const report = {
        air: Number.isFinite(airTemp) ? `${Math.round(airTemp)} F` : null,
        wind: safeText(period?.windSpeed && period?.windDirection ? `${period.windSpeed} ${period.windDirection}` : period?.windSpeed, 40) || null,
        forecast: safeText(period?.shortForecast, 80) || null,
        observedAt: safeText(period?.startTime, 40) || null,
        url: pointUrl
      };
      // An empty periods array is not a forecast.
      if (!report.air && !report.wind && !report.forecast) throw new Error("NWS returned no forecast");
      return report;
    }

    const liveRefreshInFlight = new Map();

    /* One refresh per water at a time. A card opened while the bulk sync had
       the same water in a later batch ran two refreshes side by side, and the
       one that failed last wrote its error - or the report it had captured
       before either started - over the one that had just succeeded. */
    function refreshLiveReport(waterId, options = {}) {
      const water = waters.find((item) => item.id === waterId) || getWater();
      // A water with no feed has nothing live to fetch. Asking NWS anyway put
      // live air and wind on screen tagged "reference", beside a notice saying
      // no forecast feed was mapped, and fed them into the score.
      if (!hasLiveSource(water)) return Promise.resolve(false);
      const running = liveRefreshInFlight.get(water.id);
      if (running) {
        return options.render === false
          ? running
          : running.then((result) => {
            renderScreens("today", "waters", "trip");
            return result;
          });
      }
      const run = refreshLiveReportOnce(water, options)
        .finally(() => liveRefreshInFlight.delete(water.id));
      liveRefreshInFlight.set(water.id, run);
      return run;
    }

    async function refreshLiveReportOnce(water, options = {}) {
      const { mode = "manual", render = true } = options;
      const meta = liveMetaFor(water);
      const previous = liveReports.byWater[water.id];
      liveReports.byWater[water.id] = previous?.status === "ready"
        ? { ...previous, refreshing: true, refreshError: "" }
        : { status: "loading", meta };
      liveReports.lastRequested = water.id;
      if (render) {
        renderScreens("today", "waters", "trip");
      }
      try {
        const [usgsResult, nwsResult] = await Promise.allSettled([
          fetchUsgsReport(meta),
          fetchNwsReport(meta)
        ]);
        const usgs = usgsResult.status === "fulfilled" ? usgsResult.value : null;
        const nws = nwsResult.status === "fulfilled" ? nwsResult.value : null;
        const errors = [
          usgsResult.status === "rejected" ? usgsResult.reason.message : null,
          nwsResult.status === "rejected" ? nwsResult.reason.message : null
        ].filter(Boolean);

        /* Promise.allSettled never rejects, so a launch in which every single
           request failed used to build `{ status: "ready", usgs: null,
           nws: null }` and cache it. The app then told an angler about to lose
           signal that his conditions were live and offline-ready, over a cache
           that had just been written from nothing. */
        if (!usgs && !nws) {
          const message = errors[0] || "No live data returned for this water";
          liveReports.byWater[water.id] = previous?.status === "ready"
            ? { ...previous, refreshing: false, refreshError: message }
            : { status: "error", meta, error: message };
          if (render) renderScreens("today", "waters", "trip");
          return false;
        }

        /* Half a refresh is not a reason to forget the other half. A USGS
           timeout while NWS answered used to cache usgs: null over a gauge
           reading taken an hour earlier, and the flow fell back to its
           reference value. The missing half is carried over - but only while
           it is still fresh, because the report is re-stamped as current when
           it is cached. */
        const carryOver = previous?.status === "ready" && reportFreshness(previous) === "fresh";
        const carriedUsgs = !usgs && carryOver && meta.usgs ? previous.usgs || null : null;
        const carriedNws = !nws && carryOver ? previous.nws || null : null;
        /* A carried half keeps the age it already had. Stamping the whole
           report as new let a gauge reading ride along on every weather-only
           refresh indefinitely, still "measured, fresh" two days later. A
           gauge value that was already old when USGS served it is aged from
           when it was taken, not from when it was downloaded. */
        let stampedAt = Date.now();
        if (carriedUsgs || carriedNws) {
          const previousAt = new Date(previous.cachedAt || "").getTime();
          if (Number.isFinite(previousAt)) stampedAt = Math.min(stampedAt, previousAt);
        }
        const observedAt = new Date(usgs?.observedAt || "").getTime();
        if (Number.isFinite(observedAt) && Date.now() - observedAt > READING_FRESH_HOURS * 3600000) {
          stampedAt = Math.min(stampedAt, observedAt);
        }
        cacheReport(water.id, {
          status: "ready",
          meta,
          updatedAt: zonedTimeLabel(),
          usgs: usgs || carriedUsgs,
          nws: nws || carriedNws,
          errors
        }, mode, { cachedAt: new Date(stampedAt).toISOString(), recordFlow: Boolean(usgs) });
      } catch (error) {
        liveReports.byWater[water.id] = previous?.status === "ready"
          ? { ...previous, refreshing: false, refreshError: error.message }
          : { status: "error", meta, error: error.message };
        if (render) renderScreens("today", "waters", "trip");
        return false;
      }
      if (render) {
        renderScreens("today", "waters", "trip");
      }
      return true;
    }

    /* ---------------------------------------------------------------------
       A sync used to pull all 62 waters whether the angler had ever looked at
       them or not. It now covers the waters this device actually uses - home,
       the water on screen, saved, recently opened, and the six with a real
       gauge - and stops there. Everything else refreshes when its card is
       opened, which is already how a single water gets its live data.
       --------------------------------------------------------------------- */
    const BULK_SYNC_MAX_WATERS = 12;

    function watersForBulkSync() {
      const ids = validWaterIds([
        homeWaterId,
        activeWater,
        ...savedWaterIds,
        ...recentWaterIds,
        ...waters.filter((water) => hasGauge(water)).map((water) => water.id)
      ].filter((id) => {
        const water = waterById(id);
        return Boolean(water && hasLiveSource(water));
      })).slice(0, BULK_SYNC_MAX_WATERS);
      return ids.map((id) => waters.find((water) => water.id === id)).filter(Boolean);
    }

    async function refreshAllWaterReports(mode = "manual") {
      if (liveReports.bulkStatus) return;
      liveReports.bulkStatus = mode;
      renderScreens("today", "waters", "trip");
      const results = [];
      try {
        await scrubLocalResources(mode);
        const syncWaters = watersForBulkSync();
        for (let index = 0; index < syncWaters.length; index += BULK_SYNC_CONCURRENCY) {
          const batch = syncWaters.slice(index, index + BULK_SYNC_CONCURRENCY);
          const batchResults = await Promise.allSettled(batch.map((water) => refreshLiveReport(water.id, { mode, render: false })));
          results.push(...batchResults);
        }
        /* A sync in which nothing was fetched is not a sync that happened.
           This used to mark the day complete regardless, so an angler whose
           first open of the day was out of signal got no further attempt for
           the rest of that day - shouldRunDailyOpenSync() returned false on
           every later visibilitychange and on the `online` event itself. */
        const anySucceeded = results.some((result) => result.status === "fulfilled" && result.value === true);
        if (mode === "daily-open" && anySucceeded) markDailyOpenSyncComplete();
      } finally {
        // Without this, one thrown quota error left bulkStatus set and killed
        // every refresh for the rest of the session.
        liveReports.bulkStatus = "";
        maybeCompleteOnboarding();
        renderAll();
      }
      return results;
    }

    /* ---------------------------------------------------------------------
       Plan the week.

       Every score above is for right now. The planner answers a different
       question - which of the next seven days is worth the drive - with what
       can honestly be known a week out: the NWS daily forecast for the
       water's mapped coordinates, and what is in season on that date. Nobody
       forecasts flow or water temperature for these waters, so the planner
       does not either. A day score is forecast weather plus season, and the
       panel says so.

       It is fetched when the angler asks for it, not on every open, so a
       daily open makes exactly the requests it made before. The forecast URL
       comes from the grid lookup the live sync already caches (the hourly
       URL minus "/hourly"), waters on one grid share one fetch, and a
       fetched forecast is reused for a few hours.
       --------------------------------------------------------------------- */

    const PLANNER_CACHE_KEY = "risePlannerForecasts.v1";
    const PLANNER_MAX_WATERS = 8;
    const PLANNER_DAYS = 7;
    const PLANNER_FORECAST_FRESH_HOURS = 6;
    const PLANNER_FORECAST_MAX_AGE_HOURS = 24;
    const TRIPCHECK_URL = "https://www.tripcheck.com/";
    const WEEKDAY_LABELS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const SNOWED_IN_REASON = "Typically snowed in - check ODOT TripCheck / USFS";
    const SNOWED_IN_LABEL = "Typically snowed in";

    /* Typical seasonal closures, not a road report. Snow decides the real
       dates every year, so these windows are deliberately described as
       typical, a closed day is never scored, and the panel links to ODOT
       TripCheck rather than claiming to know. Months and days are inclusive
       and wrap the new year. */
    const SEASONAL_ACCESS_CLOSURES = [
      {
        id: "cascade-lakes-highway",
        label: "Cascade Lakes Highway (OR-46) beyond Mt. Bachelor",
        typical: "Typically closed by snow from about mid-November to late May.",
        from: [11, 15],
        to: [5, 25],
        waters: ["spark-lake", "devils", "elk-lake", "hosmer", "lava", "little-lava", "cultus", "little-cultus", "crane-prairie", "todd-lake", "deer-lake", "doris-lake", "blow-lake", "lucky-lake"],
        note: { "crane-prairie": "north access via OR-46" },
        // Only one way in is cut: the water is still scored, and the day
        // says which access is typically closed.
        partialAccess: { "crane-prairie": "north access typically closed" }
      },
      {
        id: "newberry-caldera",
        label: "Newberry Caldera: Paulina Lake Road (Forest Road 21) to Paulina and East Lakes",
        // Deschutes County Road Department notices: closed at the 10 Mile
        // Sno-Park gate from about mid-November to Memorial Day weekend,
        // with the Forest Service; the date moves with the snow.
        typical: "Typically gated at the 10 Mile Sno-Park from about mid-November to late May (Memorial Day weekend) - check Deschutes County roads / USFS Deschutes National Forest.",
        from: [11, 15],
        to: [5, 25],
        waters: ["east-lake", "paulina", "paulina-creek"],
        note: {}
      },
      {
        id: "high-hike-in-lakes",
        label: "High lakes off Santiam Pass, Three Creek and Olallie",
        typical: "Roads and trails are typically snowbound in winter, about mid-November to late June.",
        from: [11, 15],
        to: [6, 30],
        waters: ["big-lake", "square-lake", "three-creek", "little-three-creeks", "ollalie"],
        note: {}
      },
      {
        id: "willamette-pass-hike-in",
        label: "Hike-in lakes off Willamette Pass (Rosary, Yoran)",
        typical: "Trails are typically snowbound in winter, about mid-November to late June.",
        from: [11, 15],
        to: [6, 30],
        waters: ["rosary-lakes", "yoran-lake"],
        note: {}
      }
    ];

    let plannerForecasts = readPlannerForecasts();
    let plannerStatus = { state: "idle", message: "" };
    let plannerInFlight = null;

    function readPlannerForecasts() {
      const saved = readStoredObject(PLANNER_CACHE_KEY);
      const kept = {};
      Object.entries(saved).forEach(([url, entry]) => {
        if (!dailyForecastUrlFrom(url) || !Array.isArray(entry?.days)) return;
        const age = hoursSince(entry.fetchedAt);
        if (age === null || age > PLANNER_FORECAST_MAX_AGE_HOURS) return;
        kept[url] = { fetchedAt: entry.fetchedAt, days: entry.days.filter((day) => /^\d{4}-\d{2}-\d{2}$/.test(day?.date || "")) };
      });
      return kept;
    }

    function writePlannerForecasts() {
      writeStoredObject(PLANNER_CACHE_KEY, plannerForecasts);
    }

    // The daily forecast lives beside the hourly one on the same grid.
    function dailyForecastUrlFrom(url) {
      if (typeof url !== "string" || !url.startsWith("https://api.weather.gov/gridpoints/")) return null;
      if (/\/forecast\/hourly$/.test(url)) return url.replace(/\/hourly$/, "");
      if (/\/forecast$/.test(url)) return url;
      return null;
    }

    // Only answers from a grid lookup already cached; never makes a request.
    function cachedDailyForecastUrl(water) {
      const coordinates = waterCoordinates[water.id];
      if (!coordinates) return null;
      return dailyForecastUrlFrom(nwsGridCache[nwsGridKey(coordinates.lat, coordinates.lon)]);
    }

    function monthDayInWindow(month, day, window) {
      const value = month * 100 + day;
      const from = window.from[0] * 100 + window.from[1];
      const to = window.to[0] * 100 + window.to[1];
      return from <= to ? value >= from && value <= to : value >= from || value <= to;
    }

    // The typical closure covering this water on this Pacific date, if any.
    // A water with another way in comes back with `partial: true` and the
    // access that is typically closed; it is not snowed in.
    function seasonalClosureFor(water, dateKey = pacificDateKey()) {
      const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateKey || ""));
      if (!water || !match) return null;
      const month = Number(match[2]);
      const day = Number(match[3]);
      const closure = SEASONAL_ACCESS_CLOSURES.find((item) => item.waters.includes(water.id) && monthDayInWindow(month, day, item)) || null;
      const accessNote = closure?.partialAccess?.[water.id];
      return accessNote ? { ...closure, partial: true, accessNote } : closure;
    }

    // Typically cut off by snow on this date: a full closure, not a partial one.
    function snowedInClosureFor(water, dateKey = pacificDateKey()) {
      const closure = seasonalClosureFor(water, dateKey);
      return closure && !closure.partial ? closure : null;
    }

    /* One label for a water that cannot be fished on this date: a closed ODFW
       season first, then a typical snow closure. Empty when it can be. */
    function waterClosedLabel(water, dateKey = pacificDateKey()) {
      if (!water) return "";
      if (regulationSeasonStatus(water, dateKey) === "closed") return regulationStatusLabel("closed");
      if (snowedInClosureFor(water, dateKey)) return SNOWED_IN_LABEL;
      return "";
    }

    function weekdayLabel(dateKey) {
      const [year, month, day] = String(dateKey).split("-").map(Number);
      // A calendar date, not an instant: UTC keeps the device's zone out of it.
      return WEEKDAY_LABELS[new Date(Date.UTC(year, month - 1, day)).getUTCDay()] || "";
    }

    // "5 to 10 mph" is planned on its top end; a gusty afternoon is the one
    // that blows a lake out.
    function windMphFromText(text) {
      const value = String(text || "");
      const numbers = (value.match(/\d+(\.\d+)?/g) || []).map(Number).filter(Number.isFinite);
      if (!numbers.length) return null;
      const top = Math.max(...numbers);
      return Math.round(/km\/h/i.test(value) ? top / 1.609 : top);
    }

    // The daytime periods of an NWS /forecast response, one per date.
    function plannerDaysFromForecast(json) {
      const periods = Array.isArray(json?.properties?.periods) ? json.properties.periods : [];
      const days = [];
      for (const period of periods) {
        if (period?.isDaytime !== true) continue;
        const date = String(period.startTime || "").slice(0, 10);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || days.some((day) => day.date === date)) continue;
        const temperature = Number(period.temperature);
        const celsius = period.temperatureUnit === "C";
        const precipitation = period.probabilityOfPrecipitation?.value;
        days.push({
          date,
          highF: Number.isFinite(temperature) && period.temperature !== null ? Math.round(celsius ? temperature * 9 / 5 + 32 : temperature) : null,
          windMph: windMphFromText(period.windSpeed),
          forecast: safeText(period.shortForecast, 80),
          precipitation: typeof precipitation === "number" && Number.isFinite(precipitation) ? precipitation : null
        });
        if (days.length >= PLANNER_DAYS) break;
      }
      return days;
    }

    /* The same ingredients fishScore uses that can be known for a future
       date - the water's baseline, what is in season that month, and the
       forecast wind, sky and air temperature - with the same weights. Flow,
       water temperature, local reports and time of day are left out because
       nothing forecasts them; that is why today's planner score is not
       today's live score. */
    function plannerDayScore(water, day) {
      const month = Number(String(day.date).slice(5, 7));
      let score = water.score / 10;
      score += (seasonFitFor(water, month) - .5) * 1.4;
      const wind = typeof day.windMph === "number" ? day.windMph : null;
      const forecast = String(day.forecast || "").toLowerCase();
      if (water.type === "Lake") {
        if (wind !== null && wind >= 4 && wind <= 11) score += .25;
        if (wind !== null && wind > 16) score -= .55;
      } else if (wind !== null && wind > 18) {
        score -= .25;
      }
      if (forecast.includes("cloud") || forecast.includes("overcast")) score += .2;
      if (forecast.includes("thunder") || forecast.includes("snow")) {
        score -= .45;
      } else if (forecast.includes("heavy rain")) {
        score -= .35;
      }
      if (typeof day.highF === "number") {
        // Iced guides and a frozen lake edge, or an afternoon too hot to
        // handle a trout.
        if (day.highF <= 32) score -= .4;
        if (day.highF >= 90) score -= .35;
      }
      return Number(clampScore(score).toFixed(1));
    }

    function plannerWindPhrase(mph) {
      if (typeof mph !== "number") return "";
      if (mph <= 5) return "calm";
      if (mph <= 11) return "light wind";
      if (mph <= 18) return `breezy ${mph} mph`;
      return `windy ${mph} mph`;
    }

    function plannerDayReason(water, day) {
      const month = Number(String(day.date).slice(5, 7));
      const hatch = waterAppropriateHatches(water.hatch, water, { month, fallback: false })[0];
      const extremeAir = typeof day.highF === "number" && (day.highF <= 32 || day.highF >= 90) ? `high ${day.highF} F` : "";
      return [
        String(day.forecast || "").toLowerCase(),
        hatch ? `${hatch} season` : "nothing listed in season",
        plannerWindPhrase(day.windMph),
        extremeAir
      ].filter(Boolean).join(", ");
    }

    // Home water, today's top pick, waters with a great-day alert, then the
    // rest of the saved list - capped, so the planner stays a few requests.
    function plannerWaters() {
      const greatDayIds = Object.keys(alertRules).filter((id) => alertRules[id]?.greatDay?.enabled && savedWaterIds.includes(id));
      return validWaterIds([homeWaterId, topRecommendedWater()?.id, ...greatDayIds, ...savedWaterIds])
        .filter((id) => waterCoordinates[id] && !hiddenWaterIds.includes(id))
        .slice(0, PLANNER_MAX_WATERS)
        .map(waterById);
    }

    function plannerForWater(water, today = pacificDateKey()) {
      const url = cachedDailyForecastUrl(water);
      const forecast = url ? plannerForecasts[url] : null;
      const age = forecast ? hoursSince(forecast.fetchedAt) : null;
      if (!forecast || age === null || age > PLANNER_FORECAST_MAX_AGE_HOURS) {
        return { water, days: [], best: null, fetchedAt: null };
      }
      const days = forecast.days
        .filter((day) => day.date >= today)
        .slice(0, PLANNER_DAYS)
        .map((day) => {
          const access = seasonalClosureFor(water, day.date);
          // A partial closure leaves another way in: scored, and said.
          const closure = access && !access.partial ? access : null;
          const accessNote = access?.partial ? access.accessNote : "";
          // A day outside the ODFW season is closed to fishing, whatever the
          // weather: no score, never the best day.
          const regulationClosed = regulationSeasonStatus(water, day.date) === "closed";
          return {
            ...day,
            label: weekdayLabel(day.date),
            closure,
            regulationClosed,
            score: closure || regulationClosed ? null : plannerDayScore(water, day),
            reason: regulationClosed
              ? regulationStatusLabel("closed")
              : closure ? SNOWED_IN_REASON : [plannerDayReason(water, day), accessNote].filter(Boolean).join(", ")
          };
        });
      // Today stops being a best day once its fishing is over: past the
      // water's prime window, or 5 PM when it has none.
      const window = primeWindowHours(water);
      const todayOver = today === pacificDateKey() && currentHour() >= (window ? window[1] : 17);
      const best = days.reduce((top, day) => (day.score !== null && !(todayOver && day.date === today) && (!top || day.score > top.score) ? day : top), null);
      return { water, days, best, fetchedAt: forecast.fetchedAt };
    }

    // The week's one-line summary: the best day, or why there is none.
    function plannerSummaryLine(plan) {
      if (plan.best) return `Best: ${plan.best.label} ${plan.best.score.toFixed(1)}`;
      if (!plan.days.length) return "No forecast";
      if (plan.days.every((day) => day.regulationClosed)) return `${regulationStatusLabel("closed")} all week`;
      if (plan.days.every((day) => day.closure)) return "Typically snowed in all week";
      if (plan.days.every((day) => day.regulationClosed || day.closure)) return "Closed or snowed in all week";
      return "No open day this week";
    }

    // A forecast fetched recently enough to reuse - or, for a forced
    // refresh, fetched since `since`.
    function plannerForecastFresh(water, since = null) {
      const url = cachedDailyForecastUrl(water);
      const entry = url ? plannerForecasts[url] : null;
      const age = entry ? hoursSince(entry.fetchedAt) : null;
      if (age === null || age >= PLANNER_FORECAST_FRESH_HOURS) return false;
      return since === null || Date.parse(entry.fetchedAt) >= since;
    }

    async function loadPlannerForecasts(options = {}) {
      const { force = false, waterList = plannerWaters(), render = true } = options;
      if (plannerInFlight) {
        /* A load already running may be for other waters - turning on a
           great-day alert for one water during a load for another used to
           return the other's promise and never fetch it. Wait for it to
           finish, then load whatever this call asked for that it did not
           bring in. */
        const askedAt = Date.now();
        while (plannerInFlight) {
          await plannerInFlight.catch(() => false);
          await Promise.resolve();
        }
        const missing = waterList.filter((water) => !plannerForecastFresh(water, force ? askedAt : null));
        return missing.length ? loadPlannerForecasts({ ...options, waterList: missing }) : true;
      }
      if (navigator.onLine === false) {
        plannerStatus = { state: "offline", message: "Offline - no forecast could be loaded. Nothing is shown in its place." };
        if (render) renderScreens("today");
        return false;
      }
      plannerStatus = { state: "loading", message: "" };
      if (render) renderScreens("today");
      plannerInFlight = (async () => {
        const byUrl = new Map();
        const results = await Promise.allSettled(waterList.map(async (water) => {
          const coordinates = waterCoordinates[water.id];
          if (!coordinates) throw new Error("No mapped coordinates for this water");
          const url = dailyForecastUrlFrom(await nwsForecastUrlFor(coordinates.lat, coordinates.lon));
          if (!url) throw new Error("NWS grid has no daily forecast");
          const age = plannerForecasts[url] ? hoursSince(plannerForecasts[url].fetchedAt) : null;
          if (!force && age !== null && age < PLANNER_FORECAST_FRESH_HOURS) return true;
          // Waters on one grid share one request.
          if (!byUrl.has(url)) {
            byUrl.set(url, fetchNwsForecast(url).then((json) => {
              const days = plannerDaysFromForecast(json);
              if (!days.length) throw new Error("NWS returned no daytime forecast");
              plannerForecasts = { ...plannerForecasts, [url]: { fetchedAt: new Date().toISOString(), days } };
              return true;
            }));
          }
          return byUrl.get(url);
        }));
        const loaded = results.filter((result) => result.status === "fulfilled").length;
        plannerForecasts = Object.fromEntries(Object.entries(plannerForecasts).filter(([, entry]) => {
          const age = hoursSince(entry.fetchedAt);
          return age !== null && age <= PLANNER_FORECAST_MAX_AGE_HOURS;
        }).slice(-16));
        writePlannerForecasts();
        if (!loaded) {
          plannerStatus = {
            state: navigator.onLine === false ? "offline" : "error",
            message: "No forecast could be loaded from the National Weather Service. Nothing is shown in its place."
          };
          return false;
        }
        const missing = waterList.length - loaded;
        plannerStatus = { state: "ready", message: missing ? `${missing} of ${waterList.length} waters have no forecast right now.` : "" };
        return true;
      })();
      try {
        return await plannerInFlight;
      } finally {
        plannerInFlight = null;
        if (render) renderScreens("today");
        postGreatDaySchedule();
      }
    }

    function plannerDayRow(day, best) {
      const isBest = Boolean(best) && day.date === best.date;
      return `
        <li class="planner-day ${isBest ? "best" : ""} ${day.closure || day.regulationClosed ? "closed" : ""}">
          <b>${esc(day.label)}${isBest ? `<small>Best day</small>` : ""}</b>
          <strong>${day.score === null ? "--" : esc(day.score.toFixed(1))}</strong>
          <span>${esc(day.reason)}</span>
        </li>
      `;
    }

    function plannerAccessTable(plans) {
      const affected = SEASONAL_ACCESS_CLOSURES.filter((closure) => plans.some((plan) => closure.waters.includes(plan.water.id)));
      const open = plans.some((plan) => plan.days.some((day) => day.closure));
      return `
        <details class="planner-access" ${open ? "open" : ""}>
          <summary>Typical seasonal closures${affected.length ? ` - ${affected.length} affect${affected.length === 1 ? "s" : ""} your waters` : ""}</summary>
          <p class="subtle">Typical, not authoritative: snow sets the real dates every year. A day inside one of these windows is marked snowed in, not scored.</p>
          <table>
            <thead><tr><th>Route or area</th><th>Typically</th><th>Waters</th></tr></thead>
            <tbody>
              ${SEASONAL_ACCESS_CLOSURES.map((closure) => `
                <tr>
                  <td>${esc(closure.label)}</td>
                  <td>${esc(closure.typical)}</td>
                  <td>${closure.waters.map((id) => {
                    const water = waterById(id);
                    const note = closure.note[id];
                    return water ? esc(`${water.name}${note ? ` (${note})` : ""}`) : "";
                  }).filter(Boolean).join(", ")}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
          <a class="planner-link" href="${TRIPCHECK_URL}">Check ODOT TripCheck for current road conditions</a>
        </details>
      `;
    }

    function plannerStatusLine(plans) {
      const fetched = plans.map((plan) => plan.fetchedAt).filter(Boolean).sort()[0];
      if (plannerStatus.state === "loading") return "Loading the NWS 7-day forecast...";
      if (plannerStatus.state === "offline" || plannerStatus.state === "error") {
        return fetched ? `${plannerStatus.message} Showing the forecast saved ${formatSavedTime(fetched)}.` : plannerStatus.message;
      }
      if (fetched) return `NWS forecast saved ${formatSavedTime(fetched)}.${plannerStatus.message ? ` ${plannerStatus.message}` : ""}`;
      return `Load the NWS 7-day forecast for ${plans.length} water${plans.length === 1 ? "" : "s"}: your home water, today's top pick and your saved waters.`;
    }

    function plannerPanel() {
      const plans = plannerWaters().map((water) => plannerForWater(water));
      const loaded = plans.some((plan) => plan.days.length);
      const loading = plannerStatus.state === "loading";
      const label = loading ? "Loading..." : loaded ? "Refresh forecast" : "Plan the week";
      return `
        <div class="planner" role="region" aria-label="Plan the week">
          <div class="planner-head">
            <div>
              <p class="eyebrow">Plan the week</p>
              <h3>Best day this week</h3>
              <p class="subtle">Day scores use the NWS forecast and what is in season. They are not gauge readings: nobody forecasts flow or water temperature here.</p>
            </div>
            <button class="ghost-btn" data-plan-week ${loading ? "disabled" : ""}>${label}</button>
          </div>
          <p class="planner-status ${plannerStatus.state}">${esc(plannerStatusLine(plans))}</p>
          ${loaded ? `<div class="planner-waters">
            ${plans.map((plan, index) => `
              <details class="planner-water" data-planner-water="${attr(plan.water.id)}" ${index === 0 ? "open" : ""}>
                <summary>
                  <strong>${esc(plan.water.name)}</strong>
                  <span>${esc(plannerSummaryLine(plan))}</span>
                </summary>
                ${plan.days.length
                  ? `<ol class="planner-days">${plan.days.map((day) => plannerDayRow(day, plan.best)).join("")}</ol>`
                  : `<p class="subtle">No forecast is loaded for this water, so no day is scored.</p>`}
              </details>
            `).join("")}
          </div>` : ""}
          ${plannerAccessTable(plans)}
          ${alertsOverview()}
        </div>
      `;
    }

    /* ---------------------------------------------------------------------
       Alerts for saved waters.

       Local notifications only. The rules live on this device - here in
       localStorage and, through the riseAlerts bridge, in the app container -
       and the decisions are made on the phone: the container re-reads the
       public USGS gauge in the background for a flow alert, and schedules a
       great-day alert from the planner's own day score. Nothing is sent to a
       server, and there is no account.
       --------------------------------------------------------------------- */

    const ALERT_RULES_KEY = "riseAlertRules.v1";
    const GREAT_DAY_DEFAULT_THRESHOLD = 8;
    const GREAT_DAY_THRESHOLDS = [6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5];

    let alertRules = normalizeAlertRules(readStoredObject(ALERT_RULES_KEY));
    let alertPermission = "unknown";

    function finiteOrNull(value) {
      if (value === null || value === undefined || value === "") return null;
      const number = Number(value);
      return Number.isFinite(number) && number >= 0 && number <= 1000000 ? Math.round(number) : null;
    }

    // The band the score already treats as "near reference", as a starting
    // point the angler can change.
    function defaultFlowRange(water) {
      const reference = flowFromText(water.flow);
      if (reference === null || reference <= 0) return { min: null, max: null };
      return { min: Math.round(reference * .75), max: Math.round(reference * 1.35) };
    }

    function normalizeAlertRule(waterId, rule) {
      const water = waterById(waterId);
      if (!water || !rule || typeof rule !== "object") return null;
      const threshold = Number(rule.greatDay?.threshold);
      return {
        flow: hasGauge(water)
          ? { enabled: rule.flow?.enabled === true, min: finiteOrNull(rule.flow?.min), max: finiteOrNull(rule.flow?.max) }
          : { enabled: false, min: null, max: null },
        greatDay: {
          enabled: rule.greatDay?.enabled === true,
          threshold: Number.isFinite(threshold) ? Math.min(10, Math.max(5, Math.round(threshold * 2) / 2)) : GREAT_DAY_DEFAULT_THRESHOLD
        }
      };
    }

    function normalizeAlertRules(raw) {
      const rules = {};
      Object.entries(raw && typeof raw === "object" ? raw : {}).forEach(([waterId, rule]) => {
        const normalized = normalizeAlertRule(waterId, rule);
        if (normalized) rules[waterId] = normalized;
      });
      return rules;
    }

    function alertRuleFor(waterId) {
      const water = waterById(waterId);
      if (alertRules[waterId]) return alertRules[waterId];
      const range = water && hasGauge(water) ? defaultFlowRange(water) : { min: null, max: null };
      return { flow: { enabled: false, ...range }, greatDay: { enabled: false, threshold: GREAT_DAY_DEFAULT_THRESHOLD } };
    }

    function flowRangeValid(rule) {
      return rule.flow.min !== null && rule.flow.max !== null && rule.flow.min < rule.flow.max;
    }

    // What the container needs: site id, water name and the range, per water.
    /* A hidden water's alerts are paused, not deleted: its rules stay here,
       but it is not sent to the container, scheduled or fetched for, so the
       container withdraws what it held. Unhiding it resumes them. */
    function alertsPaused(waterId) {
      return hiddenWaterIds.includes(waterId);
    }

    function alertRulesForNative() {
      return Object.entries(alertRules)
        .filter(([waterId]) => savedWaterIds.includes(waterId) && !alertsPaused(waterId))
        .map(([waterId, rule]) => {
          const water = waterById(waterId);
          const flowActive = rule.flow.enabled && hasGauge(water) && flowRangeValid(rule);
          return {
            waterId,
            waterName: water.name,
            site: liveSources[waterId]?.usgs || "",
            flow: flowActive ? { min: rule.flow.min, max: rule.flow.max } : null,
            greatDay: rule.greatDay.enabled ? { threshold: rule.greatDay.threshold } : null
          };
        })
        .filter((rule) => rule.flow || rule.greatDay);
    }

    function hasAlertsBridge() {
      return Boolean(window.webkit?.messageHandlers?.riseAlerts);
    }

    function postAlertsMessage(payload) {
      if (!hasAlertsBridge()) return false;
      try {
        window.webkit.messageHandlers.riseAlerts.postMessage(payload);
        return true;
      } catch {
        return false;
      }
    }

    function syncAlertsToNative(requestPermission = false) {
      return postAlertsMessage({ action: "setRules", rules: alertRulesForNative(), requestPermission });
    }

    /* An angler's edit asks for permission whenever it leaves a rule the
       container can act on and iOS has not been answered yet: a toggle turned
       on over an invalid range sends no rule, so the edit that makes the range
       valid is the first chance to ask. The container asks only if iOS never
       has. */
    function setAlertRules(next, options = {}) {
      alertRules = normalizeAlertRules(next);
      writeStoredObject(ALERT_RULES_KEY, alertRules);
      const unanswered = !["granted", "provisional", "denied"].includes(alertPermission);
      const ask = Boolean(options.requestPermission) || (Boolean(options.userEdit) && unanswered && alertRulesForNative().length > 0);
      syncAlertsToNative(ask);
    }

    function toggleAlert(waterId, kind) {
      const water = waterById(waterId);
      if (!water || !savedWaterIds.includes(waterId) || !["flow", "greatDay"].includes(kind)) return;
      if (kind === "flow" && !hasGauge(water)) return;
      const rule = alertRuleFor(waterId);
      const turningOn = !rule[kind].enabled;
      setAlertRules({ ...alertRules, [waterId]: { ...rule, [kind]: { ...rule[kind], enabled: turningOn } } }, { requestPermission: turningOn, userEdit: true });
      if (kind === "greatDay") {
        if (turningOn && !plannerForWater(water).days.length) {
          loadPlannerForecasts({ waterList: [water] });
        } else {
          postGreatDaySchedule();
        }
      }
    }

    function setAlertField(waterId, field, value) {
      if (!savedWaterIds.includes(waterId) || !waterById(waterId)) return;
      const rule = alertRuleFor(waterId);
      const next = {
        flow: { ...rule.flow },
        greatDay: { ...rule.greatDay }
      };
      if (field === "flowMin") next.flow.min = finiteOrNull(value);
      else if (field === "flowMax") next.flow.max = finiteOrNull(value);
      else if (field === "threshold") next.greatDay.threshold = Number(value);
      else return;
      setAlertRules({ ...alertRules, [waterId]: next }, { userEdit: true });
      if (field === "threshold") postGreatDaySchedule();
      // Saved without a repaint so the keyboard stays up; the planner's
      // alert list on Today is now out of date, so it repaints when shown.
      if (activeScreenId() !== "today") dirtyScreens.add("today");
    }

    // A water that is no longer saved keeps no alert.
    function dropAlertRule(waterId) {
      if (!alertRules[waterId]) return;
      const { [waterId]: _dropped, ...rest } = alertRules;
      setAlertRules(rest);
    }

    function greatDayAlertWaters() {
      return Object.keys(alertRules)
        .filter((waterId) => alertRules[waterId].greatDay.enabled && savedWaterIds.includes(waterId) && !alertsPaused(waterId) && waterCoordinates[waterId])
        .map(waterById)
        .filter(Boolean);
    }

    // The days at or above each water's threshold, for waters whose forecast
    // is loaded. A water with no forecast is left out rather than sent as
    // "no great days", which would clear what the container already holds.
    function greatDaySchedule(today = pacificDateKey()) {
      return greatDayAlertWaters()
        .map((water) => {
          const rule = alertRules[water.id];
          const plan = plannerForWater(water, today);
          return {
            waterId: water.id,
            waterName: water.name,
            threshold: rule.greatDay.threshold,
            loaded: plan.days.length > 0,
            days: plan.days
              .filter((day) => day.score !== null && day.score >= rule.greatDay.threshold && day.date > today)
              .map((day) => ({ date: day.date, label: day.label, score: day.score, reason: day.reason }))
          };
        })
        .filter((entry) => entry.loaded)
        .map(({ loaded, ...entry }) => entry);
    }

    function postGreatDaySchedule() {
      const schedule = greatDaySchedule();
      if (!schedule.length) return false;
      return postAlertsMessage({ action: "scheduleGreatDays", waters: schedule });
    }

    // After the daily sync: only waters with a great-day alert, and only when
    // the angler has turned one on, so a daily open without alerts makes no
    // extra request.
    function refreshGreatDayForecasts() {
      const list = greatDayAlertWaters();
      if (!list.length || navigator.onLine === false) return Promise.resolve(false);
      return loadPlannerForecasts({ waterList: list });
    }

    function alertPermissionLine() {
      if (!hasAlertsBridge()) return "Rules are saved on this device. Notifications are delivered by The Rise iOS app.";
      if (alertPermission === "denied") return "Notifications are off for The Rise in iOS Settings, so these alerts cannot be delivered.";
      if (alertPermission === "granted" || alertPermission === "provisional") {
        return "Notifications on. iOS decides when background checks run - usually a few times a day, not on a fixed schedule.";
      }
      return "iOS asks for notification permission the first time you turn an alert on.";
    }

    function alertRuleSummary(waterId) {
      const rule = alertRuleFor(waterId);
      const parts = [];
      if (rule.flow.enabled) {
        parts.push(flowRangeValid(rule)
          ? `Flow ${rule.flow.min.toLocaleString("en-US")}-${rule.flow.max.toLocaleString("en-US")} cfs`
          : "Flow alert needs a minimum below the maximum");
      }
      if (rule.greatDay.enabled) parts.push(`Great day at ${rule.greatDay.threshold.toFixed(1)}+`);
      return parts.length ? parts.join(" - ") : "No alerts";
    }

    function alertsOverview() {
      const saved = validWaterIds(savedWaterIds);
      return `
        <div class="alerts-overview">
          <div class="alerts-overview-head">
            <strong>Alerts for saved waters</strong>
            <span>Local notifications worked out on this phone. Nothing is sent to a server.</span>
          </div>
          ${saved.length ? `
            <ul class="alerts-list">
              ${saved.map((waterId) => `
                <li>
                  <div>
                    <b>${esc(waterById(waterId).name)}${alertsPaused(waterId) ? ` ${esc(alertRuleSummary(waterId) === "No alerts" ? "(hidden)" : "(hidden - alerts paused)")}` : ""}</b>
                    <span>${esc(alertRuleSummary(waterId))}</span>
                  </div>
                  <button class="ghost-btn" data-edit-alerts="${attr(waterId)}">Set alerts</button>
                </li>
              `).join("")}
            </ul>
          ` : `<p class="subtle">Save a water with its star to set an alert for it.</p>`}
          <p class="subtle">${esc(alertPermissionLine())}</p>
        </div>
      `;
    }

    function alertEditor(water) {
      const id = attr(water.id);
      if (!savedWaterIds.includes(water.id)) {
        return `
          <div class="alert-editor" data-alert-editor="${id}">
            <div class="alert-editor-head">
              <strong>Alerts</strong>
              <span>Save this water to get a local notification when its flow is in your range or a great day is coming.</span>
            </div>
            <button class="ghost-btn" data-save-water="${id}">Save water</button>
          </div>
        `;
      }
      const rule = alertRuleFor(water.id);
      const gauge = liveSources[water.id]?.usgs;
      const flowWarning = rule.flow.enabled && !flowRangeValid(rule) ? "Set a minimum below the maximum, or this alert stays off." : "";
      return `
        <div class="alert-editor" data-alert-editor="${id}">
          <div class="alert-editor-head">
            <strong>Alerts</strong>
            <span>Local notifications from this phone. Nothing is sent to a server.</span>
          </div>
          ${gauge ? `
            <div class="alert-rule">
              <button class="ghost-btn alert-toggle ${rule.flow.enabled ? "active" : ""}" data-alert-toggle="flow" data-alert-water="${id}" aria-pressed="${rule.flow.enabled}">Flow in my range: ${rule.flow.enabled ? "On" : "Off"}</button>
              <div class="alert-fields">
                <label>Min cfs<input type="number" inputmode="numeric" min="0" step="1" data-alert-field="flowMin" data-alert-water="${id}" value="${attr(rule.flow.min ?? "")}"></label>
                <label>Max cfs<input type="number" inputmode="numeric" min="0" step="1" data-alert-field="flowMax" data-alert-water="${id}" value="${attr(rule.flow.max ?? "")}"></label>
              </div>
              <small>${flowWarning ? esc(flowWarning) : `Read from USGS gauge ${esc(gauge)} in the background when iOS allows. At most one alert a day, when the flow moves into your range.`}</small>
            </div>
          ` : `
            <div class="alert-rule">
              <small>Flow alerts need a USGS gauge, and none is mapped to this water.</small>
            </div>
          `}
          <div class="alert-rule">
            <button class="ghost-btn alert-toggle ${rule.greatDay.enabled ? "active" : ""}" data-alert-toggle="greatDay" data-alert-water="${id}" aria-pressed="${rule.greatDay.enabled}">Great day ahead: ${rule.greatDay.enabled ? "On" : "Off"}</button>
            <div class="alert-fields">
              <label>When a day scores at least<select data-alert-field="threshold" data-alert-water="${id}">
                ${GREAT_DAY_THRESHOLDS.map((value) => `<option value="${value}" ${value === rule.greatDay.threshold ? "selected" : ""}>${value.toFixed(1)}</option>`).join("")}
              </select></label>
            </div>
            <small>Uses the Plan the week day score - forecast weather and season, not gauges. Sent about 6 PM the evening before.</small>
          </div>
          ${alertsPaused(water.id) ? `<p class="subtle alert-paused">This water is hidden, so its alerts are paused. Show it again to resume them.</p>` : ""}
          <p class="subtle alert-editor-status">${esc(alertPermissionLine())}</p>
        </div>
      `;
    }

    // Answers to setRules and status requests from the container.
    /* Every setRules gets a reply, so most replies change nothing and must
       not rebuild the alert editor under the angler's finger. A permission
       that has just been given - at the prompt, or later in iOS Settings -
       re-sends the great-day schedule: one sent while the prompt was up was
       dropped by the container. */
    window.riseAlertsResult = function(result) {
      if (result?.action !== "permission") return;
      const status = String(result.status || "");
      const next = ["granted", "denied", "notDetermined", "provisional"].includes(status) ? status : "unknown";
      if (next === alertPermission) return;
      const wasDeliverable = ["granted", "provisional"].includes(alertPermission);
      alertPermission = next;
      if (!wasDeliverable && ["granted", "provisional"].includes(next)) postGreatDaySchedule();
      if (document.activeElement?.matches?.("[data-alert-field]")) {
        document.querySelectorAll(".alert-editor-status").forEach((line) => { line.textContent = alertPermissionLine(); });
        renderScreens(...["today", "waters"].filter((id) => id !== activeScreenId()));
        return;
      }
      renderScreens("today", "waters");
    };

    // The container keeps its own copy of the rules. If WebKit evicted this
    // page's storage, the container's copy comes back here rather than the
    // angler's alerts silently living on with no way to see or turn them off.
    window.riseAlertsRestore = function(payload) {
      if (Object.keys(alertRules).length) return;
      const restored = {};
      (Array.isArray(payload?.rules) ? payload.rules : []).forEach((rule) => {
        const water = waterById(String(rule?.waterId || ""));
        if (!water) return;
        restored[water.id] = {
          flow: rule.flow ? { enabled: true, min: rule.flow.min, max: rule.flow.max } : { enabled: false },
          greatDay: rule.greatDay ? { enabled: true, threshold: rule.greatDay.threshold } : { enabled: false }
        };
      });
      if (!Object.keys(restored).length) return;
      alertRules = normalizeAlertRules(restored);
      writeStoredObject(ALERT_RULES_KEY, alertRules);
      savedWaterIds = validWaterIds([...savedWaterIds, ...Object.keys(alertRules)]);
      writeStoredArray(SAVED_WATERS_KEY, savedWaterIds);
      renderScreens("today", "waters");
    };

    function numberFromText(text) {
      const match = String(text || "").match(/-?\d+(\.\d+)?/);
      return match ? Number(match[0]) : null;
    }

    /* ---------------------------------------------------------------------
       Data provenance.

       Only 14 of the waters have any live feed and only 6 have a USGS gauge.
       Every displayed reading now reports where it came from, so a seasonal
       reference number can never be mistaken for a current measurement.
       --------------------------------------------------------------------- */

    // "measured" - fetched from USGS or NWS this session or from the local cache.
    // "reference" - the seasonal value recorded in the app's own data.
    // "unavailable" - no source exists and no honest value can be shown.
    function valueProvenance(water, key) {
      const report = liveReports.byWater[water.id];
      const freshness = report?.status === "ready" ? reportFreshness(report) : null;
      const ready = freshness === "fresh" || freshness === "stale";
      // A reading past the fresh window is still a real measurement, but it is
      // not a current one, and it must not be presented as one.
      const measured = freshness === "stale" ? "stale" : "measured";
      if (key === "flow") {
        if (water.type === "Lake") return "reference";
        if (!hasGauge(water)) return "unavailable";
        return ready && report.usgs?.flow ? measured : "reference";
      }
      if (key === "temp") {
        if (!hasGauge(water)) return "reference";
        return ready && report.usgs?.waterTemp ? measured : "reference";
      }
      if (key === "air" || key === "wind") {
        if (!hasLiveSource(water)) return "reference";
        return ready && report.nws?.[key] ? measured : "reference";
      }
      return "reference";
    }

    function liveDisplayValue(water, key) {
      const report = liveReports.byWater[water.id];
      if (key === "flow" && water.type !== "Lake" && !hasGauge(water)) return "No live gauge";
      if (report?.status !== "ready" || reportFreshness(report) === "expired") return water[key];
      if (key === "flow") return report.usgs?.flow || water.flow;
      if (key === "temp") return report.usgs?.waterTemp || water.temp;
      if (key === "air") return report.nws?.air || water.air;
      if (key === "wind") return report.nws?.wind || water.wind;
      return water[key];
    }

    // Short suffix rendered next to a reading so the origin travels with the number.
    function provenanceTag(water, key) {
      const provenance = valueProvenance(water, key);
      if (provenance === "measured") return `<em class="prov measured">measured</em>`;
      if (provenance === "stale") {
        return `<em class="prov stale">measured ${esc(ageLabel(reportAgeHours(liveReports.byWater[water.id])))}</em>`;
      }
      if (provenance === "unavailable") return "";
      return `<em class="prov reference">reference</em>`;
    }

    function waterDataNotice(water) {
      if (hasGauge(water)) return "";
      if (hasLiveSource(water)) {
        return "Forecast is live for this water. Flow and water temperature are seasonal reference values - no gauge is mapped here.";
      }
      return "No live gauge or forecast feed is mapped to this water. Every reading below is a seasonal reference value, not a current measurement. Check conditions before you drive.";
    }

    /* Worked flies first, ignored flies last. Given a water, the flies the
       angler has proven there - two or more fish logged on them - rise with
       the worked ones and lead them, most fish first. An explicit "Ignore"
       still wins over history: the angler said so more recently. */
    function applyFlyFeedback(flies, water = null) {
      const unique = uniqueItems(flies);
      const proven = water ? provenFliesFor(water).map((item) => item.fly) : [];
      const provenRank = (fly) => {
        const rank = proven.indexOf(fly);
        return rank === -1 ? proven.length : rank;
      };
      const rises = (fly) => flyFeedback[fly] !== "ignored" && (flyFeedback[fly] === "worked" || proven.includes(fly));
      return [
        ...unique.filter(rises).sort((a, b) => provenRank(a) - provenRank(b)),
        ...unique.filter((fly) => !rises(fly) && flyFeedback[fly] !== "ignored"),
        ...unique.filter((fly) => flyFeedback[fly] === "ignored")
      ];
    }

    function liveRecommendedFlies(water) {
      // Only measured conditions pick flies. The seed temperature is a summer
      // value, so falling back to it put damsels and PMDs in a January box.
      const report = usableReport(water);
      const waterTemp = numberFromText(report?.usgs?.waterTemp);
      const wind = numberFromText(report?.nws?.wind);
      const forecast = `${report?.nws?.forecast || ""}`.toLowerCase();
      const hatchText = predictedHatches(water).join(" ").toLowerCase();
      const intel = localIntelForWater(water);
      const flies = [...intel.flies, ...water.flies];
      if (water.type === "Lake") {
        if (wind !== null && wind >= 12) flies.unshift("Balanced Leech #10");
        if (waterTemp !== null && waterTemp >= 56) flies.unshift("Damsel Nymph #12", "Callibaetis Spinner #16");
        else flies.unshift("Chromie #16", "Ice Cream Cone #16");
      } else {
        if (waterTemp !== null && waterTemp < 50) flies.unshift("BWO Emerger #18", "Zebra Midge #20");
        if (waterTemp !== null && waterTemp >= 50 && waterTemp <= 58) flies.unshift("PMD Sparkle Dun #16", "PMD Emerger #16");
        if (forecast.includes("cloud") || forecast.includes("rain")) flies.unshift("BWO Soft Hackle #18");
        if (hatchText.includes("caddis")) flies.unshift("X-Caddis #16");
      }
      // A fly the angler has proven here is a candidate even if no rule above
      // picked it. It still has to pass the water and season gates below: a
      // June dry that caught fish is not a January pick.
      // The name is the angler's own typing, so it is held to plain text as
      // well: the fly views escape it, and this keeps markup out of the many
      // places a recommended fly name travels.
      flies.push(...provenFliesFor(water).map((item) => item.fly).filter((fly) => /^[^<>"`&]{1,60}$/.test(fly)));
      return applyFlyFeedback(waterAppropriateFlies(flies, water, { fallback: true }), water).slice(0, 4);
    }

    function flyRecommendationReason(water, fly) {
      const text = String(fly || "").toLowerCase();
      const hatches = predictedHatches(water).join(" / ");
      // Only a report the app may still reason from, and only what it
      // measured: an expired forecast or the seed wind is not today's.
      const report = usableReport(water);
      const forecast = `${report?.nws?.forecast || ""}`.toLowerCase();
      const wind = numberFromText(report?.nws?.wind);
      const measuredTemp = ["measured", "stale"].includes(valueProvenance(water, "temp"));
      const temp = measuredTemp ? liveDisplayValue(water, "temp") : "";
      const intel = localIntelForWater(water);
      if (intel.flies?.includes(fly)) return `Local report signal mentioned this pattern; pair with ${hatches}.`;
      if (text.includes("leech") || text.includes("bugger") || text.includes("minnow") || text.includes("muddler")) {
        return water.type === "Lake"
          ? `${wind !== null && wind >= 10 ? "Wind lanes" : "Low light and edges"} make movement easier for trout to track.`
          : "Use when fish are hunting edges, shade, or off-color water.";
      }
      if (text.includes("chironomid") || text.includes("chromie") || text.includes("midge") || text.includes("zebra")) {
        return water.type === "Lake"
          ? `Stillwater depth control pick for ${temp ? `${temp} water and ` : ""}suspended fish.`
          : `Cold clear water pick when small midges matter more than profile size.`;
      }
      if (text.includes("damsel")) return "Matches damsel movement around weed beds, reeds, and warm stillwater shallows.";
      if (text.includes("caddis") || text.includes("sedge") || text.includes("x-")) return "Matches caddis activity; fish it near riffles, banks, or evening surface movement.";
      if (text.includes("pmd") || text.includes("sparkle") || text.includes("split case")) return "Matches PMD emergence when water temperature and light create a surface window.";
      if (text.includes("bwo") || text.includes("rs2") || text.includes("soft hackle")) return forecast.includes("cloud") || forecast.includes("rain")
        ? "Cloud cover favors BWO emergers and soft hackles."
        : "Small mayfly profile for clear water and technical feeding.";
      if (text.includes("stone") || text.includes("rubber") || text.includes("sally")) return "Stonefly/searching choice for riffles, banks, and broken water.";
      if (text.includes("ant") || text.includes("beetle") || text.includes("hopper")) return "Terrestrial option for warm banks, grass edges, and afternoon wind.";
      return `Chosen to cover ${hatches || "today's expected food"} with current water and weather.`;
    }

    function confidenceForWater(water) {
      const report = liveReports.byWater[water.id];
      const intel = localIntelForWater(water);
      if (report?.status === "ready" && intel.sources?.length) return "High confidence";
      if (report?.status === "ready" || intel.sources?.length || navigator.onLine === false && cachedWaterCount()) return "Mixed reports";
      return "Weather-driven guess";
    }

    function confidenceClass(label) {
      return String(label || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    }

    function waterLogicLabel(water) {
      return water.type === "Lake" ? "Stillwater logic" : "River logic";
    }

    function waterLogicDescription(water) {
      if (water.type === "Lake") return "Weights wind lanes, surface chop, weed-bed activity, depth control, and stillwater bugs.";
      return "Weights flow stability, water temperature, clarity, cloud cover, riffle hatches, and bank movement.";
    }

    function flyConfidenceFor(water, fly) {
      const intel = localIntelForWater(water);
      const text = String(fly || "").toLowerCase();
      const hatchText = predictedHatches(water).join(" ").toLowerCase();
      const memory = personalMemoryFor(water);
      if (flyFeedback[fly] === "worked") return "Your history";
      if (memory.logs.some((entry) => entry.fly === fly)) return "Worked here";
      if (intel.flies?.includes(fly)) return "Local report signal";
      if (hatchText && hatchText.split(/\s+/).some((word) => word.length > 3 && text.includes(word))) return "Match the hatch";
      if (text.includes("leech") || text.includes("bugger") || text.includes("minnow") || text.includes("hopper") || text.includes("ant") || text.includes("beetle")) return "Weather play";
      if (confidenceForWater(water) === "High confidence") return "High confidence";
      return confidenceForWater(water);
    }

    function scoreBreakdownItems(water) {
      // Explains only what fishScore used: measured readings from a report that
      // has not expired. A reference value is shown as one, and says it did
      // not move the score, rather than being explained as if it had.
      const report = usableReport(water);
      const intel = localIntelForWater(water);
      const waterTemp = numberFromText(report?.usgs?.waterTemp);
      const wind = numberFromText(report?.nws?.wind);
      const forecast = `${report?.nws?.forecast || ""}`;
      const clarity = clarityFor(water);
      const hatches = predictedHatches(water).slice(0, 3).join(", ");
      const unmeasured = "Reference value - not measured, so it does not move the score";
      const tempText = waterTemp === null ? unmeasured : water.type === "Lake"
        ? waterTemp >= 52 && waterTemp <= 62 ? "In the stillwater comfort band" : "Outside the ideal lake band"
        : waterTemp >= 50 && waterTemp <= 58 ? "In the best river hatch band" : "Less ideal for river hatches";
      const windText = wind === null ? unmeasured : water.type === "Lake"
        ? wind >= 4 && wind <= 11 ? "Good chop without blowing out lanes" : "Wind is a bigger variable"
        : wind > 18 ? "Wind may hurt presentation" : "Wind is not a major limiter";
      const month = currentMonth();
      const inSeason = (water.hatch || []).filter((hatch) => hatchSeasonFit(hatch, month) === 1);
      const seasonText = inSeason.length
        ? `${inSeason.length} of ${water.hatch.length} listed ${water.hatch.length === 1 ? "hatch is" : "hatches are"} in season now`.replace(/^1 of (\d+) listed hatches are/, "1 of $1 listed hatches is")
        : "None of this water's listed hatches are in season this month";
      const window = primeWindowHours(water);
      const timeText = window
        ? `Best window ${formatHour(window[0])}-${formatHour(window[1])}; it is ${formatHour(currentHour())} now`
        : "Wind is deciding the window today";
      const regulation = regulationSeasonDetail(water);
      const regulationRows = regulation.status === "closed"
        ? [["ODFW season", "Closed today", `Closed season under the ${regulationCheckedLine(regulationFor(water))}. Ranked after every open water; the rating below is conditions only.${regulationsStaleness() ? ` ${regulationsStaleness().message}` : ""}`]]
        : regulation.status === "partial"
          ? [["ODFW season", "Some sections closed", `Open today: ${regulation.open.join("; ")}. Closed today: ${regulation.closed.join("; ")}.`]]
          : [];
      return [
        ...regulationRows,
        ["Season", seasonLabelFor(inSeason[0] || water.hatch?.[0]) || "Year-round", seasonText],
        ["Time of day", `${Math.round(timeOfDayFit(water) * 100)}% of window`, timeText],
        ["Water temp", liveDisplayValue(water, "temp"), tempText],
        [
          water.type === "Lake" ? "Wind lanes" : "Flow",
          water.type === "Lake" ? liveDisplayValue(water, "wind") : liveDisplayValue(water, "flow"),
          water.type === "Lake" ? windText : (flowContextLabel(water) || (hasGauge(water) ? "No gauge reading fetched yet" : "No gauge mapped to this water"))
        ],
        ["Clarity", clarity.label, clarity.trend],
        ["Hatches", hatches || "No hatch signal", `${confidenceForWater(water)} from weather, cache, and reports`],
        ["Local intelligence", intel.sources?.length ? intel.sources.slice(0, 2).join(" + ") : "No local source hit yet", intel.cues?.length ? intel.cues.slice(0, 2).join(", ") : forecast || "Using baseline profile"],
        personalHistoryBreakdown(water)
      ];
    }

    /* ---------------------------------------------------------------------
       Pro gating.

       proAccessActive previously only relabelled the Subscribe button. These are
       the features the subscription actually buys, and the paywall now lists
       only these. Nothing that used to be free before launch is charged for
       twice: rankings, live readings, hatches, flies, bugs and the catch
       log all stay free.
       --------------------------------------------------------------------- */

    const PRO_FEATURES = [
      ["Flow history", "Every gauge reading this device takes is recorded and charted, so you can see whether today is high or low against days you have actually fished."],
      ["Rating breakdown", "The full numeric explanation behind a water's score: season fit, time of day, flow against reference, temperature, wind and forecast."],
      ["Fish this plan", "A staged plan for the water: what to fish, where, and in what order for the current window."],
      ["Hatch ID assistant", "Filter by size, colour, water type and behaviour to narrow what you are looking at, then jump straight to matching fly patterns. Snap a bug adds a photo you can sample a colour from and compare against the closest bugs - you confirm every trait; the app does not recognise bugs from photos."]
    ];

    /* ---------------------------------------------------------------------
       First run.

       A fresh install lands on Today with no saved location, no cached
       readings and an empty journal - which is to say, with none of the three
       things the whole app is built on. Everything on screen was seasonal
       reference data, and nothing told a new angler (or an App Review tester,
       who sees exactly this) that a sync had never run.

       Three steps, each with the button that performs it and a done state it
       checks for itself, so the panel is a record of what is actually set up
       rather than a tour that claims to be finished.
       --------------------------------------------------------------------- */

    function onboardingSteps() {
      return [
        [
          "readings",
          Boolean(cachedWaterCount()),
          "Get today's readings",
          "Pull live gauge and forecast data for the waters you use, and save it so the app still works when you lose signal in the canyon.",
          `<button class="ghost-btn" data-refresh-all>${liveReports.bulkStatus ? "Updating..." : "Get readings"}</button>`
        ],
        [
          "location",
          Boolean(userLocation),
          "Rank waters by distance",
          `Sort all ${waters.length} Central Oregon waters by how far they are from where you are standing. The location stays on this device.`,
          `<button class="ghost-btn" data-use-location>${locationStatus === "loading" ? "Locating..." : "Use Location"}</button>`
        ],
        [
          "log",
          getLogs().length > 0,
          "Log your first catch",
