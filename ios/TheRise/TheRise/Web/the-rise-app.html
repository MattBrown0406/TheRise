    /* ---------------------------------------------------------------------
       On the water.

       Trip mode, for standing in the river: wet hands, gloves, sun on the
       screen, a rod in the other hand. Every action is one tap on a target
       at least 64pt tall, the type is big, and black on white because that
       is what stays readable in direct sun.

       Its three moving parts are each owned in one place:
       - the countdown timer runs only while this view is on screen and the
         app is visible; syncOnWaterLifecycle() is the only thing that starts
         or stops it, and it is idempotent, so re-rendering cannot stack a
         second interval;
       - the screen wake lock follows the same rule, and is asked for again
         when the app comes back, because iOS and the browser drop it on hide;
       - Fish on! writes through setLogs like every other journal write, fails
         closed with the error on screen, and ignores a second tap inside two
         seconds so a double-tap is one fish.
       --------------------------------------------------------------------- */
    const ON_WATER_TICK_MS = 15000;
    const FISH_ON_REPEAT_MS = 2000;
    const FISH_ON_UNDO_MS = 8000;
    const ON_WATER_MATCH_MILES = 2;

    let onWaterOpen = false;
    let onWaterTimer = null;
    let onWaterWakeLock = null;
    let onWaterWakeLockPending = false;
    let onWaterNotice = "";
    let onWaterError = "";
    let onWaterLocating = false;
    // Bumped by every "Which water am I on?" request and by Exit, so a fix
    // that arrives after the view closed, or after a newer request, is dropped.
    let onWaterLocateToken = 0;
    // A fix less precise than this cannot say which of two nearby waters the
    // angler is standing on (about a mile).
    const ON_WATER_MAX_ACCURACY_M = 1600;
    // Session-only, by water: the flies the angler has said are not working
    // today, so "next fly" keeps its place while they move around the app.
    let onWaterTriedFlies = {};
    // Session-only, by water: the fly list "Next fly" walks, frozen when the
    // view first shows that water. The live list re-sorts as feedback lands,
    // so walking it put every "next" fly back at position 1 and let a fifth
    // fly slide in.
    let onWaterFlyOrder = {};
    let lastFishOnAt = 0;
    let lastFishOnEntry = null;
    let fishOnUndo = null;
    let fishOnUndoTimer = null;
    // The last content posted to the Live Activity bridge, or null when no
    // activity is running.
    let liveActivityPosted = null;

    function onWaterShouldRun() {
      return onWaterOpen && activeScreenId() === "trip" && !document.hidden;
    }

    function syncOnWaterLifecycle() {
      if (onWaterShouldRun()) {
        if (onWaterTimer === null) onWaterTimer = setInterval(tickOnWater, ON_WATER_TICK_MS);
        acquireOnWaterWakeLock();
      } else {
        stopOnWaterTimer();
        releaseOnWaterWakeLock();
      }
    }

    function stopOnWaterTimer() {
      if (onWaterTimer === null) return;
      clearInterval(onWaterTimer);
      onWaterTimer = null;
    }

    // Repaints the countdown text in place. A whole re-render every 15 seconds
    // would rebuild the buttons under a finger that is about to tap one.
    function tickOnWater() {
      if (!onWaterShouldRun()) {
        syncOnWaterLifecycle();
        return;
      }
      const water = tripWater();
      const countdown = primeWindowCountdown(water);
      const node = document.querySelector("#trip [data-on-water-countdown]");
      const block = node?.closest?.("[data-on-water-window]");
      if (block && block.dataset.onWaterWindow !== countdown.state) {
        renderTrip();
        return;
      }
      if (node) node.textContent = countdown.text;
      syncLiveActivity(water);
    }

    function acquireOnWaterWakeLock() {
      if (onWaterWakeLock || onWaterWakeLockPending) return;
      const wakeLock = navigator.wakeLock;
      if (!wakeLock || typeof wakeLock.request !== "function") return;
      onWaterWakeLockPending = true;
      Promise.resolve()
        .then(() => wakeLock.request("screen"))
        .then((lock) => {
          onWaterWakeLockPending = false;
          if (!lock) return;
          // Closed or hidden while the request was pending.
          if (!onWaterShouldRun()) {
            Promise.resolve(lock.release?.()).catch(() => {});
            return;
          }
          onWaterWakeLock = lock;
          lock.onrelease = () => {
            if (onWaterWakeLock === lock) onWaterWakeLock = null;
          };
        })
        .catch(() => {
          // Unsupported, refused or not visible: the screen just sleeps as usual.
          onWaterWakeLockPending = false;
        });
    }

    function releaseOnWaterWakeLock() {
      const lock = onWaterWakeLock;
      onWaterWakeLock = null;
      if (!lock) return;
      try {
        Promise.resolve(lock.release?.()).catch(() => {});
      } catch {
        // Already released by the system.
      }
    }

    // Registered once, at startup, like every other document listener.
    function startOnWaterLifecycleWatcher() {
      document.addEventListener("visibilitychange", () => {
        syncOnWaterLifecycle();
        if (onWaterShouldRun()) tickOnWater();
      });
    }

    function durationLabel(seconds) {
      const minutes = Math.max(1, Math.ceil(seconds / 60));
      const hours = Math.floor(minutes / 60);
      const rest = minutes % 60;
      if (!hours) return `${rest}m`;
      return rest ? `${hours}h ${rest}m` : `${hours}h`;
    }

    // The same window primeWindowFor describes, counted down on Oregon's
    // clock. start and end are real instants, for the Live Activity timer.
    function primeWindowCountdown(water, now = new Date()) {
      const window = primeWindowHours(water);
      if (!window) {
        return { state: "unknown", text: "Prime window: first calm hour", range: "Wind is deciding the window today", start: null, end: null };
      }
      const [startHour, endHour] = window;
      const parts = zonedParts(now);
      const secondsNow = parts.hour * 3600 + parts.minute * 60 + parts.second;
      const midnight = Math.floor(now.getTime() / 1000) * 1000 - secondsNow * 1000;
      const start = new Date(midnight + startHour * 3600000);
      const end = new Date(midnight + endHour * 3600000);
      const range = `${formatHour(startHour)}-${formatHour(endHour)} Pacific`;
      if (secondsNow < startHour * 3600) {
        return { state: "before", text: `Prime window starts in ${durationLabel(startHour * 3600 - secondsNow)}`, range, start, end };
      }
      if (secondsNow < endHour * 3600) {
        return { state: "during", text: `Prime window ends in ${durationLabel(endHour * 3600 - secondsNow)}`, range, start, end };
      }
      return { state: "after", text: "Prime window has passed for today", range, start, end };
    }

    function onWaterFlies(water) {
      if (!onWaterOpen) return liveRecommendedFlies(water);
      if (!onWaterFlyOrder[water.id]) onWaterFlyOrder[water.id] = liveRecommendedFlies(water);
      return onWaterFlyOrder[water.id];
    }

    function onWaterCurrentFly(water) {
      const flies = onWaterFlies(water);
      const tried = onWaterTriedFlies[water.id] || [];
      return flies.find((fly) => !tried.includes(fly)) || flies[0] || "";
    }

    // "Not working - next fly": marks the fly ignored in the same fly
    // feedback the Worked/Ignore buttons write, and moves on. A fly that has
    // caught fish - marked Worked, or proven on this water in the journal - is
    // only skipped for this session: one slow hour must not overwrite that.
    // Once every fly on the list has been tried, it starts again from the top.
    function nextOnWaterFly(waterId) {
      const water = waterById(waterId) || tripWater();
      const current = onWaterCurrentFly(water);
      if (!current) return;
      const proven = provenFliesFor(water).some((item) => item.fly === current);
      if (flyFeedback[current] !== "worked" && !proven) setFlyFeedback(current, "ignored", { toggle: false });
      const tried = uniqueItems([...(onWaterTriedFlies[water.id] || []), current]);
      const flies = onWaterFlies(water);
      onWaterTriedFlies[water.id] = flies.every((fly) => tried.includes(fly)) ? [] : tried;
      onWaterError = "";
      renderScreens("today", "waters", "bugs", "trip");
    }

    // Exactly what writeLogEntry stamps on a new catch, with the form's
    // fields left for "Add details": nothing the angler did not enter is
    // invented, so the species is blank rather than guessed.
    function fishOnEntry(water, fly, now) {
      return {
        loggedAt: now.toISOString(),
        date: zonedDateLabel(now),
        time: zonedTimeLabel(now),
        waterName: water.name,
        waterId: water.id,
        fly: fly || "",
        fish: "",
        length: "",
        count: "1",
        notes: "",
        flow: liveDisplayValue(water, "flow"),
        flowSource: valueProvenance(water, "flow"),
        temp: liveDisplayValue(water, "temp"),
        tempSource: valueProvenance(water, "temp"),
        photoId: "",
        photo: ""
      };
    }

    function clearFishOnUndo() {
      clearTimeout(fishOnUndoTimer);
      fishOnUndoTimer = null;
      fishOnUndo = null;
    }

    function fishOn(waterId, fly) {
      const nowMs = Date.now();
      // The second half of a double-tap lands on the re-rendered button.
      if (nowMs - lastFishOnAt < FISH_ON_REPEAT_MS) return false;
      const water = waterById(waterId) || tripWater();
      const entry = fishOnEntry(water, fly, new Date(nowMs));
      const logs = getLogs();
      if (!setLogs([entry, ...logs])) {
        onWaterError = "This catch could not be saved to this device. Nothing was logged. Free up storage and try again.";
        onWaterNotice = "";
        renderScreens("trip");
        return false;
      }
      lastFishOnAt = nowMs;
      // Every index moved down one. An edit form left open on the Log screen
      // must follow its catch, or Update would write onto the next one.
      if (editingLogIndex !== null) editingLogIndex += 1;
      const previousFeedback = flyFeedback[entry.fly];
      if (entry.fly) setFlyFeedback(entry.fly, "worked", { toggle: false });
      clearFishOnUndo();
      fishOnUndo = { entry, previousFeedback };
      fishOnUndoTimer = setTimeout(() => {
        fishOnUndoTimer = null;
        fishOnUndo = null;
        renderScreens("trip");
      }, FISH_ON_UNDO_MS);
      lastFishOnEntry = entry;
      onWaterError = "";
      onWaterNotice = "";
      maybeCompleteOnboarding();
      renderScreens("today", "waters", "log", "trip");
      return true;
    }

    // Removes exactly the catch Fish on! wrote - found by identity, never by
    // position - and puts the fly feedback back the way it was.
    function undoFishOn() {
      const pending = fishOnUndo;
      if (!pending) return;
      clearFishOnUndo();
      const logs = getLogs();
      const index = logs.indexOf(pending.entry);
      if (index === -1) {
        onWaterError = "That catch has changed since it was logged, so it was left in your journal.";
        renderScreens("trip");
        return;
      }
      if (!setLogs(logs.filter((_, itemIndex) => itemIndex !== index))) {
        onWaterError = "That catch could not be removed on this device. It is still in your journal.";
        renderScreens("trip");
        return;
      }
      deleteStoredPhoto(pending.entry);
      if (editingLogIndex === index) {
        editingLogIndex = null;
        logFormOpen = false;
      } else if (editingLogIndex !== null && editingLogIndex > index) {
        editingLogIndex -= 1;
      }
      const fly = pending.entry.fly;
      if (fly && flyFeedback[fly] === "worked" && pending.previousFeedback !== "worked") {
        if (pending.previousFeedback) flyFeedback[fly] = pending.previousFeedback;
        else delete flyFeedback[fly];
        writeStoredObject(FLY_FEEDBACK_KEY, flyFeedback);
      }
      if (lastFishOnEntry === pending.entry) lastFishOnEntry = null;
      lastFishOnAt = 0;
      onWaterError = "";
      onWaterNotice = "Catch removed from your journal.";
      renderScreens("today", "waters", "log", "trip");
    }

    // Opens the ordinary edit form on the catch Fish on! just wrote.
    function openFishOnDetails() {
      const index = lastFishOnEntry ? getLogs().indexOf(lastFishOnEntry) : -1;
      if (index === -1) {
        lastFishOnEntry = null;
        onWaterError = "That catch is no longer in your journal.";
        renderScreens("trip");
        return;
      }
      // Editing it is keeping it.
      clearFishOnUndo();
      editingLogIndex = index;
      logFormOpen = true;
      logSaveMessage = "";
      // A bug photo waiting for a new catch belongs to that draft, not to
      // this edit, and must not ride on to a later, unrelated catch.
      pendingCatchPhoto = "";
      renderLog();
      activateTab("log");
      // Undo is gone; On the water must not still offer it when it is back.
      renderScreens("trip");
      scrollAppTo("#logForm");
    }

    function nearestWaterWithin(maxMiles = ON_WATER_MATCH_MILES) {
      let best = null;
      waters.forEach((water) => {
        if (hiddenWaterIds.includes(water.id)) return;
        const miles = distanceToWater(water);
        if (miles === null || miles > maxMiles) return;
        if (!best || miles < best.miles) best = { water, miles };
      });
      return best;
    }

    function locateOnWater() {
      if (onWaterLocating) return;
      onWaterLocating = true;
      onWaterNotice = "";
      onWaterError = "";
      const token = ++onWaterLocateToken;
      renderScreens("trip");
      // Only an answer to this request, with the view still open, may act:
      // after Exit it would change the water behind the angler's back.
      const current = () => token === onWaterLocateToken && onWaterOpen && onWaterLocating;
      getDevicePosition((location) => {
        if (!current()) return;
        onWaterLocating = false;
        // A coarse fix (cell or Wi-Fi only) can be miles out. It cannot pick
        // between waters, and "under 0.1 mi" from it would be false.
        if (!Number.isFinite(location.accuracy) || location.accuracy > ON_WATER_MAX_ACCURACY_M) {
          onWaterNotice = "Couldn't tell which water you're on - the GPS fix is too rough. Try again in the open, or pick it from All Waters.";
          renderScreens("trip");
          if (activeScreenId() === "trip") scrollAppToTop();
          return;
        }
        saveUserLocation(location);
        locationStatus = "ready";
        const match = nearestWaterWithin();
        if (match) {
          saveActiveWater(match.water.id);
          onWaterNotice = `You look to be on ${match.water.name} - ${match.miles < .1 ? "under 0.1" : match.miles.toFixed(1)} mi from its mapped point.`;
          renderAll();
        } else {
          onWaterNotice = `Couldn't tell which water you're on - none is within ${ON_WATER_MATCH_MILES} miles of you. Pick it from All Waters.`;
          renderScreens("trip", "waters", "today");
        }
        // The answer is the water name and the notice under it, at the top.
        if (activeScreenId() === "trip") scrollAppToTop();
      }, () => {
        if (!current()) return;
        onWaterLocating = false;
        onWaterNotice = "Couldn't get your location. Check Location permission, or pick the water from All Waters.";
        renderScreens("trip");
        if (activeScreenId() === "trip") scrollAppToTop();
      }, { maximumAge: 0 });
    }

    function fishTodayOn(water) {
      const today = pacificDateKey();
      return logsForWater(water).reduce((sum, entry) => {
        const saved = entry.loggedAt ? new Date(entry.loggedAt) : null;
        return saved && !Number.isNaN(saved.getTime()) && pacificDateKey(saved) === today ? sum + fishInEntry(entry) : sum;
      }, 0);
    }

       target with ActivityKit) is not in this build: it needs a new Xcode
       target, App Group and signing, and is described in
       docs/on-the-water-native.md with uncompiled sources in
       ios/pending/LiveActivity/. Until that handler is registered nothing is
       posted - the check below is the whole contract on this side. */
    function liveActivityHandler() {
      return window.webkit?.messageHandlers?.riseLiveActivity || null;
    }

    function liveActivityContent(water) {
      const countdown = primeWindowCountdown(water);
      return {
        waterId: water.id,
        waterName: water.name,
        primeWindowState: countdown.state,
        primeWindowStart: countdown.start ? countdown.start.toISOString() : null,
        primeWindowEnd: countdown.end ? countdown.end.toISOString() : null,
        flow: String(liveDisplayValue(water, "flow") || ""),
        flowSource: valueProvenance(water, "flow"),
        temp: String(liveDisplayValue(water, "temp") || ""),
        tempSource: valueProvenance(water, "temp"),
        nextFly: onWaterCurrentFly(water),
        fishToday: fishTodayOn(water)
      };
    }

    function syncLiveActivity(water) {
      const handler = liveActivityHandler();
      if (!handler) return;
      if (!onWaterOpen) {
        if (liveActivityPosted === null) return;
        liveActivityPosted = null;
        try {
          handler.postMessage({ action: "end" });
        } catch {
          // The Lock Screen card is a convenience; the in-app view is the feature.
        }
        return;
      }
      // Only a change is posted. The countdown itself is drawn by the system
      // from primeWindowEnd, so the 15-second tick sends nothing new.
      const content = liveActivityContent(water);
      const key = JSON.stringify(content);
      if (key === liveActivityPosted) return;
      try {
        handler.postMessage({ action: liveActivityPosted === null ? "start" : "update", ...content });
        liveActivityPosted = key;
      } catch {
        // As above.
      }
    }

    /* ---------------------------------------------------------------------
       Catch log storage.

       Previously: every entry, photo included, was a base64 data URL inside a
       single localStorage key on a file:// origin, and the save path capped the
       journal at eight entries and silently dropped the ninth.

       Now: photos are written to the app container by the native layer and the
       entry keeps only an identifier, so the JSON stays small; the log is
       uncapped; and the whole log is mirrored to a file in Application Support
       so a localStorage eviction cannot take the journal with it.
       --------------------------------------------------------------------- */

    const LOG_STORAGE_KEY = "riseLogs";
    const LOG_SAVED_AT_KEY = "riseLogsSavedAt";
    let logCache = null;
    let logRestoreNotice = "";
    let logStorageUnreadable = false;

    function hasNativeStoreBridge() {
      return Boolean(window.webkit?.messageHandlers?.riseStore);
    }

    function postStoreMessage(payload) {
      if (!hasNativeStoreBridge()) return false;
      try {
        window.webkit.messageHandlers.riseStore.postMessage(payload);
        return true;
      } catch {
        // The native store is a durability mirror; localStorage still holds the log.
        return false;
      }
    }

    function normalizeLogEntry(entry) {
      if (!entry || typeof entry !== "object" || Array.isArray(entry)) return null;
      const normalized = { ...entry };
      // Entries written before dates carried a year are kept and marked, rather
      // than discarded or silently attributed to the current year.
      if (!normalized.loggedAt) {
        normalized.loggedAt = "";
        normalized.dateApproximate = true;
      }
      return normalized;
    }

    function normalizeLogEntries(entries) {
      if (!Array.isArray(entries)) return null;
      const normalized = entries.map(normalizeLogEntry);
      return normalized.every(Boolean) ? normalized : null;
    }

    function readLogsFromStorage() {
      try {
        const saved = localStorage.getItem(LOG_STORAGE_KEY);
        if (saved === null) {
          logStorageUnreadable = false;
          return null;
        }
        const logs = normalizeLogEntries(JSON.parse(saved));
        logStorageUnreadable = logs === null;
        return logs;
      } catch (error) {
        logStorageUnreadable = true;
        return null;
      }
    }

    // The user's own journal, and nothing else. An empty journal is empty.
    function getLogs() {
      if (logCache) return logCache;
      logCache = readLogsFromStorage() || [];
      return logCache;
    }

    function readLogsSavedAt() {
      try {
        return localStorage.getItem(LOG_SAVED_AT_KEY) || "";
      } catch {
        return "";
      }
    }

    // Returns true only after the synchronous local journal write succeeds.
    // Native mirroring is best-effort and cannot stand in for that confirmation.
    function setLogs(logs) {
      getLogs();
      // Missing and unreadable are different. Never turn an unreadable
      // journal into a new empty baseline and overwrite the only original.
      if (logStorageUnreadable) return false;
      const savedAt = new Date().toISOString();
      let localOk = false;
      try {
        localStorage.setItem(LOG_STORAGE_KEY, JSON.stringify(logs));
        localOk = true;
        localStorage.setItem(LOG_SAVED_AT_KEY, savedAt);
      } catch (error) {
        // The journal write may already have succeeded. Do not report it as
        // lost merely because its optional freshness marker hit the quota.
        // An older marker must not let a stale mirror overwrite that new log.
        if (localOk) {
          try { localStorage.removeItem(LOG_SAVED_AT_KEY); } catch {}
        }
      }
      // Mirror to the app container. This is what survives a localStorage purge.
      // The envelope carries the write time so a restore can tell which copy is
      // newer instead of guessing from row counts.
      // A posted message is not a disk-write acknowledgment. Fail closed when
      // localStorage failed, and do not mirror a mutation we report as failed.
      if (localOk) postStoreMessage({ action: "saveLog", body: JSON.stringify({ version: 2, savedAt, logs }) });
      const persisted = localOk;
      // The in-memory journal is only advanced when the write landed somewhere.
      // Assigning it first meant a catch the app had just told the user it
      // could not save stayed in the list for the rest of the session and then
      // vanished at next launch.
      if (persisted) logCache = logs;
      return persisted;
    }

    // Accepts the v2 envelope and the bare array written by earlier builds.
    function parseLogPayload(body) {
      try {
        const parsed = JSON.parse(body || "null");
        if (Array.isArray(parsed)) {
          const logs = normalizeLogEntries(parsed);
          return logs ? { savedAt: "", logs } : null;
        }
        if (parsed && Array.isArray(parsed.logs)) {
          const logs = normalizeLogEntries(parsed.logs);
          return logs ? { savedAt: String(parsed.savedAt || ""), logs } : null;
        }
        return null;
      } catch {
        return null;
      }
    }

    /* Called by the native layer at startup with whatever the container holds.

       This used to replace the journal whenever the container copy had more
       rows in it - the guard compared array lengths and nothing else.
       A stale backup with two deleted catches in it therefore overwrote a live
       journal containing one real one - deleting the real catch and
       resurrecting both deleted ones - because three is more than one.

       The container mirror exists to survive a localStorage purge. It restores
       when localStorage has nothing, or when the container copy is provably
       newer by write time. It never merges on count. */
    window.riseLogRestore = function(payload) {
      const restored = parseLogPayload(payload?.body);
      if (!restored) return;
      const current = readLogsFromStorage();
      if (current !== null) {
        // Both timestamps are required. A journal written by a build that did
        // not record one cannot be proved older than anything, and an
        // unprovable claim must not cost the angler a real catch.
        const localSavedAt = readLogsSavedAt();
        const containerTime = Date.parse(restored.savedAt);
        const localTime = Date.parse(localSavedAt);
        const containerIsNewer = Number.isFinite(containerTime) && Number.isFinite(localTime) && containerTime > localTime;
        if (!containerIsNewer) return;
      }
      // Hold on to what is being edited before the indexes move under it.
      const editingLoggedAt = editingLogIndex !== null ? getLogs()[editingLogIndex]?.loggedAt : null;
      logCache = restored.logs;
      logStorageUnreadable = false;
      try {
        localStorage.setItem(LOG_STORAGE_KEY, JSON.stringify(logCache));
        localStorage.setItem(LOG_SAVED_AT_KEY, restored.savedAt || new Date().toISOString());
      } catch {
        // In-memory restore still gives the user their journal for this session.
      }
      // An open edit form pointed at index 2 would otherwise now be pointed at
      // whatever entry landed at index 2, and Update would write one catch's
      // edits onto another.
      if (editingLogIndex !== null) {
        const movedTo = editingLoggedAt ? logCache.findIndex((entry) => entry.loggedAt === editingLoggedAt) : -1;
        if (movedTo === -1) {
          editingLogIndex = null;
          logFormOpen = false;
          logSaveMessage = "The catch you were editing is not in the restored journal. Nothing was overwritten.";
        } else {
          editingLogIndex = movedTo;
        }
      }
      logRestoreNotice = `Restored ${logCache.length} saved ${logCache.length === 1 ? "catch" : "catches"} from this device's backup.`;
      // The restore lands after the first paint. Today had already drawn the
      // new-install "Log your first catch" panel over an empty journal and
      // queued a scroll to it; a returning angler with a full journal saw the
      // setup screen until something else repainted it.
      if (logCache.length) firstRunScrollPending = false;
      maybeCompleteOnboarding();
      renderLog();
      renderScreens("today", "waters", "trip");
    };

    /* ---------------------------------------------------------------------
       Apple Watch.

       Some anglers leave the phone in the truck. The Watch app works from a
       "trip pack" this page builds: home, saved and top-pick waters with
       their score, prime window, readings (each with its provenance and
       age), flies, hatches and the week's planner days. The container hands
       it to the Watch with WCSession.updateApplicationContext - latest wins -
       and the Watch keeps it on disk, so it still has today's waters with no
       phone and no signal.

       Catches logged on the Watch come back the other way. The container
       writes each one to a file in Application Support before it hands them
       here through window.riseWatchCatches, and deletes one only when this
       page answers catchesSaved for it - which it does only after setLogs
       has returned true. A second delivery of the same catch adds nothing.

       Nothing is posted unless the container registered the riseWatch
       handler, and a pack is posted only when its content changed. The
       message contract is in docs/watch-app.md.
       --------------------------------------------------------------------- */
    const WATCH_PACK_VERSION = 1;
    const WATCH_PACK_MAX_WATERS = 10;
    const WATCH_PACK_FLIES = 6;
    const WATCH_PACK_DEBOUNCE_MS = 1500;
    const WATCH_PROVENANCE = ["measured", "stale", "reference", "unavailable"];
    const WATCH_ID_PATTERN = /^[A-Za-z0-9-]{8,64}$/;
    // Watch catch ids this page has acknowledged, newest last. A catch the
    // angler deleted after it landed must not come back when the Watch or
    // the iPhone delivers it again.
    const WATCH_ACKED_KEY = "riseWatchAcked.v1";
    const WATCH_ACKED_MAX = 500;
    let watchPackTimer = null;
    let watchPackPostedKey = null;
    // { text, error } for the Log screen, or null.
    let watchCatchNotice = null;

    function watchHandler() {
      return window.webkit?.messageHandlers?.riseWatch || null;
    }

    function postWatchMessage(payload) {
      const handler = watchHandler();
      if (!handler) return false;
      try {
        handler.postMessage(payload);
        return true;
      } catch {
        // The Watch is a convenience; the phone app is the record.
        return false;
      }
    }

    function isoOrNull(value) {
      if (!value) return null;
      const time = Date.parse(value);
      return Number.isFinite(time) ? new Date(time).toISOString() : null;
    }

    // Home first, then the saved waters, then today's top pick - ten at most.
    function watchPackWaters() {
      return validWaterIds([homeWaterId, ...savedWaterIds, topRecommendedWater()?.id])
        .slice(0, WATCH_PACK_MAX_WATERS)
        .map(waterById);
    }

    // A reading travels with where it came from and when. The Watch ages it
    // again at the moment of a catch, and never upgrades one: a reference
    // value stays reference however recently the pack arrived.
    function watchPackReading(water, key) {
      const source = valueProvenance(water, key);
      const report = usableReport(water);
      const live = source === "measured" || source === "stale";
      const noGauge = key === "flow" && water.type !== "Lake" && !hasGauge(water);
      return {
        value: String(liveDisplayValue(water, key) ?? ""),
        source,
        observedAt: live ? isoOrNull(report?.usgs?.observedAt) : null,
        cachedAt: live ? isoOrNull(report?.cachedAt) : null,
        // What the Watch falls back to once a measurement is past its expiry,
        // exactly as this page falls back to the seasonal value.
        reference: noGauge ? "" : String(water[key] ?? "")
      };
    }

    // A season window exactly as ODFW_REGULATIONS writes it - { allYear },
    // { from, to } or a named section - so the Watch can evaluate it again
    // on a later day. Copied, never repaired: a malformed window stays
    // malformed and the Watch calls it unknown, as regulationSeasonDetail()
    // does here.
    function watchPackSeasonWindow(window, named = false) {
      const copy = named ? { name: String(window?.name || "") } : {};
      if (window?.allYear === true) return { ...copy, allYear: true };
      return { ...copy, from: String(window?.from || ""), to: String(window?.to || "") };
    }

    /* The ODFW season, as of the pack's date and as rules the Watch can
       re-evaluate by date on Oregon's clock: a pack built Oct 30 must not
       still read fishable Nov 2. `windows` is null when the entry is not
       confirmed (verify, missing or unrecorded season) - the status is then
       always unknown, never open or closed. */
    function watchPackRegulation(water, now) {
      const entry = regulationFor(water);
      const status = regulationSeasonStatus(water, now);
      const season = entry && entry.confidence === "confirmed" ? entry.season : null;
      let windows = null;
      if (season && Array.isArray(season.sections)) {
        windows = { sections: season.sections.map((section) => watchPackSeasonWindow(section, true)) };
      } else if (season) {
        windows = watchPackSeasonWindow(season);
      }
      return {
        status,
        label: regulationStatusLabel(status),
        year: Number(entry?.year || ODFW_REGULATIONS_META.year),
        stale: Boolean(regulationsStaleness()),
        windows
      };
    }

    // "MM-DD" from SEASONAL_ACCESS_CLOSURES' [month, day].
    function watchPackMonthDay(value) {
      if (Array.isArray(value)) return `${String(value[0]).padStart(2, "0")}-${String(value[1]).padStart(2, "0")}`;
      return typeof value === "string" ? value : "";
    }

    /* The typical snow closure for this water, if any, with its window so the
       Watch can tell on a later day. A closure marked partial is not "snowed
       in": some access stays open. */
    function watchPackAccess(water, now) {
      const today = seasonalClosureFor(water, pacificDateKey(now));
      const closure = today || SEASONAL_ACCESS_CLOSURES.find((item) => Array.isArray(item.waters) && item.waters.includes(water.id)) || null;
      if (!closure) return null;
      // Whether this water keeps some access is what seasonalClosureFor()
      // says inside the window, so ask it for the window's first day too.
      const start = watchPackMonthDay(closure.from);
      const atStart = today || (/^\d{2}-\d{2}$/.test(start) ? seasonalClosureFor(water, `2000-${start}`) : null);
      const partial = closure.partial === true || atStart?.partial === true;
      return {
        label: String(closure.label || ""),
        typical: String(closure.typical || ""),
        from: watchPackMonthDay(closure.from),
        to: watchPackMonthDay(closure.to),
        partial,
        snowedIn: Boolean(today) && !partial
      };
    }

    // The planner's days only if the angler loaded them; nothing is fetched
    // for the Watch and nothing is filled in.
    function watchPackPlanner(water) {
      const plan = plannerForWater(water);
      if (!plan.days.length) return null;
      const day = (item) => ({
        date: String(item.date),
        label: String(item.label || ""),
        score: typeof item.score === "number" ? item.score : null,
        reason: String(item.reason || "")
      });
      return { fetchedAt: isoOrNull(plan.fetchedAt), days: plan.days.map(day), best: plan.best ? day(plan.best) : null };
    }

    function buildWatchPack(now = new Date()) {
      const top = topRecommendedWater();
      return {
        version: WATCH_PACK_VERSION,
        generatedAt: now.toISOString(),
        pacificDate: pacificDateKey(now),
        homeWaterId,
        species: [...nativeFish],
        waters: watchPackWaters().map((water) => {
          const coordinates = waterCoordinates[water.id] || null;
          const hours = primeWindowHours(water);
          return {
            id: water.id,
            name: water.name,
            type: water.type,
            home: water.id === homeWaterId,
            saved: savedWaterIds.includes(water.id),
            topPick: water.id === top?.id,
            lat: coordinates ? coordinates.lat : null,
            lon: coordinates ? coordinates.lon : null,
            usgsSite: liveSources[water.id]?.usgs || null,
            score: Number(fishScore(water)),
            scoreSource: scoreSourceLabel(water),
            // Hours on Oregon's clock; null when wind decides the window.
            primeWindow: hours ? { startHour: hours[0], endHour: hours[1] } : null,
            flow: watchPackReading(water, "flow"),
            temp: watchPackReading(water, "temp"),
            flies: uniqueItems([...liveRecommendedFlies(water), ...Object.values(dailyFlyBoxFor(water)).flat()]).slice(0, WATCH_PACK_FLIES),
            hatches: predictedHatches(water).slice(0, 4),
            planner: watchPackPlanner(water),
            regulation: watchPackRegulation(water, now),
            access: watchPackAccess(water, now)
          };
        })
      };
    }

    // A sync in flight paints transient labels ("Checking live inputs",
    // "Updating local cache"). The render after it settles posts the pack.
    function watchPackSyncing() {
      if (liveReports.bulkStatus) return true;
      return watchPackWaters().some((water) => {
        const report = liveReports.byWater[water?.id];
        return report?.status === "loading" || Boolean(report?.refreshing);
      });
    }

    // Posts the pack if, and only if, something in it changed. generatedAt
    // alone is not a change: a repaint must not wake the Watch.
    function postWatchPack() {
      watchPackTimer = null;
      if (!watchHandler()) return false;
      let pack;
      try {
        if (watchPackSyncing()) return false;
        pack = buildWatchPack();
      } catch {
        return false;
      }
      const key = JSON.stringify({ ...pack, generatedAt: "" });
      if (key === watchPackPostedKey) return false;
      if (!postWatchMessage({ action: "pack", body: JSON.stringify(pack) })) return false;
      watchPackPostedKey = key;
      return true;
    }

    // Called from every render; a burst of renders after a sync is one pack.
    function scheduleWatchPack() {
      if (!watchHandler()) return;
      clearTimeout(watchPackTimer);
      watchPackTimer = setTimeout(postWatchPack, WATCH_PACK_DEBOUNCE_MS);
    }

    function watchText(value, maxLength = 80) {
      return String(value ?? "")
        .replace(/[\u0000-\u001f\u007f]/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, maxLength);
    }

    // One catch from the Watch as a journal entry: the fields Fish on! writes,
    // dated on Oregon's clock from its own loggedAt by the same formatters as
    // every other entry, plus its watchId and a marker. Anything malformed is
    // refused, never repaired into a catch nobody logged, and a reading with
    // no recognisable provenance is stored as unavailable rather than guessed.
    function watchCatchEntry(raw) {
      if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;
      const watchId = String(raw.watchId || "");
      if (!WATCH_ID_PATTERN.test(watchId)) return null;
      const time = Date.parse(raw.loggedAt);
      if (!Number.isFinite(time)) return null;
      const at = new Date(time);
      const water = waterById(String(raw.waterId || ""));
      const reading = (key) => {
        const source = String(raw[`${key}Source`] || "");
        return WATCH_PROVENANCE.includes(source)
          ? { value: watchText(raw[key], 40), source }
          : { value: "", source: "unavailable" };
      };
      const flow = reading("flow");
      const temp = reading("temp");
      const length = String(raw.length ?? "");
      const count = String(raw.count ?? "");
      return {
        loggedAt: at.toISOString(),
        date: zonedDateLabel(at),
        time: zonedTimeLabel(at),
        waterName: water ? water.name : watchText(raw.waterName),
        waterId: water ? water.id : watchText(raw.waterId, 64),
        fly: watchText(raw.fly, 60),
        fish: watchText(raw.fish, 60),
        length: /^\d{1,3}(\.\d{1,2})?$/.test(length) ? length : "",
        count: /^[1-9]\d{0,2}$/.test(count) ? count : "1",
        notes: "",
        flow: flow.value,
        flowSource: flow.source,
        temp: temp.value,
        tempSource: temp.source,
        photoId: "",
        photo: "",
        watchId,
        loggedOn: "watch"
      };
    }

    // The journal is newest first. Each new catch goes in front of the first
    // entry logged before it, so nothing already there changes order, and a
    // watchId already in the journal adds nothing.
    function mergeWatchCatches(logs, entries) {
      const next = logs.slice();
      const known = new Set(next.map((entry) => entry?.watchId).filter(Boolean));
      const added = [];
      [...entries]
        .sort((a, b) => Date.parse(b.loggedAt) - Date.parse(a.loggedAt))
        .forEach((entry) => {
          if (known.has(entry.watchId)) return;
          known.add(entry.watchId);
          const time = Date.parse(entry.loggedAt);
          let index = next.findIndex((item) => {
            const itemTime = Date.parse(item?.loggedAt);
            return !Number.isFinite(itemTime) || itemTime < time;
          });
          if (index === -1) index = next.length;
          next.splice(index, 0, entry);
          added.push(entry);
        });
      return { logs: next, added };
    }

    function readWatchAckedIds() {
      return new Set(readStoredArray(WATCH_ACKED_KEY).filter((id) => typeof id === "string" && WATCH_ID_PATTERN.test(id)));
    }

    // Newest last, at most WATCH_ACKED_MAX. A failed write only means a
    // deleted catch could come back; the journal itself is never at risk.
    function rememberWatchAckedIds(ids) {
      const kept = [...readWatchAckedIds()].filter((id) => !ids.includes(id));
      writeStoredArray(WATCH_ACKED_KEY, [...kept, ...ids].slice(-WATCH_ACKED_MAX));
    }

    function watchCatchCount(count) {
      return `${count} ${count === 1 ? "catch" : "catches"}`;
    }

    function watchCatchKept(count) {
      return `${count === 1 ? "It is" : "They are"} kept on this iPhone and will be offered again`;
    }

    /* Called by the container with every catch it is holding for the
       journal, on every page load and whenever one arrives. Idempotent by
       watchId. The container deletes a held catch only when it is named in
       catchesSaved, and that is posted only for catches the journal now
       holds - after setLogs returned true. A journal that cannot be read or
       written acknowledges nothing, so the container keeps every catch.
       An id acknowledged before and no longer in the journal was deleted
       here by the angler: it is acknowledged again, never re-inserted. */
    window.riseWatchCatches = function(payload) {
      const incoming = (Array.isArray(payload?.catches) ? payload.catches : []).map(watchCatchEntry).filter(Boolean);
      if (!incoming.length) return;
      const logs = getLogs();
      const acked = readWatchAckedIds();
      if (logStorageUnreadable) {
        watchCatchNotice = {
          error: true,
          text: `${watchCatchCount(incoming.length)} from your Apple Watch could not be added because your journal could not be read. ${watchCatchKept(incoming.length)}.`
        };
        renderScreens("log", "trip");
        return;
      }
      // Indexes move under an insert. An open edit form follows its catch.
      const editingEntry = editingLogIndex !== null ? logs[editingLogIndex] || null : null;
      const inJournalBefore = new Set(logs.map((entry) => entry?.watchId).filter(Boolean));
      const fresh = incoming.filter((entry) => !acked.has(entry.watchId) || inJournalBefore.has(entry.watchId));
      const { logs: next, added } = mergeWatchCatches(logs, fresh);
      if (added.length && !setLogs(next)) {
        watchCatchNotice = {
          error: true,
          text: `${watchCatchCount(added.length)} from your Apple Watch could not be saved to this device's journal. ${watchCatchKept(added.length)} - free up storage and reopen The Rise.`
        };
        renderScreens("log", "trip");
        return;
      }
      if (added.length && editingEntry) {
        const moved = getLogs().indexOf(editingEntry);
        editingLogIndex = moved === -1 ? null : moved;
        if (moved === -1) logFormOpen = false;
      }
      // A fish on a fly is the fly working, as it is for Fish on! here.
      added.forEach((entry) => {
        if (entry.fly) setFlyFeedback(entry.fly, "worked", { toggle: false });
      });
      const inJournal = new Set(getLogs().map((entry) => entry?.watchId).filter(Boolean));
      const ids = uniqueItems(incoming.map((entry) => entry.watchId)).filter((id) => inJournal.has(id) || acked.has(id));
      if (ids.length) {
        rememberWatchAckedIds(ids);
        postWatchMessage({ action: "catchesSaved", ids });
      }
      if (added.length) {
        watchCatchNotice = { error: false, text: `Added ${watchCatchCount(added.length)} from your Apple Watch.` };
        maybeCompleteOnboarding();
      } else if (watchCatchNotice?.error) {
        watchCatchNotice = null;
      }
      renderScreens("today", "waters", "log", "trip");
    };

    function photoSourceFor(entry) {
      if (entry?.photoId && hasNativeStoreBridge()) return `risephoto://photo/${entry.photoId}`;
      return entry?.photo || "";
    }

    function newPhotoId() {
      return `catch-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    }

    const pendingPhotoSaves = new Map();
    window.risePhotoSaveResult = function(result) {
      const finish = pendingPhotoSaves.get(result?.id);
      if (finish) finish(result.ok === true);
    };

    // Only reference a native photo after its atomic disk write succeeds.
    // A bounded timeout preserves the draft if the container stops responding.
    async function storePhoto(dataUrl) {
      if (!dataUrl) return { photoId: "", photo: "" };
      if (!hasNativeStoreBridge()) return { photoId: "", photo: dataUrl };
      const photoId = newPhotoId();
      await new Promise((resolve, reject) => {
        const finish = (ok) => {
          clearTimeout(timer);
          pendingPhotoSaves.delete(photoId);
          if (ok) resolve();
          else {
            postStoreMessage({ action: "deletePhoto", id: photoId });
            reject(new Error("Photo storage is unavailable"));
          }
        };
        const timer = setTimeout(() => finish(false), 5000);
        pendingPhotoSaves.set(photoId, finish);
        if (!postStoreMessage({ action: "savePhoto", id: photoId, body: dataUrl })) finish(false);
      });
      return { photoId, photo: "" };
    }

    function deleteStoredPhoto(entry) {
      if (entry?.photoId) postStoreMessage({ action: "deletePhoto", id: entry.photoId });
    }

    function formatLogDate(entry) {
      if (!entry?.loggedAt) return `${entry?.date || ""}${entry?.dateApproximate ? " (year unknown)" : ""}`;
      const parsed = new Date(entry.loggedAt);
      if (Number.isNaN(parsed.getTime())) return entry.date || "";
      return zonedDateLabel(parsed);
    }

    function logSeasonYears() {
      const years = new Set();
      getLogs().forEach((entry) => {
        if (!entry.loggedAt) return;
        const parsed = new Date(entry.loggedAt);
        // The year on the water's clock, as every card date is: a phone
        // outside Pacific time filed a Dec 31 catch under the next year.
        if (!Number.isNaN(parsed.getTime())) years.add(zonedParts(parsed).year);
      });
      return [...years].sort();
    }

    /* saveLogEntry has recorded flowSource and tempSource since build 9, and
       every display site then threw them away. An entry logged on the Lower
       Deschutes with no signal stores "4,160 cfs" - the app's own seasonal
       reference value - and printed it on the card and in the CSV as if it
       were the flow the fish was caught in.

       The number and where it came from now travel together everywhere. */
    function readingProvenanceWord(entry, key) {
      const source = entry?.[`${key}Source`];
      if (source === "measured") return "measured";
      if (source === "stale") return "measured earlier";
      if (source === "reference") return "reference";
      if (source === "unavailable") return "";
      // Entries written before build 11 carry no source at all.
      return "source unknown";
    }

    function loggedReadingLabel(entry, key) {
      const value = String(entry?.[key] || "").trim();
      if (!value || value === "No live gauge") return "";
      const word = readingProvenanceWord(entry, key);
      return word ? `${value} (${word})` : value;
    }

    function logCsv() {
      const columns = ["Date", "Time", "Water", "Fly", "Species", "Length", "Count", "Flow", "Flow source", "Water temp", "Water temp source", "Notes"];
      const rows = getLogs().map((entry) => [
        formatLogDate(entry),
        entry.time || "",
        entry.waterName || "",
        entry.fly || "",
        entry.fish || "",
        entry.length || "",
        entry.count || "",
        entry.flow || "",
        readingProvenanceWord(entry, "flow"),
        entry.temp || "",
        readingProvenanceWord(entry, "temp"),
        entry.notes || ""
      ]);
      // Spreadsheets evaluate a quoted field that starts with = + - @ as a
      // formula, so a note like "- fished the seam" exported as #NAME? and
      // "=HYPERLINK(...)" became a live link. A leading apostrophe keeps it text.
      const escape = (value) => {
        let text = String(value);
        if (/^[=+\-@\t\r]/.test(text)) text = `'${text}`;
        return `"${text.replace(/"/g, '""')}"`;
      };
      return [columns, ...rows].map((row) => row.map(escape).join(",")).join("\r\n");
    }

    function exportLog() {
      // A UTF-8 byte-order mark, or Excel opens the file in the legacy code
      // page and the iOS keyboard's curly apostrophe in "didn’t" turns into
      // "didnâ€™t". Numbers and Google Sheets ignore it.
      const csv = `\uFEFF${logCsv()}`;
      if (hasNativeStoreBridge()) {
        return postStoreMessage({ action: "exportLog", body: csv })
          ? "Export requested." : "Export failed on this device.";
      }
      try {
        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `the-rise-catch-log-${pacificDateKey()}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        return "Catch log downloaded as CSV.";
      } catch (error) {
        return "Export failed on this device.";
      }
    }

    function flyFamilyName(fly) {
      const text = String(fly || "").toLowerCase();
      if (text.includes("caddis") || text.includes("x-caddis")) return "Caddis";
      if (text.includes("bwo")) return "BWO";
      if (text.includes("pmd")) return "PMD";
      if (text.includes("damsel")) return "Damsel";
      if (text.includes("chironomid") || text.includes("midge") || text.includes("chromie")) return "Midge";
      if (text.includes("leech") || text.includes("bugger")) return "Leech";
      if (text.includes("callibaetis")) return "Callibaetis";
      return String(fly || "Caddis").replace(/\s?#\d+/, "");
    }

    function renderLog() {
      const logs = getLogs();
      const saved = Boolean(logs.length);
      // Counted from the journal, always. These used to fall back to a
      // hardcoded 34 fish and 11 trips on a device that had never logged one.
      const totalFish = logs.reduce((sum, entry) => sum + (Number(entry.count) || 1), 0);
      const trips = new Set(logs.map((entry) => `${entry.date}-${entry.waterName}`)).size;
      const years = logSeasonYears();
      const seasonLabel = years.length ? (years.length === 1 ? `${years[0]}` : `${years[0]}-${years[years.length - 1]}`) : `${zonedParts().year}`;
      const flyCounts = logs.reduce((counts, entry) => {
        counts[entry.fly] = (counts[entry.fly] || 0) + 1;
        return counts;
      }, {});
      const topFlyEntry = Object.entries(flyCounts).sort((a, b) => b[1] - a[1])[0]?.[0];
      // No catches means no top fly. It used to read "Caddis" on an empty journal.
      const topFly = topFlyEntry ? flyFamilyName(topFlyEntry) : "-";
      const editingEntry = editingLogIndex !== null ? logs[editingLogIndex] : null;
      // Keep the actual form (including its FileList) through background
      // refreshes and failed saves. Only a different editing target replaces it.
      const previousForm = document.querySelector("#logForm");
      const keepForm = logFormOpen && previousForm && previousForm._editingEntry === editingEntry;
      // An entry keyed only by name (older builds, restored backups) or by a
      // water that no longer exists must keep its water through an edit. The
      // select used to fall back to the active water, so adding a note moved
      // the catch to whichever river was last tapped.
      const editingWater = editingEntry
        ? (waterById(editingEntry.waterId) || waters.find((water) => water.name === editingEntry.waterName) || null)
        : null;
      const keepEditingWater = Boolean(editingEntry) && !editingWater;
      const selectedWater = editingWater || getWater();
      const editingFish = editingEntry?.fish || "";
      const keepEditingFish = Boolean(editingFish) && !nativeFish.includes(editingFish);
      // Fish on! and the Watch leave species blank rather than guess. Editing
      // such a catch keeps it blank until the angler picks one; defaulting to
      // Redband Trout would write a guess on the next Update.
      const blankEditingFish = Boolean(editingEntry) && !editingFish;
      const defaultFly = selectedWaterFly(selectedWater) || selectedWater.flies[0];
      $("#log").innerHTML = `
        <div class="log-screen">
          <div class="log-top">
            <div>
              <p class="eyebrow">Your Log - ${seasonLabel}</p>
              <h1>Catch Journal</h1>
              <p class="subtle">Photos, fish, flies, length, and conditions saved on this device. ${saved ? `${logs.length} ${logs.length === 1 ? "entry" : "entries"} kept - nothing is ever dropped.` : "Nothing is uploaded."}</p>
            </div>
            <div class="log-top-actions">
              <button class="primary-btn" data-new-log>${icon.plus}${logFormOpen ? "Close Entry" : "New Entry"}</button>
              ${saved && logs.length ? `<button class="ghost-btn" data-export-log>Export CSV</button>` : ""}
            </div>
          </div>
          ${logRestoreNotice ? `<div class="data-provenance-notice">${logRestoreNotice}</div>` : ""}
          ${logStorageUnreadable ? `<div class="data-provenance-notice" role="alert">Your saved journal could not be read. The original data has been kept; new saves are blocked to avoid overwriting it. Reopen the app to retry the device backup, or contact support before clearing any app data.</div>` : ""}
          ${!logFormOpen && logSaveMessage ? `<div class="data-provenance-notice" role="status">${logSaveMessage}</div>` : ""}
          ${watchCatchNotice ? `<div class="data-provenance-notice" role="${watchCatchNotice.error ? "alert" : "status"}" data-watch-notice>${esc(watchCatchNotice.text)}</div>` : ""}

          <div class="log-summary">
            <div class="log-stat"><strong>${totalFish}</strong><span>Fish</span></div>
            <div class="log-stat"><strong>${trips}</strong><span>Trips</span></div>
            <div class="log-stat"><strong>${esc(topFly)}</strong><span>Top Fly</span></div>
          </div>

          ${logFormOpen ? `
            <form class="log-form-panel" id="logForm">
              <div class="panel-head">
                <div>
                  <h2>${editingEntry ? "Edit Catch" : "Log a Catch"}</h2>
                  <p class="subtle">Use the camera button on mobile, or attach a photo from your library.</p>
                </div>
              </div>
              <label class="photo-input">Photo
                <input name="photo" type="file" accept="image/*">
              </label>
              <div class="log-attached-photo" data-log-attached-photo hidden></div>
              <p class="subtle" data-log-save-error role="alert" style="color:#8b2c20" ${logSaveMessage ? "" : "hidden"}>${esc(logSaveMessage)}</p>
              <div class="form-grid">
                <label>Water
                  <select name="water">${keepEditingWater ? `<option value="" selected>${esc(editingEntry.waterName || "Unknown water")}</option>` : ""}${waters.map((water) => `<option value="${attr(water.id)}" ${!keepEditingWater && water.id === selectedWater.id ? "selected" : ""}>${esc(water.name)}</option>`).join("")}</select>
                </label>
                <label>Native fish
                  <select name="fish">${blankEditingFish ? `<option value="" selected>Species not set</option>` : ""}${keepEditingFish ? `<option value="${attr(editingFish)}" selected>${esc(editingFish)}</option>` : ""}${nativeFish.map((fish) => `<option value="${attr(fish)}" ${!keepEditingFish && !blankEditingFish && fish === (editingFish || "Redband Trout") ? "selected" : ""}>${esc(fish)}</option>`).join("")}</select>
                </label>
                <label>Length
                  <input name="length" type="number" min="0" step="0.25" inputmode="decimal" placeholder="Optional" value="${attr(editingEntry?.length || "")}">
                </label>
                <label>Count

          <div class="log-entry-list">
            ${logs.length ? logs.slice(0, logVisibleCount).map((entry, index) => `

                  ${entry.loggedOn === "watch" ? `<span class="watch-tag" data-watch-tag>Logged on Apple Watch</span>` : ""}
                  <div class="catch-actions">

              <div class="catch-card"><div class="catch-photo">🐟</div><div><strong>No catches yet</strong><span>Tap New Entry to log your first fish. Photos, conditions and notes stay on this device.</span></div></div>
              <p class="subtle" data-example-logs-label>Examples of what an entry looks like. These are not your catches, they are not saved, and they are not counted above.</p>
              ${exampleLogs.map((entry) => `
                <div class="catch-card example-card" aria-hidden="true">
                  <div class="catch-photo">🐟</div>
                  <div>
                    <strong>${esc(entry.fish)} - ${esc(entry.length)}"</strong>

          </div>
          ${logs.length > logVisibleCount ? `
            <div class="log-more">

              <button class="ghost-btn" data-show-more-log>Show ${Math.min(LOG_PAGE_SIZE, logs.length - logVisibleCount)} more</button>

            </div>
        </div>
      `;
      let currentForm = document.querySelector("#logForm");
      if (keepForm && currentForm && currentForm !== previousForm) {
        currentForm.replaceWith(previousForm);
        currentForm = previousForm;
      }
      if (currentForm) {
        currentForm._editingEntry = editingEntry;
        const error = currentForm.querySelector("[data-log-save-error]");
        if (error) {
          error.textContent = logSaveMessage;

    }

    /* A kept form keeps its draft through a repaint, so an attachment made
       while it is open has to be written into it here rather than into the
       markup that was thrown away. Only a new catch takes an attachment. */
    function syncAttachedCatchPhoto(form, editingEntry) {
      const slot = form.querySelector("[data-log-attached-photo]");
      if (!slot) return;
      const photo = editingEntry ? "" : pendingCatchPhoto;
      slot.hidden = !photo;
      slot.innerHTML = photo ? `
        <img src="${attr(photo)}" alt="Bug photo attached to this catch">
        <span>Bug photo from Snap a bug is attached. Choosing a photo above replaces it.</span>
        <button type="button" class="ghost-btn" data-detach-photo>Remove</button>
      ` : "";
    }
