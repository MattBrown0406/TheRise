          "Fish, fly, length, photo and the conditions it was caught in - saved on this device, and never uploaded.",
          `<button class="ghost-btn" data-tab-jump="log">Open the journal</button>`
        ]
      ];
    }

    function onboardingComplete() {
      return onboardingSteps().every(([, done]) => done);
    }

    /* Called after the two steps that can complete on their own, so a finished
       setup stops showing the panel permanently rather than reappearing the
       next time the cache expires. */
    function maybeCompleteOnboarding() {
      if (onboardingDismissed || !onboardingComplete()) return;
      dismissOnboarding();
    }

    function dismissOnboarding() {
      onboardingDismissed = true;
      try {
        localStorage.setItem(ONBOARDING_KEY, "true");
      } catch {
        // Saved on this device only; the panel simply reappears next launch.
      }
    }

    function firstRunPanel() {
      if (onboardingDismissed || onboardingComplete()) return "";
      const steps = onboardingSteps();
      const doneCount = steps.filter(([, done]) => done).length;
      return `
        <div class="first-run" role="region" aria-label="Set up The Rise">
          <div class="first-run-head">
            <div>
              <p class="eyebrow">Set up - ${doneCount} of ${steps.length} done</p>
              <h3>Three things and you are fishing</h3>
              <p class="subtle">Every water gets a 0-10 fishability rating built from season, time of day, flow, water temperature, wind and the forecast. It is only as good as the data underneath it, so start here.</p>
            </div>
            <button class="ghost-btn" data-dismiss-onboarding>Skip</button>
          </div>
          <div class="first-run-list">
            ${steps.map(([key, done, title, body, action]) => `
              <div class="first-run-step ${done ? "done" : ""}" data-step="${key}">
                <span class="first-run-mark" aria-hidden="true">${done ? "✓" : ""}</span>
                <div>
                  <strong>${title}</strong>
                  <span>${body}</span>
                </div>
                ${done ? `<span class="chip">Done</span>` : action}
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    /* Where each unlocked feature actually lives, so the buyer can be taken to
       it rather than left on the paywall reading that it is now "Active". */
    const PRO_FEATURE_DESTINATIONS = {
      "Flow history": [`data-tab-jump="waters"`, "Open a water"],
      // Already on this screen and already expanded, so this scrolls to it
      // rather than switching tabs - activateTab would scroll back to the top
      // and take the breakdown off screen.
      "Rating breakdown": [`data-show-breakdown`, "Show me"],
      "Fish this plan": [`data-tab-jump="trip"`, "Open Trip Mode"],
      "Hatch ID assistant": [`data-tab-jump="bugs"`, "Open Bugs"]
    };

    /* Shown once, immediately after the purchase or restore that turned Pro
       on - never on a later launch, because the startup status check flips the
       same flag and the buyer has already seen this.

       Before this, a successful purchase left the angler on the Pro tab with a
       disabled "Pro active" button and four cards whose chips had changed from
       "Pro" to "Active". Three of the four features are panels on other
       screens that simply replaced a lock, so there was nothing on screen that
       looked like the thing they had just paid for. The app was already
       rejected once under 2.1(b) over exactly that impression. */
    function proWelcomePanel() {
      return `
        <div class="pro-welcome" role="status">
          <div class="pro-welcome-head">
            <div>
              <p class="eyebrow">The Rise Pro</p>
              <h3>Four things just unlocked</h3>
            </div>
            <button class="ghost-btn" data-dismiss-pro-welcome>Got it</button>
          </div>
          <div class="pro-welcome-list">
            ${PRO_FEATURES.map(([title, description]) => {
              const [attribute, label] = PRO_FEATURE_DESTINATIONS[title] || [`data-tab-jump="pro"`, "Open Pro"];
              return `
                <div class="pro-welcome-item">
                  <div>
                    <strong>${esc(title)}</strong>
                    <span>${esc(description)}</span>
                  </div>
                  <button class="ghost-btn" ${attribute}>${esc(label)}</button>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function proLock(title, description) {
      return `
        <div class="pro-lock">
          <strong>${title}</strong>
          <span>${description}</span>
          <button class="ghost-btn" data-tab-jump="pro">See Pro</button>
        </div>
      `;
    }

    function scoreBreakdownPanel(water) {
      if (!proAccessActive) {
        return `<div class="score-breakdown-panel">${proLock("Rating breakdown - Pro", "See exactly how season, time of day, flow, temperature, wind and forecast combine into this water's rating.")}</div>`;
      }
      return `
        <div class="score-breakdown-panel">
          <div class="score-breakdown-head">
            <strong>Why this rating?</strong>
            <span>${waterLogicLabel(water)}</span>
          </div>
          ${scoreBreakdownItems(water).map(([label, value, note]) => `
            <div class="score-breakdown-row">
              <span>${esc(label)}</span>
              <b>${esc(value)}</b>
              <small>${esc(note)}</small>
            </div>
          `).join("")}
        </div>
      `;
    }

    function whyThisWaterReasons(water) {
      const clarity = clarityFor(water);
      const temp = liveDisplayValue(water, "temp");
      const hatches = predictedHatches(water).slice(0, 3);
      const intel = localIntelForWater(water);
      const reasons = [
        `${primeWindowFor(water).replace("Prime window: ", "")} lines up with ${hatches[0] || "expected feeding"}.`,
        `${temp} water${clarity.measured ? ` and ${clarity.label.toLowerCase()} clarity` : ""} supports a ${fishScore(water)}/10 rating${flowContextLabel(water) ? `. ${flowContextLabel(water)}` : ""}.`,
        `${confidenceForWater(water)}: ${intel.sources?.length ? `local signal from ${intel.sources.slice(0, 2).join(" + ")}` : "weather, baseline hatch timing, and saved water profile"}.`
      ];
      if (skillMode !== "Beginner") reasons.push(`${waterLogicLabel(water)}: ${waterLogicDescription(water)}`);
      if (skillMode === "Expert") {
        const report = liveReports.byWater[water.id];
        reasons.push(`${report?.status === "ready" ? "Live inputs are stored locally for offline use." : "Refresh when you have signal to replace the baseline profile."}`);
      }
      return reasons;
    }

    function whyThisWaterCard(water, compact = false) {
      return `
        <div class="why-card ${compact ? "compact" : ""}">
          <div class="insight-head">
            <div>
              <span>Why this water today</span>
              <strong>${water.name}</strong>
              ${waterClosedLabel(water) ? `<em class="regs-flag">${esc(waterClosedLabel(water))}</em>` : ""}
            </div>
            <b>${fishScore(water)}</b>
          </div>
          <div class="reason-stack">
            ${whyThisWaterReasons(water).map((reason) => `<p>${reason}</p>`).join("")}
          </div>
        </div>
      `;
    }

    function fishPlanFor(water) {
      const flies = liveRecommendedFlies(water);
      const hatches = predictedHatches(water);
      const firstFly = flies[0] || water.flies[0];
      const secondFly = flies[1] || firstFly;
      if (water.type === "Lake") {
        return [
          ["Start", `${firstFly}`, "Fish wind lanes, reed edges, or the first visible cruisers."],
          ["Set Depth", "Find fish before changing flies", "Move the indicator or retrieve depth every few minutes until you touch fish."],
          ["Switch", `${secondFly}`, "Change when follows stop, chop increases, or fish suspend deeper."],
          ["Backup", "Balanced Leech #10", "Use low light, stained water, or steady wind to sell movement."]
        ];
      }
      return [
        ["Start", `${firstFly}`, "Begin in soft seams beside riffles and banks before walking past good water."],
        ["Watch", `${hatches.slice(0, 2).join(" / ") || "rise forms"}`, "Match the feeding lane first, then adjust size or stage."],
        ["Switch", `${secondFly}`, "If fish refuse, change stage before changing bug family."],
        ["Backup", "Soft hackle or small nymph", "Use when surface fish disappear or glare hides subtle eats."]
      ];
    }

    function fishPlanPanel(water, compact = false) {
      if (!proAccessActive) {
        return `<div class="fish-plan ${compact ? "compact" : ""}">${proLock("Fish this plan - Pro", "A staged plan for this water in the current window: what to fish, where to start, and what to change next.")}</div>`;
      }
      return `
        <div class="fish-plan ${compact ? "compact" : ""}">
          <div class="panel-head">
            <div>
              <h3>Fish This Plan</h3>
              <p class="subtle">${primeWindowFor(water)} - ${confidenceForWater(water)}</p>
            </div>
            <button class="ghost-btn" data-trip-mode="${water.id}">Open Trip</button>
          </div>
          <div class="plan-grid">
            ${fishPlanFor(water).map(([label, title, note]) => `
              <div class="plan-card">
                <span>${esc(label)}</span>
                <strong>${esc(title)}</strong>
                <small>${esc(note)}</small>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function logsForWater(water) {
      return getLogs().filter((entry) => entry.waterId === water.id || entry.waterName === water.name);
    }

    function personalMemoryFor(water) {
      const logs = logsForWater(water);
      const recommended = liveRecommendedFlies(water);
      const worked = Object.keys(flyFeedback).filter((fly) => flyFeedback[fly] === "worked");
      const ignored = Object.keys(flyFeedback).filter((fly) => flyFeedback[fly] === "ignored");
      const loggedFlyCounts = logs.reduce((counts, entry) => {
        if (entry.fly) counts[entry.fly] = (counts[entry.fly] || 0) + (Number(entry.count) || 1);
        return counts;
      }, {});
      const topLoggedFly = Object.entries(loggedFlyCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || "";
      const workedHere = worked.find((fly) => recommended.includes(fly) || logs.some((entry) => entry.fly === fly));
      const ignoredHere = ignored.find((fly) => recommended.includes(fly));
      const lastCatch = logs[0];
      const workedLine = workedHere ? `Prioritize ${workedHere}; you marked it as worked.` : "";
      const ignoredLine = ignoredHere ? `Deprioritize ${ignoredHere}; you ignored it last time.` : "";
      const lastCatchLine = lastCatch
        ? `Last catch: ${lastCatch.fish || "fish"}${lastCatch.length ? `, ${lastCatch.length}"` : ""} on ${lastCatch.fly || "unknown fly"}.`
        : "";
      const lines = [];
      if (logs.length) lines.push(`${logs.length} local ${logs.length === 1 ? "entry" : "entries"} saved for ${water.name}.`);
      if (topLoggedFly) lines.push(`Your best logged fly here: ${topLoggedFly}.`);
      if (workedLine) lines.push(workedLine);
      if (ignoredLine) lines.push(ignoredLine);
      if (lastCatchLine) lines.push(lastCatchLine);
      if (!lines.length) lines.push("No local memory yet. Log catches or mark flies as worked/ignored to train this device.");
      return { logs, lines, topLoggedFly, workedHere, ignoredHere, workedLine, ignoredLine, lastCatchLine };
    }

    /* ---------------------------------------------------------------------
       "Your water": what the angler's own journal says about one water.

       Built only from catches logged on that water, and honest about how
       many there are. A flow or temperature band counts only readings the
       entry recorded as measured (or measured earlier): a seasonal reference
       value was never an observation of the river the fish came out of, and
       averaging those would describe the app's seed data back to the angler
       as their history. Nothing is stated below its minimum sample - the card
       says how many more catches it needs instead.
       --------------------------------------------------------------------- */
    const PROFILE_MIN_CATCHES = 3;
    const PROFILE_MIN_READINGS = 3;
    // Fish on one fly on this water before it counts as proven there.
    const PROFILE_PROVEN_FLY_FISH = 2;
    // The score bonus. Small on purpose: three catches is a hint, not a law.
    const PROFILE_FLOW_BONUS = .2;
    const PROFILE_TIME_BONUS = .1;
    const PROFILE_BONUS_MAX = .3;
    const PROFILE_MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    // Rebuilt only when the journal changes. setLogs and a restore replace the
    // journal array rather than editing it, so its identity is the version.
    let waterProfileLogs = null;
    const waterProfileCache = new Map();

    function fishInEntry(entry) {
      const count = Number(entry?.count);
      return Number.isFinite(count) && count >= 1 ? Math.round(count) : 1;
    }

    // A logged reading the profile may use, or null. Only "measured" and
    // "stale" (measured earlier) are observations.
    function observedReading(entry, key) {
      if (!["measured", "stale"].includes(entry?.[`${key}Source`])) return null;
      const value = key === "flow" ? flowFromText(entry[key]) : numberFromText(entry[key]);
      if (value === null || !Number.isFinite(value)) return null;
      if (key === "flow" && value < 0) return null;
      return value;
    }

    // The middle of the readings: the full range for a handful, trimmed of
    // the outer ~15% each side once there are enough to have outliers.
    function readingBand(values) {
      if (values.length < PROFILE_MIN_READINGS) return null;
      const sorted = [...values].sort((a, b) => a - b);
      const last = sorted.length - 1;
      return {
        low: sorted[Math.floor(last * .15)],
        high: sorted[Math.ceil(last * .85)],
        count: sorted.length
      };
    }

    // The hour of the catch on Oregon's clock: the time the angler wrote on
    // the entry, which they can correct, else the moment it was saved.
    function catchHour(entry) {
      const text = String(entry?.time || "").trim();
      const twelve = text.match(/^(\d{1,2})(?::(\d{2}))?\s*([ap])\.?\s*m?\.?$/i);
      if (twelve && Number(twelve[1]) >= 1 && Number(twelve[1]) <= 12) {
        return (Number(twelve[1]) % 12) + (/p/i.test(twelve[3]) ? 12 : 0);
      }
      const twentyFour = text.match(/^(\d{1,2}):(\d{2})$/);
      if (twentyFour && Number(twentyFour[1]) <= 23) return Number(twentyFour[1]);
      if (!entry?.loggedAt) return null;
      const saved = new Date(entry.loggedAt);
      return Number.isNaN(saved.getTime()) ? null : zonedParts(saved).hour;
    }

    function catchMonth(entry) {
      if (entry?.loggedAt) {
        const saved = new Date(entry.loggedAt);
        if (!Number.isNaN(saved.getTime())) return zonedParts(saved).month;
      }
      const named = String(entry?.date || "").match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/i);
      if (!named) return null;
      return PROFILE_MONTH_NAMES.findIndex((name) => name.toLowerCase() === named[1].toLowerCase()) + 1;
    }

    // The 2- or 3-hour stretch holding the most fish. A 3-hour band has to
    // beat the best 2-hour one outright, and the winner has to hold at least
    // two fish and 40% of them, or there is no pattern to report.
    function bestTimeBand(timed) {
      if (timed.length < PROFILE_MIN_CATCHES) return null;
      const perHour = Array(24).fill(0);
      timed.forEach(({ hour, fish }) => { perHour[hour] += fish; });
      const totalFish = perHour.reduce((sum, value) => sum + value, 0);
      let best = null;
      for (const width of [2, 3]) {
        for (let start = 0; start + width <= 24; start += 1) {
          const fish = perHour.slice(start, start + width).reduce((sum, value) => sum + value, 0);
          // On a tie, the band that opens on an hour with fish in it: six
          // catches at 6 PM are "6 PM-8 PM", not "5 PM-7 PM".
          const opensOnFish = fish === best?.fish && width === best.width && perHour[start] > 0 && perHour[best.start] === 0;
          if (!best || fish > best.fish || opensOnFish) best = { start, end: start + width, width, fish };
        }
      }
      if (!best || best.fish < 2 || best.fish / totalFish < .4) return null;
      return { ...best, of: totalFish, catches: timed.length };
    }

    function waterProfileFor(water) {
      const logs = getLogs();
      if (waterProfileLogs !== logs) {
        waterProfileLogs = logs;
        waterProfileCache.clear();
      }
      if (waterProfileCache.has(water.id)) return waterProfileCache.get(water.id);
      const entries = logsForWater(water);
      const flows = entries.map((entry) => observedReading(entry, "flow")).filter((value) => value !== null);
      const temps = entries.map((entry) => observedReading(entry, "temp")).filter((value) => value !== null);
      const timed = entries
        .map((entry) => ({ hour: catchHour(entry), fish: fishInEntry(entry) }))
        .filter(({ hour }) => hour !== null);
      const flyFish = {};
      const monthFish = {};
      entries.forEach((entry) => {
        const fly = String(entry.fly || "").trim();
        if (fly) flyFish[fly] = (flyFish[fly] || 0) + fishInEntry(entry);
        const month = catchMonth(entry);
        if (month) monthFish[month] = (monthFish[month] || 0) + fishInEntry(entry);
      });
      const enough = entries.length >= PROFILE_MIN_CATCHES;
      const profile = {
        waterId: water.id,
        catches: entries.length,
        fish: entries.reduce((sum, entry) => sum + fishInEntry(entry), 0),
        enough,
        flowReadings: flows.length,
        flowBand: enough ? readingBand(flows) : null,
        tempReadings: temps.length,
        tempBand: enough ? readingBand(temps) : null,
        timedCatches: timed.length,
        timeBand: enough ? bestTimeBand(timed) : null,
        topFlies: Object.entries(flyFish)
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .slice(0, 3)
          .map(([fly, fish]) => ({ fly, fish })),
        bestMonths: enough
          ? Object.entries(monthFish)
            .sort((a, b) => b[1] - a[1] || Number(a[0]) - Number(b[0]))
            .slice(0, 2)
            .map(([month, fish]) => ({ month: Number(month), name: PROFILE_MONTH_NAMES[Number(month) - 1], fish }))
          : []
      };
      waterProfileCache.set(water.id, profile);
      return profile;
    }

    function provenFliesFor(water) {
      return waterProfileFor(water).topFlies.filter((item) => item.fish >= PROFILE_PROVEN_FLY_FISH);
    }

    function bandLabel(band, unit) {
      if (!band) return "";
      const format = (value) => Math.round(value).toLocaleString("en-US");
      return band.low === band.high ? `${format(band.low)} ${unit}` : `${format(band.low)}-${format(band.high)} ${unit}`;
    }

    function timeBandLabel(band) {
      return band ? `${formatHour(band.start)}-${formatHour(band.end)}` : "";
    }

    // What the angler's history adds to today's score, and why. Never below
    // zero: no history, too little history, or a reading that cannot be
    // compared all add nothing rather than counting against the water.
    function personalScoreBonus(water) {
      const profile = waterProfileFor(water);
      const result = { total: 0, flow: 0, time: 0, profile, todayFlow: null, flowProvenance: valueProvenance(water, "flow"), hour: currentHour(), inFlowBand: false, inTimeBand: false };
      if (profile.flowBand && result.flowProvenance === "measured") {
        result.todayFlow = flowFromText(usableReport(water)?.usgs?.flow);
        result.inFlowBand = result.todayFlow !== null
          && result.todayFlow >= profile.flowBand.low && result.todayFlow <= profile.flowBand.high;
        if (result.inFlowBand) result.flow = PROFILE_FLOW_BONUS;
      }
      if (profile.timeBand) {
        result.inTimeBand = result.hour >= profile.timeBand.start && result.hour < profile.timeBand.end;
        if (result.inTimeBand) result.time = PROFILE_TIME_BONUS;
      }
      result.total = Math.max(0, Math.min(PROFILE_BONUS_MAX, result.flow + result.time));
      return result;
    }

    function signedBonus(value) {
      return value > 0 ? `+${value.toFixed(1)}` : "No change";
    }

    // The "Your history" row of the rating breakdown: exactly what
    // personalScoreBonus added, each half explained on its own terms.
    function personalHistoryBreakdown(water) {
      const bonus = personalScoreBonus(water);
      const { profile } = bonus;
      const parts = [];
      if (!profile.enough) {
        parts.push(`${profile.catches} of ${PROFILE_MIN_CATCHES} catches logged here - your history adds nothing until there are ${PROFILE_MIN_CATCHES}`);
      } else {
        const noGauge = water.type === "Lake" || !hasGauge(water);
        if (noGauge) {
          parts.push("No flow gauge on this water, so flow history cannot count");
        } else if (!profile.flowBand) {
          parts.push(`Flow: need ${PROFILE_MIN_READINGS}+ catches with a measured flow (you have ${profile.flowReadings}) - adds nothing`);
        } else if (bonus.flowProvenance !== "measured" || bonus.todayFlow === null) {
          parts.push(`Your flow band is ${bandLabel(profile.flowBand, "cfs")}, but there is no current measured flow to compare - adds nothing`);
        } else if (bonus.inFlowBand) {
          parts.push(`Today's ${bandLabel({ low: bonus.todayFlow, high: bonus.todayFlow }, "cfs")} (measured) is inside your ${bandLabel(profile.flowBand, "cfs")} band from ${profile.flowBand.count} measured catches: +${PROFILE_FLOW_BONUS.toFixed(1)}`);
        } else {
          parts.push(`Today's ${bandLabel({ low: bonus.todayFlow, high: bonus.todayFlow }, "cfs")} is outside your ${bandLabel(profile.flowBand, "cfs")} band - no bonus, no penalty`);
        }
        if (!profile.timeBand) {
          parts.push(`Time: no clear best time yet from ${profile.timedCatches} timed ${profile.timedCatches === 1 ? "catch" : "catches"} - adds nothing`);
        } else if (bonus.inTimeBand) {
          parts.push(`It is ${formatHour(bonus.hour)}, inside your best ${timeBandLabel(profile.timeBand)} band: +${PROFILE_TIME_BONUS.toFixed(1)}`);
        } else {
          parts.push(`Your best time here is ${timeBandLabel(profile.timeBand)}; it is ${formatHour(bonus.hour)} now - adds nothing`);
        }
      }
      return ["Your history", signedBonus(bonus.total), `${parts.join(". ")}.`];
    }

    /* The "Your <water>" card. It replaces the old "Your local memory" card
       rather than sitting beside it: the worked/ignored and last-catch lines
       live on at the bottom, and the counts it used to print are the
       profile's headline now. Free - nothing here is in PRO_FEATURES. */
    function personalMemoryCard(water, compact = false) {
      const memory = personalMemoryFor(water);
      const profile = waterProfileFor(water);
      const headline = profile.enough
        ? `From your ${profile.catches} catches`
        : profile.catches
          ? `${profile.catches} of ${PROFILE_MIN_CATCHES} catches logged`
          : "Learning this water";
      const noGauge = water.type === "Lake" || !hasGauge(water);
      const readingRow = (label, band, unit, readings) => {
        if (band) return [label, bandLabel(band, unit), `from ${band.count} measured ${band.count === 1 ? "reading" : "readings"}`];
        return [label, "Not yet", `need ${PROFILE_MIN_READINGS}+ catches with a measured ${label === "Flow" ? "flow" : "water temp"} (you have ${readings})`];
      };
      const rows = profile.enough ? [
        noGauge
          ? ["Flow", "No gauge", "no measured flow is possible on this water"]
          : readingRow("Flow", profile.flowBand, "cfs", profile.flowReadings),
        readingRow("Water temp", profile.tempBand, "F", profile.tempReadings),
        profile.timeBand
          ? ["Best time", timeBandLabel(profile.timeBand), `${profile.timeBand.fish} of ${profile.timeBand.of} fish, Pacific time`]
          : ["Best time", "Not yet", `no clear pattern in ${profile.timedCatches} timed ${profile.timedCatches === 1 ? "catch" : "catches"}`],
        ["Top flies", profile.topFlies.map((item) => `${item.fly} (${item.fish})`).join(", ") || "None logged", profile.topFlies.length ? "fish logged on each, here" : ""],
        ["Best months", profile.bestMonths.map((item) => `${item.name} (${item.fish})`).join(", ") || "Not yet", profile.bestMonths.length ? "fish logged in each month" : ""]
      ] : [];
      const lines = [memory.workedLine, memory.ignoredLine, memory.lastCatchLine].filter(Boolean);
      if (!profile.catches && !lines.length) lines.push("No catches logged here yet. Log catches or mark flies as worked/ignored to train this device.");
      return `
        <div class="memory-card your-water-card ${compact ? "compact" : ""}" data-your-water="${attr(water.id)}">
          <div class="insight-head">
            <div>
              <span>Your ${esc(water.name)}</span>
              <strong>${esc(headline)}</strong>
            </div>
            <button class="mini-action" data-quick-log="${attr(water.id)}">Quick log</button>
          </div>
          ${profile.enough ? `
            <div class="profile-rows">
              ${rows.slice(0, compact ? 3 : rows.length).map(([label, value, note]) => `
                <div class="profile-row">
                  <span>${esc(label)}</span>
                  <b>${esc(value)}</b>
                  ${note ? `<small>${esc(note)}</small>` : ""}
                </div>
              `).join("")}
            </div>
          ` : `<p class="profile-need">Need ${PROFILE_MIN_CATCHES}+ catches here to build your profile - you have ${profile.catches}.</p>`}
          ${lines.length ? `
            <div class="reason-stack">
              ${lines.slice(0, compact ? 1 : 3).map((line) => `<p>${esc(line)}</p>`).join("")}
            </div>
          ` : ""}
        </div>
      `;
    }

    function hatchTraitSummary(bug) {
      const text = `${bug.name} ${bug.sizes} ${bug.water} ${bug.body} ${bug.stages.join(" ")}`.toLowerCase();
      return text;
    }

    const HATCH_ID_SIZE_RANGES = { tiny: [18, 26], small: [14, 18], large: [2, 12] };

    function hookSizeRange(sizes) {
      const numbers = (String(sizes || "").match(/\d+/g) || []).map(Number).filter(Number.isFinite);
      return numbers.length ? [Math.min(...numbers), Math.max(...numbers)] : null;
    }

    function sizeRangesOverlap(a, b) {
      return Boolean(a && b && a[0] <= b[1] && b[0] <= a[1]);
    }

    function hatchCandidateScore(bug) {
      const text = hatchTraitSummary(bug);
      let score = 0;
      const size = hatchIdTraits.size || "";
      const color = hatchIdTraits.color || "";
      const water = hatchIdTraits.water || "";
      const behavior = hatchIdTraits.behavior || "";
      if (!size && !color && !water && !behavior) {
        return bug.id === activeBug ? 5 : predictedHatches(getWater()).some((hatch) => hatchProfileFor(hatch).bugId === bug.id) ? 4 : 1;
      }
      // Sizes are a hook-size range, and the whole range counts. Matching only
      // the number after "#" read "#16-22" as a #16, so a BWO scored nothing
      // for "tiny" and streamers tied the midges for first place.
      if (size && HATCH_ID_SIZE_RANGES[size] && sizeRangesOverlap(hookSizeRange(bug.sizes), HATCH_ID_SIZE_RANGES[size])) score += 3;
      if (color && text.includes(color)) score += 3;
      if (color === "yellow" && /pale|cream|golden|sally/.test(text)) score += 3;
      if (color === "tan" && /tan|orange|caddis|hopper|sedge/.test(text)) score += 3;
      if (color === "black" && /black|dark|red|blood|midge|chironomid/.test(text)) score += 3;
      if (water === "river" && /river|deschutes|crooked|metolius|fall|whychus|current|riffle/.test(text)) score += 3;
      if (water === "lake" && /lake|stillwater|hosmer|east|crane|davis|paulina|weed|suspended/.test(text)) score += 3;
      if (water === "bank" && /bank|grass|terrestrial|hopper|ant|beetle|stone/.test(text)) score += 3;
      if (behavior === "deep" && /nymph|larva|pupa|bottom|deep/.test(text)) score += 2;
      if (behavior === "rising" && /emerger|pupa|film|rising/.test(text)) score += 2;
      if (behavior === "surface" && /adult|dun|spinner|dry|surface/.test(text)) score += 2;
      if (behavior === "moving" && /leech|streamer|baitfish|swimming|damsel|chasing/.test(text)) score += 2;
      return score;
    }

    // With traits chosen, a bug that matches none of them is not a result.
    function hatchIdResults() {
      const filtered = Object.values(hatchIdTraits).some(Boolean);
      return bugs
        .map((bug) => ({ bug, score: hatchCandidateScore(bug) }))
        .filter(({ score }) => !filtered || score > 0)
        .sort((a, b) => b.score - a.score || a.bug.name.localeCompare(b.bug.name))
        .slice(0, 3);
    }

    function hatchIdAssistantPanel() {
      if (!proAccessActive) {
        return `<div class="hatch-assistant">${proLock("Hatch ID assistant - Pro", "Narrow what you are looking at by size, colour, water type and behaviour, then jump straight to the matching fly patterns.")}</div>`;
      }
      const hasFilters = Object.values(hatchIdTraits).some(Boolean);
      const results = hatchIdResults();
      return `
        <div class="hatch-assistant">
          <div class="panel-head">
            <div>
              <h3>Hatch ID Assistant</h3>
              <p class="subtle">${skillMode === "Beginner" ? "Choose what you can see. The app suggests likely bugs and matching flies." : "Filter by size, color, water type, and behavior to narrow the likely hatch."}</p>
            </div>
            ${hasFilters ? `<button class="ghost-btn" data-hatch-clear>Clear</button>` : ""}
          </div>
          <div class="trait-grid">
            ${Object.entries(hatchTraitOptions).map(([key, options]) => `
              <label>
                <span>${key}</span>
                <select data-hatch-trait="${key}">
                  ${options.map(([value, label]) => `<option value="${value}" ${hatchIdTraits[key] === value ? "selected" : ""}>${label}</option>`).join("")}
                </select>
              </label>
            `).join("")}
          </div>
          <div class="hatch-results">
            ${results.length ? "" : `<p class="subtle">Nothing in the bug library matches those traits. Try clearing one.</p>`}
            ${results.map(({ bug, score }) => {
              const profile = hatchProfileFor(bug.name);
              const flies = flyLibraryForBug(bug.id).slice(0, 3);
              return `
                <button class="hatch-result ${bug.id === activeBug ? "active" : ""}" data-hatch-pick="${bug.id}">
                  <div class="hatch-thumb" style="${hatchThumbStyle(profile, 2)}" role="img" aria-label="${bug.name} reference"></div>
                  <div>
                    <strong>${bug.name}</strong>
                    <span>${score ? `${score} match points` : "Baseline match"} - ${bug.cue}</span>
                    <small>${flies.map((fly) => fly.name).join(", ")}</small>
                  </div>
                </button>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    /* ---------------------------------------------------------------------
       Snap a bug: photo-ASSISTED hatch ID.

       There is no image classifier in this app, no labelled photo set to
       train one on, and no server to send a photo to - and the app has to work
       on a riverbank with no signal. So the photo never identifies anything,
       and the screen says so. It is a reference the angler compares against
       and a surface they sample a colour from. Every trait the score uses is
       one the angler confirmed: the colour they tapped (and can overrule), the
       size bucket, the wing shape and the tail count they saw.

       The photo goes through the catch-photo decoder (readPhotoCanvas), is
       held in memory, and is stored only if the angler attaches it to a catch.
       --------------------------------------------------------------------- */

    // Colour keys shared with the Hatch ID assistant (olive, tan, black,
    // yellow), plus the three a photo sample can separate that the dropdown
    // folds together: red, blue and grey.
    const SNAP_COLOURS = [
      ["olive", "Olive / green"],
      ["tan", "Tan / brown / orange"],
      ["black", "Black / dark"],
      ["yellow", "Pale / yellow / cream"],
      ["red", "Red / maroon"],
      ["blue", "Blue / blue-green"],
      ["grey", "Grey / silver"]
    ];

    /* Body lengths are approximate standard dry-fly shank lengths for each
       hook size, and the buckets overlap their neighbours on purpose: hook
       sizes are not a precise measurement and neither is a bug on a fingertip.
       SNAP_PX_PER_MM draws them at roughly actual size on an iPhone. A CSS
       pixel is one iOS point, and iPhones run about 153-163 points to the inch
       (460ppi / 3, 326ppi / 2), so about 6.2 points to the millimetre. CSS
       "mm" would be wrong by 40%: it assumes 96 per inch. On an iPad (132
       points to the inch) the silhouettes draw about a fifth too large, which
       the panel says. */
    const SNAP_PX_PER_MM = 6.2;
    const SNAP_SIZE_BUCKETS = [
      { id: "big", label: "Bigger than #12", range: [2, 10], mm: 0, hint: "Over ~10 mm body" },
      { id: "s12", label: "#12", range: [10, 14], mm: 10, hint: "~10 mm body" },
      { id: "s16", label: "#16", range: [14, 18], mm: 6.5, hint: "~6.5 mm body" },
      { id: "s20", label: "#20", range: [18, 22], mm: 4, hint: "~4 mm body" },
      { id: "s24", label: "#24", range: [22, 26], mm: 3, hint: "~3 mm body" }
    ];

    const SNAP_LINE_ART = (paths) => `<svg class="snap-icon" viewBox="0 0 48 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;

    const SNAP_SHAPES = [
      ["upright", "Wings upright like sails", "Mayfly", SNAP_LINE_ART('<path d="M6 21c8-1 18-1 30 0"/><circle cx="38" cy="21" r="2"/><path d="M21 20L25 4l7 15"/><path d="M6 21L1 14M6 21L1 18"/>')],
      ["tent", "Wings tent-like over the back", "Caddis", SNAP_LINE_ART('<path d="M10 23h24"/><path d="M5 24L20 10l16 10"/><circle cx="37" cy="22" r="2"/><path d="M38 20c3-6 6-9 9-11"/>')],
      ["flat", "Wings flat over the back", "Stonefly", SNAP_LINE_ART('<path d="M34 12H10c-4 0-6 2-6 4s2 4 6 4h24"/><path d="M10 16h26"/><circle cx="39" cy="16" r="2.5"/><path d="M41 15l6-6M41 17l6 6"/>')],
      ["long", "Long thin body, wings held apart or together", "Damsel / dragonfly", SNAP_LINE_ART('<path d="M3 21h33"/><circle cx="40" cy="20" r="3"/><path d="M34 19c-3-7-8-12-16-13M34 19c0-7 1-12 5-15"/>')],
      ["legs", "Legs but no wings", "Nymph, ant, beetle", SNAP_LINE_ART('<ellipse cx="26" cy="16" rx="11" ry="5"/><path d="M20 12l-4-7M26 11V4M32 12l4-7M20 20l-4 7M26 21v7M32 20l4 7"/><path d="M15 16H3M15 15L5 10M15 17L5 22"/>')],
      ["worm", "No visible wings, worm-like", "Midge larva, chironomid, leech", SNAP_LINE_ART('<path d="M3 22c6-12 12 0 18-8s12 4 16-2 6-4 8-6"/>')],
      ["fish", "A small fish", "Baitfish", SNAP_LINE_ART('<path d="M4 16c8-10 22-10 30 0-8 10-22 10-30 0z"/><path d="M34 16l10-7v14z"/><circle cx="11" cy="15" r="1"/>')]
    ];

    const SNAP_TAILS = [
      ["2", "2 tails", "Stonefly, some mayflies", SNAP_LINE_ART('<path d="M24 16h20"/><path d="M24 16L4 8M24 16L4 24"/>')],
      ["3", "3 tails", "Most mayflies, damsel nymph", SNAP_LINE_ART('<path d="M24 16h20"/><path d="M24 16L4 8M24 16H2M24 16L4 24"/>')],
      ["none", "No tails", "Caddis, midge, terrestrials", SNAP_LINE_ART('<path d="M22 12h22v8H22a4 4 0 0 1 0-8z"/>')]
    ];

    const SNAP_TRAIT_KEYS = ["color", "size", "shape", "tails"];
    const SNAP_TRAIT_NAMES = { color: "Colour", size: "Size", shape: "Shape", tails: "Tails" };
    const SNAP_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    // Bugs with no Snap a bug traits. Empty is the only correct answer; the
    // behaviour suite asserts it.
    function bugsMissingSnapTraits() {
      return bugs.filter((bug) => {
        const traits = BUG_SNAP_TRAITS[bug.id];
        return !traits || !traits.colors?.length || !traits.shapes?.length || !traits.tails?.length || !hookSizeRange(bug.sizes);
      }).map((bug) => bug.id);
    }

    function rgbToHsl({ r, g, b }) {
      const red = r / 255;
      const green = g / 255;
      const blue = b / 255;
      const max = Math.max(red, green, blue);
      const min = Math.min(red, green, blue);
      const l = (max + min) / 2;
      if (max === min) return { h: 0, s: 0, l };
      const d = max - min;
      const s = l > .5 ? d / (2 - max - min) : d / (max + min);
      let h;
      if (max === red) h = ((green - blue) / d + (green < blue ? 6 : 0)) * 60;
      else if (max === green) h = ((blue - red) / d + 2) * 60;
      else h = ((red - green) / d + 4) * 60;
      return { h, s, l };
    }

    /* The colour classifier. Deliberately small and readable, because the
       angler is told what the swatch "reads as" and is expected to overrule
       it when the light or the background fooled it. RGB -> HSL, then:

         lightness under 18%                     black / dark (no hue left to read)
         saturation under 15% (a grey):
           lightness over 85%                    pale / cream (silver is ~75%)
           lightness under 35%                   black / dark
           otherwise                             grey / silver
         lightness over 80% (a washed-out tint)  pale / cream
         hue under 15 or 335 and up              red / maroon
         hue 15-45                               tan / brown / orange
         hue 45-70: lightness under 45%          olive (a dark yellow is olive)
                    otherwise                    pale / yellow
         hue 70-170                              olive / green
         hue 170-260                             blue / blue-green
         hue 260-335                             red / maroon (purples read as maroon on a bug)

       No bug in the library is purple, and a photographed leech that looks
       maroon belongs with red, not blue. */
    function classifyBugColour(rgb) {
      const { h, s, l } = rgbToHsl(rgb);
      if (l < .18) return "black";
      if (s < .15) {
        if (l > .85) return "yellow";
        if (l < .35) return "black";
        return "grey";
      }
      if (l > .8) return "yellow";
      if (h < 15 || h >= 335) return "red";
      if (h < 45) return "tan";
      if (h < 70) return l < .45 ? "olive" : "yellow";
      if (h < 170) return "olive";
      if (h < 260) return "blue";
      return "red";
    }

    function rgbHex({ r, g, b }) {
      return `#${[r, g, b].map((value) => Math.round(value).toString(16).padStart(2, "0")).join("")}`;
    }

    /* A tap in CSS pixels, mapped to a pixel of the photo's own canvas. What
       carries over is the tap's *fraction* of the displayed box: CSS scales
       the photo to fit the panel, and devicePixelRatio changes only how many
       screen pixels draw it, never which photo pixel is under the finger.
       Reading clientX straight against the canvas would sample the wrong spot
       on every phone - by the CSS scale, and again by 2x or 3x for the DPR. */
    function snapTapToPixel(clientX, clientY, rect, canvasWidth, canvasHeight) {
      const fx = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      const fy = Math.min(1, Math.max(0, (clientY - rect.top) / rect.height));
      return {
        x: Math.min(canvasWidth - 1, Math.floor(fx * canvasWidth)),
        y: Math.min(canvasHeight - 1, Math.floor(fy * canvasHeight)),
        fx,
        fy
      };
    }

    // About three CSS pixels either side of the tap, expressed in photo
    // pixels: a fingertip-sized patch is averaged so one speck of glare or a
    // JPEG block edge does not decide the colour.
    function snapSampleRadius(rect, canvasWidth) {
      return Math.max(1, Math.min(24, Math.round(3 * canvasWidth / Math.max(1, rect.width))));
    }

    // Mean colour of the square of side 2*radius+1 around (x, y), clipped to
    // the image. `data` is RGBA, row-major, as getImageData returns it.
    function averageRgb(data, width, height, x, y, radius) {
      let r = 0;
      let g = 0;
      let b = 0;
      let count = 0;
      for (let row = Math.max(0, y - radius); row <= Math.min(height - 1, y + radius); row += 1) {
        for (let column = Math.max(0, x - radius); column <= Math.min(width - 1, x + radius); column += 1) {
          const index = (row * width + column) * 4;
          r += data[index];
          g += data[index + 1];
          b += data[index + 2];
          count += 1;
        }
      }
      if (!count) return null;
      return { r: Math.round(r / count), g: Math.round(g / count), b: Math.round(b / count) };
    }

    function snapTraitMatches(bug, key, value) {
      const traits = BUG_SNAP_TRAITS[bug.id];
      if (!traits || !value) return false;
      if (key === "size") {
        const bucket = SNAP_SIZE_BUCKETS.find((item) => item.id === value);
        return Boolean(bucket) && sizeRangesOverlap(hookSizeRange(bug.sizes), bucket.range);
      }
      if (key === "color") return traits.colors.includes(value);
      if (key === "shape") return traits.shapes.includes(value);
      if (key === "tails") return traits.tails.includes(value);
      return false;
    }

    // What the angler chose, in words.
    function snapChoiceLabel(key, value) {
      if (key === "color") return SNAP_COLOURS.find(([id]) => id === value)?.[1] || value;
      if (key === "size") return SNAP_SIZE_BUCKETS.find((item) => item.id === value)?.label || value;
      if (key === "shape") return SNAP_SHAPES.find(([id]) => id === value)?.[1] || value;
      if (key === "tails") return SNAP_TAILS.find(([id]) => id === value)?.[1] || value;
      return value;
    }

    // What the bug actually has, for explaining a miss.
    function snapBugTraitLabel(bug, key) {
      const traits = BUG_SNAP_TRAITS[bug.id] || { colors: [], shapes: [], tails: [] };
      if (key === "size") return bug.sizes;
      if (key === "color") return traits.colors.map((id) => snapChoiceLabel("color", id).split(" / ")[0]).join(", ");
      if (key === "shape") return traits.shapes.map((id) => snapChoiceLabel("shape", id).toLowerCase()).join(" or ");
      if (key === "tails") return traits.tails.map((id) => snapChoiceLabel("tails", id).toLowerCase()).join(" or ");
      return "";
    }

    function snapPriorContext(month = currentMonth(), water = getWater()) {
      return {
        month,
        waterName: water.name,
        predictedBugIds: uniqueItems(predictedHatches(water).map((hatch) => hatchProfileFor(hatch).bugId).filter(Boolean))
      };
    }

    /* Priors only reorder bugs the traits already support: a trait is worth
       10, in season 3 (the month either side 1), on today's predicted list for
       the selected water 2. An out-of-season bug loses 3 - ranked lower, never
       ruled out, because the angler is holding the evidence and the season
       table is a reference. */
    function snapPriorFor(bug, context) {
      const fit = hatchSeasonFit(bug.name, context.month);
      const onWater = context.predictedBugIds.includes(bug.id);
      const monthName = SNAP_MONTHS[context.month - 1] || "this month";
      const reasons = [];
      let boost;
      if (fit === 1) {
        boost = 3;
        reasons.push(`In season in ${monthName} (${bug.season}) - ranked up.`);
      } else if (fit > 0) {
        boost = 1;
        reasons.push(`Edge of its season in ${monthName} (${bug.season}) - ranked up a little.`);
      } else {
        boost = -3;
        reasons.push(`Out of season in ${monthName} (${bug.season}) - ranked lower, not ruled out.`);
      }
      if (onWater) {
        boost += 2;
        reasons.push(`On the predicted hatch list for ${context.waterName} - ranked up.`);
      }
      return { fit, onWater, boost, reasons };
    }

    /* Top three bugs for the traits the angler set. Nothing set, no results.
       A bug has to match at least half of what was set to be a result at all:
       one hit out of four is not a match, and listing it would make the panel
       look surer than the evidence is. */
    function snapBugResults(traits, context = snapPriorContext()) {
      const answered = SNAP_TRAIT_KEYS.filter((key) => traits?.[key]);
      if (!answered.length) return [];
      return bugs
        .map((bug) => {
          const matched = answered.filter((key) => snapTraitMatches(bug, key, traits[key]));
          const missed = answered.filter((key) => !matched.includes(key));
          const prior = snapPriorFor(bug, context);
          return { bug, matched, missed, answered: answered.length, prior, score: matched.length * 10 - missed.length * 5 + prior.boost };
        })
        .filter((result) => result.matched.length > 0 && result.matched.length * 2 >= result.answered)
        .sort((a, b) => b.score - a.score || a.bug.name.localeCompare(b.bug.name))
        .slice(0, 3);
    }

    // "Strong" needs at least three traits set and three in four matched;
    // fewer traits than that cannot support a strong claim however they match.
    function snapConfidenceLabel(result) {
      const matched = result.matched.length;
      const strength = result.answered >= 3 && matched / result.answered >= .75 ? "Strong" : "Possible";
      return `${strength} match on ${matched} of ${result.answered} trait${result.answered === 1 ? "" : "s"}`;
    }

    // One blob: URL per photo, made when it loads and revoked when it is
    // cleared or replaced. Falls back to the data URL where blob URLs are
    // unavailable.
    function snapPhotoObjectUrl(dataUrl) {
      try {
        const [head, body] = String(dataUrl).split(",");
        const type = (head.match(/^data:([^;,]+)/) || [])[1] || "image/jpeg";
        const bytes = atob(body);
        const array = new Uint8Array(bytes.length);
        for (let index = 0; index < bytes.length; index += 1) array[index] = bytes.charCodeAt(index);
        return URL.createObjectURL(new Blob([array], { type })) || dataUrl;
      } catch {
        return dataUrl;
      }
    }

    function snapPhotoSrc() {
      return snapBug.photoUrl || snapBug.photo;
    }

    function clearSnapBug() {
      snapPhotoSequence += 1;
      if (snapBug.photoUrl && snapBug.photoUrl.startsWith("blob:")) {
        try {
          URL.revokeObjectURL(snapBug.photoUrl);
        } catch {
          // Already gone.
        }
      }
      snapBug = { status: "idle", photo: "", photoUrl: "", error: "", sample: null, autoColor: "" };
      snapTraits = { ...SNAP_NO_TRAITS };
      snapSampleCanvas = null;
    }

    async function loadSnapPhoto(file) {
      if (!file || !proAccessActive) return;
      clearSnapBug();
      const sequence = snapPhotoSequence;
      snapBug = { ...snapBug, status: "loading" };
      renderScreens("bugs");
      try {
        const canvas = await readPhotoCanvas(file);
        // A second photo picked while this one decoded wins.
        if (sequence !== snapPhotoSequence) return;
        if (!canvas) throw new Error("No photo");
        snapSampleCanvas = canvas;
        const photo = canvas.toDataURL("image/jpeg", .82);
        snapBug = { ...snapBug, status: "ready", photo, photoUrl: snapPhotoObjectUrl(photo) };
      } catch {
        if (sequence !== snapPhotoSequence) return;
        snapBug = { ...snapBug, status: "error", error: "That photo could not be opened. Try another one." };
      }
      renderScreens("bugs");
      if (activeScreenId() === "bugs") scrollAppTo("#bugs .snap-bug");
    }

    // Samples the photo under a tap, sets the colour trait, and returns the
    // colour key (or null when there is nothing to sample).
    function sampleSnapAt(image, clientX, clientY) {
      const canvas = snapSampleCanvas;
      const context = canvas?.getContext("2d", { willReadFrequently: true });
      const rect = image?.getBoundingClientRect();
      if (!canvas || !context || !rect?.width || !rect?.height) return null;
      const point = snapTapToPixel(clientX, clientY, rect, canvas.width, canvas.height);
      const radius = snapSampleRadius(rect, canvas.width);
      const left = Math.max(0, point.x - radius);
      const top = Math.max(0, point.y - radius);
      const width = Math.min(canvas.width, point.x + radius + 1) - left;
      const height = Math.min(canvas.height, point.y + radius + 1) - top;
      const pixels = context.getImageData(left, top, width, height);
      const rgb = averageRgb(pixels.data, width, height, point.x - left, point.y - top, radius);
      if (!rgb) return null;
      const color = classifyBugColour(rgb);
      snapBug = { ...snapBug, sample: { ...rgb, hex: rgbHex(rgb), fx: point.fx, fy: point.fy }, autoColor: color };
      snapTraits = { ...snapTraits, color };
      renderBugs();
      return color;
    }

    function snapSizeArt(bucket) {
      if (!bucket.mm) {
        return `<svg class="snap-size-art" width="44" height="18" viewBox="0 0 44 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 9h36M31 3l8 6-8 6"/></svg>`;
      }
      const width = Math.round(bucket.mm * SNAP_PX_PER_MM);
      const height = Math.max(6, Math.round(width * .32));
      return `<svg class="snap-size-art" width="${width}" height="${height}" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true"><path d="M0 18C20 8 70 8 100 15C70 26 20 26 0 18Z" fill="currentColor"/></svg>`;
    }

    function snapChoiceButton(key, value, art, label, hint) {
      const selected = snapTraits[key] === value;
      return `
        <button type="button" class="snap-choice ${selected ? "active" : ""}" data-snap-choice="${attr(key)}" data-snap-value="${attr(value)}" aria-pressed="${selected ? "true" : "false"}">
          ${art}
          <b>${esc(label)}</b>
          <small>${esc(hint)}</small>
        </button>
      `;
    }

    function snapResultCard(result) {
      const { bug } = result;
      const flies = flyLibraryForBug(bug.id).slice(0, 3);
      return `
        <div class="snap-result">
          <div class="snap-compare">
            <figure>
              <img src="${attr(snapPhotoSrc())}" alt="Your photo">
              <figcaption>Your photo</figcaption>
            </figure>
            <figure>
              <div class="snap-plate" style="${attr(bugImageStyle(bug))}" role="img" aria-label="${attr(bug.name)} reference plate"></div>
              <figcaption>${esc(bug.name)}</figcaption>
            </figure>
          </div>
          <strong>${esc(bug.name)}</strong>
          <span class="snap-confidence">${esc(snapConfidenceLabel(result))}</span>
          <ul class="snap-trait-list">
            ${result.matched.map((key) => `<li class="hit">Matched ${esc(SNAP_TRAIT_NAMES[key].toLowerCase())}: ${esc(snapChoiceLabel(key, snapTraits[key]))}</li>`).join("")}
            ${result.missed.map((key) => `<li class="miss">Missed ${esc(SNAP_TRAIT_NAMES[key].toLowerCase())}: you chose ${esc(snapChoiceLabel(key, snapTraits[key]))}; ${esc(bug.name)} is ${esc(snapBugTraitLabel(bug, key))}</li>`).join("")}
          </ul>
          ${result.prior.reasons.map((reason) => `<p class="subtle">${esc(reason)}</p>`).join("")}
          ${flies.length ? `<span class="snap-step-label">Matching flies</span>` : ""}
          <div class="snap-result-actions">
            ${flies.map((fly) => `<button type="button" class="fly-badge" data-snap-fly="${attr(fly.name)}">${esc(fly.name)}</button>`).join("")}
            <button type="button" class="ghost-btn" data-hatch-pick="${attr(bug.id)}">Open ${esc(bug.name)}</button>
          </div>
        </div>
      `;
    }

    function snapResultsPanel() {
      const answered = SNAP_TRAIT_KEYS.filter((key) => snapTraits[key]).length;
      if (!answered) {
        return `<p class="subtle snap-empty">Tap the bug in the photo or answer a question to see the closest bugs in the library.</p>`;
      }
      const results = snapBugResults(snapTraits);
      if (!results.length) {
        return `<p class="subtle snap-empty" role="status">Nothing in the bug library matches at least half of what you chose. Check the colour sample, or clear a trait you are unsure of.</p>`;
      }
      return `
        <div class="snap-results">
          <h4>Closest in the bug library</h4>
          <p class="subtle">Compared on what you confirmed, not on the photo itself. Season and the predicted hatches for ${esc(getWater().name)} only reorder bugs your answers already support.</p>
          <div class="snap-results-grid">
            ${results.map(snapResultCard).join("")}
          </div>
        </div>
      `;
    }

    function snapWorkspace() {
      const sample = snapBug.sample;
      const autoLabel = snapBug.autoColor ? snapChoiceLabel("color", snapBug.autoColor) : "";
      const overridden = Boolean(sample) && snapTraits.color !== snapBug.autoColor;
      return `
        <div class="snap-workspace">
          <div class="snap-photo-column">
            <span class="snap-step-label">1. Colour - tap the bug's body</span>
            <div class="snap-photo-frame">
              <img class="snap-photo" src="${attr(snapPhotoSrc())}" data-snap-sample alt="Your bug photo. Tap the bug's body to sample its colour.">
              ${sample ? `<i class="snap-marker" style="left:${(sample.fx * 100).toFixed(2)}%;top:${(sample.fy * 100).toFixed(2)}%"></i>` : ""}
            </div>
            <div class="snap-colour-row">
              <span class="snap-swatch ${sample ? "" : "empty"}" style="${sample ? `background:${attr(sample.hex)}` : ""}" aria-hidden="true"></span>
              <p class="subtle" data-snap-sample-status>${sample
                ? `Sample ${esc(sample.hex)} reads as <b>${esc(autoLabel)}</b>.${overridden ? ` You changed it to ${esc(snapChoiceLabel("color", snapTraits.color) || "not set")}.` : " Change it below if the light fooled it."}`
                : "No sample yet. Shade, glare and the background all shift a photo's colour, so check what it reads as."}</p>
            </div>
            <label>Colour
              <select data-snap-trait="color">
                <option value="" ${snapTraits.color ? "" : "selected"}>Not set</option>
                ${SNAP_COLOURS.map(([value, label]) => `<option value="${attr(value)}" ${snapTraits.color === value ? "selected" : ""}>${esc(label)}</option>`).join("")}
              </select>
            </label>
            <button type="button" class="ghost-btn" data-snap-attach>Attach photo to a catch</button>
          </div>
          <div class="snap-questions">
            <div class="snap-step">
              <span class="snap-step-label">2. Size</span>
              <p class="subtle">Hold the bug, or the phone, beside the screen. The silhouettes are drawn at roughly actual size on an iPhone; on an iPad or other screens they are only approximate. Or compare it with your fingernail: a bug about as long as a fingernail is roughly a #12-14 body.</p>
              <div class="snap-choice-grid">
                ${SNAP_SIZE_BUCKETS.map((bucket) => snapChoiceButton("size", bucket.id, snapSizeArt(bucket), bucket.label, bucket.hint)).join("")}
              </div>
            </div>
            <div class="snap-step">
              <span class="snap-step-label">3. Wings and shape</span>
              <div class="snap-choice-grid">
                ${SNAP_SHAPES.map(([value, label, hint, art]) => snapChoiceButton("shape", value, art, label, hint)).join("")}
              </div>
            </div>
            <div class="snap-step">
              <span class="snap-step-label">4. Tails</span>
              <div class="snap-choice-grid">
                ${SNAP_TAILS.map(([value, label, hint, art]) => snapChoiceButton("tails", value, art, label, hint)).join("")}
              </div>
            </div>
          </div>
          ${snapResultsPanel()}
        </div>
      `;
    }

    function snapBugPanel() {
      if (!proAccessActive) {
        return `<div class="snap-bug">${proLock("Snap a bug - Pro", "Photograph a bug, tap it to sample its colour, answer three quick questions about size and shape, and compare the closest bugs side by side with your photo. The app does not recognise bugs from photos; you confirm every trait.")}</div>`;
      }
      return `
        <div class="snap-bug">
          <div class="panel-head">
            <div>
              <h3>Snap a Bug</h3>
              <p class="subtle">Photo-assisted, not automatic: the app does not recognise bugs from a photo. Your photo is a reference to compare against and to sample a colour from, and you confirm every trait. It stays on this screen and is saved only if you attach it to a catch.</p>
            </div>
            ${snapBug.status === "idle" ? "" : `<button type="button" class="ghost-btn" data-snap-clear>Clear</button>`}
          </div>
          <div class="snap-pick-row">
            <label class="primary-btn snap-pick">${icon.camera}Snap a bug<input type="file" accept="image/*" capture="environment" data-snap-photo aria-label="Snap a bug with the camera"></label>
            <label class="ghost-btn snap-pick">Choose a photo<input type="file" accept="image/*" data-snap-photo aria-label="Choose a bug photo from your library"></label>
          </div>
          ${snapBug.status === "loading" ? `<p class="subtle" role="status">Reading the photo...</p>` : ""}
          ${snapBug.status === "error" ? `<p class="subtle snap-error" role="alert">${esc(snapBug.error)}</p>` : ""}
          ${snapBug.status === "ready" && snapBug.photo ? snapWorkspace() : ""}
        </div>
      `;
    }

    function liveRecommendationReason(water) {
      const report = liveReports.byWater[water.id];
      const intel = localIntelForWater(water);
      if (!report) return "Pull live inputs to compare gauge, forecast, and report context against the seasonal hatch profile.";
      if (report.status === "loading") return "Checking USGS gauge and NWS forecast now.";
      if (report.status === "error") return `Live pull failed: ${report.error}`;
      if (report.refreshing) return "Updating from signal now while keeping the saved local report available.";
      // An expired report is not quoted as what the river is doing now.
      if (!usableReport(water)) return "The saved readings for this water are too old to use. Update with signal to compare gauge and forecast against the seasonal hatch profile.";
      const parts = [];
      if (report.usgs?.flow) parts.push(`${report.usgs.flow} from USGS`);
      if (report.usgs?.waterTemp) parts.push(`${report.usgs.waterTemp} water`);
      if (report.nws?.forecast) parts.push(`${report.nws.forecast.toLowerCase()} forecast`);
      if (report.nws?.wind) parts.push(`${report.nws.wind} wind`);
      if (intel.sources?.length) parts.push(`${intel.sources.slice(0, 2).join(" + ")} local report signal`);
      const prefix = report.fromCache ? "Using saved local data" : "Adjusted";
      const suffix = report.refreshError ? ` Last update failed: ${report.refreshError}.` : "";
      return parts.length ? `${prefix} from ${parts.join(", ")}.${suffix}` : `Forecast/report links loaded, but no gauge values were available for this water.${suffix}`;
    }

    function dataModelNotice(water) {
      const report = liveReports.byWater[water.id];
      const intel = localIntelForWater(water);
      if (report?.refreshing) return "Updating now. The app will keep using the saved local report if signal drops.";
      if (report?.status === "ready") {
        return intel.sources?.length
          ? `Stored locally on this device. Model blends USGS/NWS data with daily local report signals from ${intel.sources.slice(0, 3).join(", ")}.`
          : "Stored locally on this device. Fishability, hatch window, and fly suggestions are adjusted from USGS gauge values and the NWS forecast; local report pages are scrubbed daily when readable.";
      }
      if (report?.status === "loading") return "Pulling live USGS and NWS inputs for this water.";
      return "Seasonal baseline: refresh live inputs to update this water with USGS and NWS data.";
    }

    function liveReportPanel(water) {
      const report = liveReports.byWater[water.id];
      const intel = localIntelForWater(water);
      const status = report?.refreshing ? "refreshing" : report?.status || "idle";
      const meta = report?.meta || liveMetaFor(water);
      const usgsLabel = meta.usgs ? `USGS ${meta.usgs}` : "No gauge mapped";
      const intelUpdated = liveReports.cache?.localIntel?.updatedAt ? formatSavedTime(liveReports.cache.localIntel.updatedAt) : "Not scrubbed yet";
      const updated = report?.cachedAt ? `Saved locally ${formatSavedTime(report.cachedAt)}` : report?.updatedAt ? `Updated ${report.updatedAt}` : "Not pulled yet";
      const rows = report?.status === "ready" ? `
        <div class="line-row"><span>Gauge</span><b>${usgsLabel}${report.usgs?.flow ? ` - ${report.usgs.flow}` : ""}${report.usgs?.waterTemp ? ` - ${report.usgs.waterTemp}` : ""}</b></div>
        <div class="line-row"><span>Forecast</span><b>${report.nws?.air || "Air n/a"} - ${report.nws?.wind || "Wind n/a"}${report.nws?.forecast ? ` - ${report.nws.forecast}` : ""}</b></div>
        <div class="line-row"><span>Local intel</span><b>${intel.sources?.length ? `${intel.sources.join(" + ")} - ${uniqueItems([...intel.hatches, ...intel.flies]).slice(0, 4).join(", ")}` : `Daily scrub saved ${intelUpdated}`}</b></div>
        ${(report.errors || []).length ? `<div class="line-row"><span>Gaps</span><b>${esc(report.errors.join(" / "))}</b></div>` : ""}
        ${report.refreshError ? `<div class="line-row"><span>Last update</span><b>${esc(report.refreshError)}</b></div>` : ""}
      ` : `
        <div class="line-row"><span>Gauge</span><b>${usgsLabel}</b></div>
        <div class="line-row"><span>Forecast point</span><b>${meta.lat.toFixed(2)}, ${meta.lon.toFixed(2)}</b></div>
      `;
      return `
        <div class="live-panel">
          <div class="panel-head">
            <div>
              <h3>Saved Report Inputs</h3>
              <p class="subtle">${updated} - ${status === "loading" ? "Loading live sources..." : esc(liveRecommendationReason(water))}</p>
            </div>
            <button class="ghost-btn" data-refresh-live="${water.id}">${status === "loading" || status === "refreshing" ? "Updating..." : "Update"}</button>
          </div>
          ${rows}
          <p class="model-note">${dataModelNotice(water)}</p>
          <div class="source-links">
            ${reportLinks.map(([label, url]) => `<a href="${url}" target="_blank" rel="noopener">${label}</a>`).join("")}
          </div>
        </div>
      `;
    }

    function hatchProfileFor(name) {
      const key = name.toLowerCase();
      if (key.includes("bwo") || key.includes("blue")) return hatchProfiles.bwo;
      if (key.includes("pmd") || key.includes("pale")) return hatchProfiles.pmd;
      if (key.includes("drake")) return hatchProfiles.greenDrake;
      if (key.includes("callibaetis")) return hatchProfiles.callibaetis;
      if (key.includes("chironomid")) return hatchProfiles.chironomid;
      if (key.includes("midge")) return hatchProfiles.midge;
      if (key.includes("october")) return hatchProfiles.octoberCaddis;
      if (key.includes("sally")) return hatchProfiles.yellowSally;
      if (key.includes("caddis") || key.includes("sedge")) return hatchProfiles.caddis;
      // Odonata: dragonfly nymphs fish like damsels, not like caddis on a lake.
      if (key.includes("damsel") || key.includes("dragonfly")) return hatchProfiles.damsel;
      if (key.includes("terrestrial") || key.includes("hopper") || key.includes("ant") || key.includes("beetle") || key.includes("cricket")) return hatchProfiles.terrestrial;
      if (key.includes("baitfish") || key.includes("minnow") || key.includes("sculpin") || key.includes("streamer") || key.includes("clouser") || key.includes("muddler") || key.includes("zonker") || key.includes("kreelex")) return hatchProfiles.baitfish;
      if (key.includes("leech") || key.includes("bugger")) return hatchProfiles.leech;
      if (key.includes("stone") || key.includes("salmonfly") || key.includes("golden")) return hatchProfiles.stonefly;
      return { ...hatchProfiles.caddis, label: name, size: "12-16", trigger: "active feeding" };
    }

    function hatchThumbStyle(profile, stage = 2) {
      const bug = bugs.find((item) => item.id === profile.bugId) || bugs[0];
      return bugImageStyle(bug, stage);
    }

    function stageFlyStyle(ref) {
      return `background-image:url('${ref.plate}');background-position:${ref.pos};background-size:${ref.size || "200% 200%"};`;
    }

    function flyLibraryForBug(bugId, stageName = null) {
      const normalizedStage = String(stageName || "").toLowerCase();
      return flyLibrary.filter((fly) => {
        if (fly.bugId !== bugId) return false;
        if (!normalizedStage) return true;
        const flyStage = fly.stage.toLowerCase();
        if (normalizedStage.includes(flyStage) || flyStage.includes(normalizedStage)) return true;
        if (normalizedStage.includes("larva") && flyStage.includes("pupa")) return true;
        if (normalizedStage.includes("pupa") && flyStage.includes("larva")) return true;
        if (normalizedStage.includes("mature") && flyStage.includes("nymph")) return true;
        if (normalizedStage.includes("swimming") && flyStage.includes("nymph")) return true;
        if (normalizedStage.includes("dry") && flyStage.includes("adult")) return true;
        return false;
      });
    }

    function flyReferenceForLibraryItem(item) {
      return artificialFlyRefsByName[item?.name] || item?.ref || flyRefFor(item?.name || "");
    }

    function selectedFlyFrom(items) {
      return items.find((item) => item.name === activeFlyName) || items[0] || flyLibrary[0];
    }

    function findLibraryFlyByName(name) {
      const text = String(name || "").toLowerCase();
      return flyLibrary.find((fly) => fly.name.toLowerCase() === text)
        || flyLibrary.find((fly) => fly.name.toLowerCase().includes(text) || text.includes(fly.name.toLowerCase()));
    }

    function flyRefFor(name) {
      const text = name.toLowerCase();
      if (artificialFlyRefsByName[name]) return artificialFlyRefsByName[name];
      const exact = findLibraryFlyByName(name);
      if (exact) return flyReferenceForLibraryItem(exact);
      if (text.includes("clouser") || text.includes("zonker") || text.includes("minnow")) return text.includes("sparkle") || text.includes("kreelex") ? flyRefs.sparkleMinnowFly : flyRefs.clouserMinnowFly;
      if (text.includes("muddler") || text.includes("sculpin") || text.includes("sculpzilla")) return flyRefs.muddlerMinnowFly;
      if (text.includes("baby rainbow") || text.includes("juvenile trout")) return flyRefs.babyRainbowFly;
      if (text.includes("hopper")) return text.includes("parachute") ? flyRefs.parachuteHopperFly : flyRefs.morrishHopperFly;
      if (text.includes("ant")) return flyRefs.foamAntFly;
      if (text.includes("beetle") || text.includes("terrestrial")) return flyRefs.foamBeetleFly;
      if (text.includes("cricket")) return flyRefs.foamAntFly;
      if (text.includes("chubby")) return text.includes("stone") ? flyRefs.chubbyStoneFly : flyRefs.chubbyChernobylFly;
      if (text.includes("stimulator") || text.includes("sally")) return flyRefs.yellowStimulatorFly;
      if (text.includes("stone") || text.includes("rubber") || text.includes("pat")) return flyRefs.patsRubberLegsFly;
      if (text.includes("x-caddis") || text.includes("tan caddis")) return flyRefs.xCaddisFly;
      if (text.includes("elk") || text.includes("cdc")) return flyRefs.elkHairCaddisFly;
      if (text.includes("caddis") || text.includes("sedge")) return text.includes("pupa") ? flyRefs.orangeSedgeFly : flyRefs.xCaddisFly;
      if (text.includes("drake")) return text.includes("cripple") ? flyRefs.greenDrakeCrippleFly : flyRefs.greenDrakeDunFly;
      if (text.includes("bwo") && text.includes("comparadun")) return flyRefs.bwoComparadunFly;
      if (text.includes("pmd") || text.includes("sparkle") || text.includes("comparadun") || text.includes("dun") || text.includes("parachute") || text.includes("adams")) return text.includes("parachute") || text.includes("adams") ? flyRefs.parachuteAdamsFly : flyRefs.pmdSparkleDunFly;
      if (text.includes("rs2") || text.includes("bwo")) return flyRefs.rs2Fly;
      if (text.includes("emerger") || text.includes("soft hackle") || text.includes("split case")) return flyRefs.pmdEmergerFly;
      if (text.includes("ice cream")) return flyRefs.iceCreamConeFly;
      if (text.includes("zebra")) return flyRefs.zebraMidgeFly;
      if (text.includes("midge") || text.includes("chironomid") || text.includes("black midge")) return text.includes("chromie") ? flyRefs.chromieFly : flyRefs.blackChironomidFly;
      if (text.includes("damsel")) return text.includes("marabou") ? flyRefs.marabouDamselFly : flyRefs.damselNymphFly;
      if (text.includes("leech") || text.includes("balanced")) return text.includes("balanced") ? flyRefs.balancedLeechFly : flyRefs.oliveLeechFly;
      if (text.includes("bugger") || text.includes("willy") || text.includes("streamer")) return flyRefs.woollyBuggerFly;
      if (text.includes("pheasant")) return flyRefs.pheasant;
      if (text.includes("hare")) return flyRefs.hares;
      return flyRefs.parachuteAdamsFly;
    }

    function flyCard(fly, subtext, reason = "", water = null) {
      const ref = flyRefFor(fly);
      const feedback = flyFeedbackLabel(fly);
      const confidence = water ? flyConfidenceFor(water, fly) : "";
      return `
        <div class="fly" data-fly-name="${attr(fly)}">

            <strong>${esc(fly)}</strong>
            ${confidence ? `<span class="fly-confidence ${confidenceClass(confidence)}">${confidence}</span>` : ""}

    /* The Waters screen used to be one template rebuilt in full on every
       keystroke: 62 cards, ~44ms on a desktop and several times that on a
       phone, and the focused search field was destroyed and recreated each
       time. On iOS that is the pattern that dismisses the keyboard, because
       focus() on a fresh node outside a user gesture will not bring it back.

       The query-dependent parts are now their own two regions. Typing repaints
       those and never touches the toolbar or the input. */
    function watersSearchState() {
      const query = waterQuery.trim().toLowerCase();
      const filtered = waters.filter((water) => {
        if (!showHiddenWaters && hiddenWaterIds.includes(water.id)) return false;
        const matchesType = waterFilter === "All" || water.type === waterFilter;
        const searchable = `${water.name} ${water.section} ${water.hatch.join(" ")} ${predictedHatches(water).join(" ")}`.toLowerCase();
        return matchesType && (!query || searchable.includes(query));
      });
      const ranked = rankedWatersForCurrentMode(filtered);
      // No match means no top water. Falling back to the selected water put a
      // water the filter had just excluded in the hero, headlined "TOP WATER
      // TODAY", directly above a count that read "0 waters".
      const topWater = ranked[0] || null;
      // Deriving the list must not change what the angler picked. This used to
      // reassign activeWater to the top result whenever the selected water fell
      // out of the filter, so typing "todd" in the search box silently moved a
      // trip planned for the Lower Deschutes onto Todd Lake - and clearing the
      // search did not move it back. Selection changes only in setActiveWater,
      // when a card is tapped.
      return { filtered, ranked, topWater };
    }

    function watersHeadlineMarkup(state) {

    function watersResultsMarkup(state) {

    function renderWaterResults() {

    function renderWaters() {

                <button class="ghost-btn ${showHiddenWaters ? "active" : ""}" data-show-hidden>${showHiddenWaters ? "Showing Hidden" : `Hidden ${hiddenWaterIds.length}`}</button>
                ${skillModeSelector(true)}
                <div class="segmented">
                  ${["Best", "Near"].map((label) => `<button class="${waterSortMode === label ? "active" : ""}" data-water-sort="${label}">${label === "Near" ? "Near Me" : "Best"}</button>`).join("")}

                  ${["All", "River", "Lake"].map((label) => `<button class="${waterFilter === label ? "active" : ""}" data-water-filter="${label}">${label}</button>`).join("")}
                </div>

    function tripWater() {
      return hiddenWaterIds.includes(activeWater) ? topRecommendedWater() : getWater();

        ? ["Set depth before changing flies", "Watch wind lanes and weed edges", "Move if you do not see cruisers in 20 minutes"]
        : ["Start with clean drifts in softer seams", "Change size before changing bug family", "Re-check shade and clouds during the prime window"];

          </div>

          </div>

      syncOnWaterLifecycle();
