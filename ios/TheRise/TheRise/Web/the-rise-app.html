<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app paint under the notch and the home
       indicator. Without it the container had to inset the web view itself,
       which put a band of the window's background above the teal header on
       every notched iPhone. Every screen's top block and the tab bar pad
       themselves with env(safe-area-inset-*) instead. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Rise - Central Oregon Fly Fishing</title>
  <style>
    :root {
      --ink: #162019;
      --muted: #637064;
      --line: #d9ded4;
      --paper: #f7f4ec;
      --panel: #fffdf7;
      --river: #4b8794;
      --pine: #2f5b45;
      --copper: #b96b35;
      --gold: #d6a94a;
      --sky: #dcebf0;
      --danger: #b44b3d;
      --shadow: 0 18px 44px rgba(30, 43, 34, .14);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        linear-gradient(180deg, rgba(220, 235, 240, .92), rgba(247, 244, 236, .95) 38%),
        radial-gradient(circle at 18% 12%, rgba(214, 169, 74, .22), transparent 34%),
        var(--paper);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 228px minmax(0, 1fr);
      background: rgba(255, 253, 247, .68);
      box-shadow: 0 0 0 1px rgba(47, 91, 69, .08);
    }

    .rail {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px 16px;
      border-right: 1px solid var(--line);
      background: rgba(255, 253, 247, .88);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 4px 14px;
      border-bottom: 1px solid var(--line);
    }

    .mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: var(--pine);
      display: grid;
      place-items: center;
      color: white;
      box-shadow: inset 0 -8px 0 rgba(0, 0, 0, .14);
    }

    .mark svg {
      width: 26px;
      height: 26px;
    }

    .brand strong {
      display: block;
      font-size: 17px;
      line-height: 1;
    }

    .brand span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .tab-list {
      display: grid;
      gap: 6px;
    }

    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 11px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      transition: .18s ease;
    }

    .tab svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
    }

    .tab[aria-selected="true"] {
      background: #e8efe8;
      color: var(--pine);
      font-weight: 750;
    }

    .rail-card {
      margin-top: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #f3f6ef;
    }

    .rail-card strong {
      display: block;
      font-size: 13px;
    }

    .rail-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
      line-height: 1.35;
    }

    main {
      padding: 28px;
      min-width: 0;
      max-width: 100%;
    }

    .view {
      display: none;
      min-width: 0;
      max-width: 100%;
    }

    .view.active {
      display: block;
      animation: riseIn .22s ease both;
    }

    @keyframes riseIn {
      from {
        transform: translateY(8px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      font-size: clamp(28px, 5vw, 46px);
      line-height: 1;
      letter-spacing: 0;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 12px;
    }

    h3 {
      font-size: 17px;
      margin-bottom: 8px;
    }

    .subtle {
      color: var(--muted);
      line-height: 1.45;
    }

    .sync-pill {
      white-space: nowrap;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 253, 247, .8);
      padding: 8px 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .data-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid rgba(47, 91, 69, .18);
      border-radius: 8px;
      background: rgba(255, 253, 247, .94);
      color: var(--ink);
      padding: 12px;
      margin: 0 0 14px;
      box-shadow: 0 8px 18px rgba(30, 43, 34, .05);
    }

    .today-hero .data-status {
      width: min(680px, 100%);
      background: rgba(255, 255, 255, .18);
      border-color: rgba(255, 255, 255, .22);
      color: #fff;
      backdrop-filter: blur(8px);
      margin-bottom: 16px;
    }

    .data-status strong,
    .data-status span {
      display: block;
    }

    .data-status strong {
      font-size: 14px;
      margin-bottom: 3px;
    }

    .data-status span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .today-hero .data-status span {
      color: rgba(255, 255, 255, .76);
    }

    .data-status.ready {
      border-color: rgba(47, 91, 69, .3);
    }

    .data-status.updating {
      border-color: rgba(240, 179, 61, .5);
    }

    .data-status.warning {
      border-color: rgba(196, 87, 59, .45);
    }

    .today-screen {
      background: #f8f5ed;
      border-radius: 8px;
      overflow: hidden;
      max-width: 100%;
      box-shadow: var(--shadow);
      border: 1px solid rgba(22, 32, 25, .08);
    }

    .today-hero {
      position: relative;
      min-height: 430px;
      padding: 36px 40px 88px;
      color: #fff;
      background: #155a6b;
      overflow: hidden;
    }

    .today-hero:before {
      content: "";
      position: absolute;
      inset: 0;
      /* the-rise-river.png has never existed in this repository and is
         excluded by .gitignore, so every launch fired a 404 for it and the
         hero rendered as the gradient alone. The gradient is the design. */
      background: linear-gradient(180deg, rgba(16, 84, 102, .9), rgba(16, 84, 102, .82));
      opacity: .96;
    }

    .today-hero > * {
      position: relative;
      z-index: 1;
    }

    .home-water-control {
      width: min(460px, 100%);
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .home-water-control label {
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: rgba(255, 255, 255, .78);
    }

    .home-water-control select {
      width: 100%;
      min-height: 48px;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 8px;
      color: #fff;
      background:
        linear-gradient(45deg, transparent 50%, rgba(255, 255, 255, .92) 50%) right 18px center / 7px 7px no-repeat,
        linear-gradient(135deg, rgba(255, 255, 255, .92) 50%, transparent 50%) right 13px center / 7px 7px no-repeat,
        rgba(255, 255, 255, .16);
      appearance: none;
      padding: 10px 42px 10px 14px;
      font-weight: 850;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12);
      backdrop-filter: blur(8px);
    }

    .home-water-control select:focus {
      outline: 3px solid rgba(240, 179, 61, .36);
      outline-offset: 2px;
    }

    .home-water-control option {
      color: var(--ink);
      background: #fffdf7;
    }

    .prime-title {
      font-size: clamp(36px, 6vw, 62px);
      line-height: .95;
      color: #fff;
      margin-bottom: 12px;
      letter-spacing: 0;
      overflow-wrap: break-word;
    }

    .condition-line {
      color: rgba(255, 255, 255, .9);
      font-size: clamp(18px, 2.7vw, 26px);
      font-weight: 650;
      margin-bottom: 30px;
    }

    .fishability-card {
      display: flex;
      align-items: center;
      gap: 26px;
      width: min(680px, 100%);
      background: rgba(255, 255, 255, .18);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 28px;
      padding: 24px 30px;
      backdrop-filter: blur(8px);
    }

    .score-ring {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      background: conic-gradient(#f0b33d var(--score-deg), rgba(255, 255, 255, .28) 0);
      position: relative;
    }

    .score-ring:before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background: #126176;
    }

    .score-ring strong {
      position: relative;
      color: white;
      font-size: 30px;
      line-height: 1;
    }

    .score-button {
      border: 0;
      padding: 0;
      color: inherit;
      background: transparent;
      display: grid;
      justify-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    /* The rating breakdown is one of the four things the subscription unlocks,
       and the only way to open it was to guess that the score circle was a
       button - there was no visible label anywhere. The review notes sent the
       reviewer to "Today > Why this rating" and no such words were on screen. */
    .score-button em {
      display: block;
      font-size: 10px;
      font-style: normal;
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
      opacity: .85;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .score-button:focus-visible {
      outline: 3px solid rgba(240, 179, 61, .42);
      outline-offset: 4px;
    }

    .fishability-copy strong {
      display: block;
      color: #fff;
      font-size: clamp(24px, 3.2vw, 34px);
      margin-bottom: 8px;
    }

    .fishability-copy {
      min-width: 0;
    }

    .fishability-copy span {
      display: block;
      color: rgba(255, 255, 255, .9);
      font-size: clamp(16px, 2.3vw, 24px);
      line-height: 1.25;
      overflow-wrap: break-word;
    }

    .fishability-copy small {
      display: block;
      margin-top: 8px;
      color: rgba(255, 255, 255, .72);
      font-size: 12px;
      font-weight: 750;
      line-height: 1.25;
    }

    .score-breakdown-panel {
      width: min(680px, 100%);
      margin-top: 12px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 18px;
      background: rgba(255, 255, 255, .16);
      backdrop-filter: blur(10px);
      padding: 14px;
      display: grid;
      gap: 8px;
    }

    .score-breakdown-head,
    .score-breakdown-row {
      display: grid;
      grid-template-columns: minmax(0, .8fr) minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    .score-breakdown-head {
      color: #fff;
      font-weight: 900;
      padding-bottom: 4px;
    }

    .score-breakdown-head span {
      justify-self: end;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px;
      padding: 5px 9px;
      color: rgba(255, 255, 255, .86);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .score-breakdown-row {
      border-top: 1px solid rgba(255, 255, 255, .14);
      padding-top: 8px;
      color: rgba(255, 255, 255, .86);
    }

    .score-breakdown-row span,
    .score-breakdown-row small {
      font-size: 12px;
      line-height: 1.25;
    }

    .score-breakdown-row b {
      color: #fff;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .score-breakdown-row small {
      grid-column: 2;
      color: rgba(255, 255, 255, .68);
    }

    .today-body {
      position: relative;
      margin-top: -54px;
      padding: 0 38px 36px;
      z-index: 2;
    }

    .today-body:before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -28px;
      height: 70px;
      background: #f8f5ed;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      z-index: -1;
    }

    .command-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 26px;
    }

    .command-card {
      border: 1px solid #e0dbcf;
      border-radius: 8px;
      background: rgba(255, 255, 255, .96);
      color: var(--ink);
      padding: 14px;
      text-align: left;
      min-width: 0;
      box-shadow: 0 8px 18px rgba(30, 43, 34, .05);
    }

    button.command-card {
      cursor: pointer;
    }

    .command-card.primary {
      border-color: rgba(47, 91, 69, .34);
      background: #f4faf6;
    }

    .command-card span,
    .command-card small {
      display: block;
      color: var(--muted);
      line-height: 1.35;
    }

    .command-card span {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }

    .command-card strong {
      display: block;
      font-size: 19px;
      line-height: 1.05;
      margin-bottom: 8px;
      overflow-wrap: anywhere;
    }

    .command-card small {
      font-size: 12px;
    }

    .mini-action {
      margin-top: 10px;
      border: 1px solid rgba(47, 91, 69, .24);
      border-radius: 999px;
      background: #edf5f1;
      color: var(--pine);
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 850;
    }

    .fly-confidence {
      display: inline-flex;
      width: fit-content;
      margin: 4px 0 5px;
      border-radius: 999px;
      padding: 4px 7px;
      background: #e8f2ed;
      color: var(--pine);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .fly-confidence.local-report-signal,
    .fly-confidence.high-confidence,
    .fly-confidence.your-history {
      background: #e2f1ef;
      color: #155f6f;
    }

    .fly-confidence.weather-play,
    .fly-confidence.weather-driven-guess {
      background: #fff0d1;
      color: #835719;
    }

    .beginner-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .beginner-toggle.active,
    .ghost-btn.active {
      background: var(--pine);
      color: white;
      border-color: var(--pine);
    }

    .skill-mode-selector {
      display: grid;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, .26);
      border-radius: 8px;
      background: rgba(255, 255, 255, .12);
      padding: 10px;
      margin-top: 14px;
      color: white;
    }

    .skill-mode-selector.compact {
      display: inline-flex;
      align-items: center;
      /* Display Zoom on an iPhone SE or mini renders at 320pt. Without these
         the label and the three buttons were one unbreakable 305px run, which
         blew the Waters header out past the right edge of the screen. */
      flex-wrap: wrap;
      max-width: 100%;
      gap: 8px;
      margin: 0;
      padding: 6px;
      background: #f5f1e8;
      border-color: #e0dbcf;
      color: var(--ink);
    }

    .skill-mode-selector span {
      font-size: 10px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .06em;
      opacity: .86;
    }

    .skill-mode-selector div {
      display: inline-grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
    }

    .skill-mode-selector.compact div {
      display: inline-flex;
      flex-wrap: wrap;
    }

    .skill-mode-selector button {
      border: 1px solid rgba(255, 255, 255, .34);
      border-radius: 999px;
      background: rgba(255, 255, 255, .14);
      color: inherit;
      padding: 7px 9px;
      font-size: 11px;
      font-weight: 900;
    }

    .skill-mode-selector.compact button {
      border-color: rgba(47, 91, 69, .18);
      background: white;
      color: var(--pine);
    }

    .skill-mode-selector button.active {
      background: #f1b43c;
      border-color: #f1b43c;
      color: #123743;
    }

    .skill-mode-selector small {
      font-size: 12px;
      line-height: 1.35;
      opacity: .9;
    }

    .insight-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .insight-grid.compact {
      margin-bottom: 0;
    }

    .why-card,
    .memory-card,
    .fish-plan,
    .hatch-assistant {
      border: 1px solid #e0dbcf;
      border-radius: 8px;
      background: rgba(255, 255, 255, .96);
      padding: 14px;
      box-shadow: 0 8px 18px rgba(30, 43, 34, .05);
      min-width: 0;
    }

    .why-card.compact,
    .memory-card.compact {
      padding: 10px;
      box-shadow: none;
    }

    .insight-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .insight-head span,
    .plan-card span,
    .trait-grid label span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 4px;
    }

    .insight-head strong {
      display: block;
      color: #16485a;
      font-size: 17px;
      line-height: 1.1;
    }

    .insight-head b {
      border-radius: 999px;
      background: #edf5f1;
      color: var(--pine);
      padding: 8px 10px;
      font-size: 18px;
      min-width: 46px;
      text-align: center;
    }

    .reason-stack {
      display: grid;
      gap: 7px;
    }

    .reason-stack p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.38;
    }

    .fish-plan {
      margin-bottom: 18px;
    }

    .fish-plan.compact {
      margin-bottom: 0;
      padding: 10px;
      box-shadow: none;
    }

    .plan-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .fish-plan.compact .plan-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .plan-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfaf5;
      padding: 10px;
      min-width: 0;
    }

    .plan-card strong,
    .plan-card small {
      display: block;
      overflow-wrap: anywhere;
    }

    .plan-card strong {
      color: var(--ink);
      font-size: 14px;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    .plan-card small {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
    }

    .hatch-assistant {
      margin: 0 18px 14px;
    }

    .trait-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin: 10px 0;
    }

    .trait-grid label {
      min-width: 0;
    }

    .trait-grid select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfaf5;
      color: var(--ink);
      font-weight: 800;
      padding: 0 9px;
    }

    .hatch-results {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .hatch-result {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfaf5;
      padding: 8px;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 8px;
      text-align: left;
      align-items: center;
      min-width: 0;
    }

    .hatch-result.active {
      border-color: rgba(22, 72, 90, .42);
      background: #edf5f1;
    }

    .hatch-result strong,
    .hatch-result span,
    .hatch-result small {
      display: block;
      overflow-wrap: anywhere;
    }

    .hatch-result strong {
      font-size: 13px;
      color: var(--ink);
      margin-bottom: 2px;
    }

    .hatch-result span,
    .hatch-result small {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    /* Snap a bug. */
    .snap-bug {
      margin: 0 18px 14px;
      border: 1px solid #e0dbcf;
      border-radius: 8px;
      background: rgba(255, 255, 255, .96);
      padding: 14px;
      box-shadow: 0 8px 18px rgba(30, 43, 34, .05);
      min-width: 0;
    }

    .snap-pick-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }

    /* The file input is the tap target itself, stretched invisibly over its
       label, so no script has to forward a click to it. An absolute box is
       placed against the padding box, so it reaches out over the label's
       1px border to cover the whole 44pt button and not 2pt less. */
    .snap-pick {
      position: relative;
      overflow: hidden;
    }

    .snap-pick input {
      position: absolute;
      inset: -1px;
      width: auto;
      height: auto;
      min-height: 0;
      padding: 0;
      border: 0;
      opacity: 0;
      cursor: pointer;
    }

    .snap-error {
      color: var(--danger);
    }

    .snap-workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
      gap: 14px;
      margin-top: 6px;
    }

    .snap-photo-column,
    .snap-questions,
    .snap-step {
      display: grid;
      gap: 8px;
      align-content: start;
      min-width: 0;
    }

    .snap-questions {
      gap: 14px;
    }

    .snap-step-label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .snap-step p {
      margin: 0;
    }

    /* Sized to the photo itself, never letterboxed, so a tap's fraction of
       this box is the same fraction of the photo. */
    .snap-photo-frame {
      position: relative;
      width: fit-content;
      max-width: 100%;
      line-height: 0;
    }

    .snap-photo {
      display: block;
      max-width: 100%;
      max-height: 360px;
      width: auto;
      height: auto;
      border-radius: 8px;
      cursor: crosshair;
      touch-action: manipulation;
    }

    .snap-marker {
      position: absolute;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(22, 32, 25, .7);
      pointer-events: none;
    }

    .snap-colour-row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }

    .snap-colour-row p {
      margin: 0;
    }

    .snap-swatch {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--line);
    }

    .snap-swatch.empty {
      background: repeating-linear-gradient(45deg, #f2efe6, #f2efe6 4px, #fff 4px, #fff 8px);
    }

    .snap-choice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
      gap: 8px;
    }

    .snap-choice {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfaf5;
      color: var(--ink);
      padding: 8px 6px;
      text-align: center;
      min-width: 0;
    }

    .snap-choice.active {
      border-color: var(--pine);
      background: #edf5f1;
      box-shadow: inset 0 0 0 1px var(--pine);
    }

    .snap-choice b {
      font-size: 12px;
      line-height: 1.2;
    }

    .snap-choice small {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
    }

    .snap-icon {
      width: 48px;
      height: 32px;
    }

    /* Drawn at the size its width and height attributes give: scaling it to
       fit would defeat the point of an actual-size silhouette. */
    .snap-size-art {
      flex: none;
      max-width: none;
      color: var(--ink);
    }

    .snap-empty {
      grid-column: 1 / -1;
    }

    .snap-results {
      grid-column: 1 / -1;
      display: grid;
      gap: 8px;
    }

    .snap-results h4 {
      margin: 0;
      font-size: 15px;
    }

    .snap-results > p {
      margin: 0;
    }

    .snap-results-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .snap-result {
      display: grid;
      gap: 6px;
      align-content: start;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfaf5;
      padding: 10px;
      min-width: 0;
    }

    .snap-result strong {
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .snap-result p {
      margin: 0;
      font-size: 11px;
    }

    .snap-confidence {

      font-weight: 850;
    }

    .snap-compare {

      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .snap-compare figure {

      min-width: 0;

      border-radius: 8px;

      background-repeat: no-repeat;

    .snap-compare figcaption {

    .snap-trait-list {

      line-height: 1.3;

    .snap-result-actions {

    .log-attached-photo {
