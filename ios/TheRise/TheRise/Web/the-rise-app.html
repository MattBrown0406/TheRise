              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function logsForWater(water) {
      return getLogs().filter((entry) => entry.waterId === water.id || entry.waterName === water.name);
    }

    function personalMemoryFor(water) {
      const logs = logsForWater(water);
      const recommended = liveRecommendedFlies(water);
      const worked = Object.keys(flyFeedback).filter((fly) => flyFeedback[fly] === "worked");
      const ignored = Object.keys(flyFeedback).filter((fly) => flyFeedback[fly] === "ignored");
      const loggedFlyCounts = logs.reduce((counts, entry) => {
        if (entry.fly) counts[entry.fly] = (counts[entry.fly] || 0) + (Number(entry.count) || 1);
        return counts;
      }, {});
      const topLoggedFly = Object.entries(loggedFlyCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || "";
      const workedHere = worked.find((fly) => recommended.includes(fly) || logs.some((entry) => entry.fly === fly));
      const ignoredHere = ignored.find((fly) => recommended.includes(fly));
      const lastCatch = logs[0];
      const lines = [];
      if (logs.length) lines.push(`${logs.length} local ${logs.length === 1 ? "entry" : "entries"} saved for ${water.name}.`);
      if (topLoggedFly) lines.push(`Your best logged fly here: ${topLoggedFly}.`);
      if (workedHere) lines.push(`Prioritize ${workedHere}; you marked it as worked.`);
      if (ignoredHere) lines.push(`Deprioritize ${ignoredHere}; you ignored it last time.`);
      if (lastCatch) lines.push(`Last catch: ${lastCatch.fish || "fish"}${lastCatch.length ? `, ${lastCatch.length}"` : ""} on ${lastCatch.fly || "unknown fly"}.`);
      if (!lines.length) lines.push("No local memory yet. Log catches or mark flies as worked/ignored to train this device.");
      return { logs, lines, topLoggedFly, workedHere, ignoredHere };
    }

    function personalMemoryCard(water, compact = false) {
      const memory = personalMemoryFor(water);
      return `
        <div class="memory-card ${compact ? "compact" : ""}">
          <div class="insight-head">
            <div>
              <span>Your local memory</span>
              <strong>${memory.logs.length ? `${memory.logs.length} entries here` : "Learning this water"}</strong>
            </div>
            <button class="mini-action" data-quick-log="${water.id}">Quick log</button>
          </div>
          <div class="reason-stack">
            ${memory.lines.slice(0, compact ? 2 : 4).map((line) => `<p>${esc(line)}</p>`).join("")}
          </div>
        </div>
      `;
    }

    function hatchTraitSummary(bug) {
      const text = `${bug.name} ${bug.sizes} ${bug.water} ${bug.body} ${bug.stages.join(" ")}`.toLowerCase();
      return text;
    }

    function hatchCandidateScore(bug) {
      const text = hatchTraitSummary(bug);
      let score = 0;
      const size = hatchIdTraits.size || "";
      const color = hatchIdTraits.color || "";
      const water = hatchIdTraits.water || "";
      const behavior = hatchIdTraits.behavior || "";
      if (!size && !color && !water && !behavior) {
        return bug.id === activeBug ? 5 : predictedHatches(getWater()).some((hatch) => hatchProfileFor(hatch).bugId === bug.id) ? 4 : 1;
      }
      if (size === "tiny" && /#1[8-9]|#2[0-4]|18-24|18-22/.test(text)) score += 3;
      if (size === "small" && /#1[4-8]|14-18|12-18/.test(text)) score += 3;
      if (size === "large" && /#4|#6|#8|#10|4-10|6-12|8-12/.test(text)) score += 3;
      if (color && text.includes(color)) score += 3;
      if (color === "yellow" && /pale|cream|golden|sally/.test(text)) score += 3;
      if (color === "tan" && /tan|orange|caddis|hopper|sedge/.test(text)) score += 3;
      if (color === "black" && /black|dark|red|blood|midge|chironomid/.test(text)) score += 3;
      if (water === "river" && /river|deschutes|crooked|metolius|fall|whychus|current|riffle/.test(text)) score += 3;
      if (water === "lake" && /lake|stillwater|hosmer|east|crane|davis|paulina|weed|suspended/.test(text)) score += 3;
      if (water === "bank" && /bank|grass|terrestrial|hopper|ant|beetle|stone/.test(text)) score += 3;
      if (behavior === "deep" && /nymph|larva|pupa|bottom|deep/.test(text)) score += 2;
      if (behavior === "rising" && /emerger|pupa|film|rising/.test(text)) score += 2;
      if (behavior === "surface" && /adult|dun|spinner|dry|surface/.test(text)) score += 2;
      if (behavior === "moving" && /leech|streamer|baitfish|swimming|damsel|chasing/.test(text)) score += 2;
      return score;
    }

    function hatchIdResults() {
      return bugs
        .map((bug) => ({ bug, score: hatchCandidateScore(bug) }))
        .sort((a, b) => b.score - a.score || a.bug.name.localeCompare(b.bug.name))
        .slice(0, 3);
    }

    function hatchIdAssistantPanel() {
      if (!proAccessActive) {
        return `<div class="hatch-assistant">${proLock("Hatch ID assistant - Pro", "Narrow what you are looking at by size, colour, water type and behaviour, then jump straight to the matching fly patterns.")}</div>`;
      }
      const hasFilters = Object.values(hatchIdTraits).some(Boolean);
      const results = hatchIdResults();
      return `
        <div class="hatch-assistant">
          <div class="panel-head">
            <div>
              <h3>Hatch ID Assistant</h3>
              <p class="subtle">${skillMode === "Beginner" ? "Choose what you can see. The app suggests likely bugs and matching flies." : "Filter by size, color, water type, and behavior to narrow the likely hatch."}</p>
            </div>
            ${hasFilters ? `<button class="ghost-btn" data-hatch-clear>Clear</button>` : ""}
          </div>
          <div class="trait-grid">
            ${Object.entries(hatchTraitOptions).map(([key, options]) => `
              <label>
                <span>${key}</span>
                <select data-hatch-trait="${key}">
                  ${options.map(([value, label]) => `<option value="${value}" ${hatchIdTraits[key] === value ? "selected" : ""}>${label}</option>`).join("")}
                </select>
              </label>
            `).join("")}
          </div>
          <div class="hatch-results">
            ${results.map(({ bug, score }) => {
              const profile = hatchProfileFor(bug.name);
              const flies = flyLibraryForBug(bug.id).slice(0, 3);
              return `
                <button class="hatch-result ${bug.id === activeBug ? "active" : ""}" data-hatch-pick="${bug.id}">
                  <div class="hatch-thumb" style="${hatchThumbStyle(profile, 2)}" role="img" aria-label="${bug.name} reference"></div>
                  <div>
                    <strong>${bug.name}</strong>
                    <span>${score ? `${score} match points` : "Baseline match"} - ${bug.cue}</span>
                    <small>${flies.map((fly) => fly.name).join(", ")}</small>
                  </div>
                </button>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function liveRecommendationReason(water) {
      const report = liveReports.byWater[water.id];
      const intel = localIntelForWater(water);
      if (!report) return "Pull live inputs to compare gauge, forecast, and report context against the seasonal hatch profile.";
      if (report.status === "loading") return "Checking USGS gauge and NWS forecast now.";
      if (report.status === "error") return `Live pull failed: ${report.error}`;
      if (report.refreshing) return "Updating from signal now while keeping the saved local report available.";
      const parts = [];
      if (report.usgs?.flow) parts.push(`${report.usgs.flow} from USGS`);
      if (report.usgs?.waterTemp) parts.push(`${report.usgs.waterTemp} water`);
      if (report.nws?.forecast) parts.push(`${report.nws.forecast.toLowerCase()} forecast`);
      if (report.nws?.wind) parts.push(`${report.nws.wind} wind`);
      if (intel.sources?.length) parts.push(`${intel.sources.slice(0, 2).join(" + ")} local report signal`);
      const prefix = report.fromCache ? "Using saved local data" : "Adjusted";
      const suffix = report.refreshError ? ` Last update failed: ${report.refreshError}.` : "";
      return parts.length ? `${prefix} from ${parts.join(", ")}.${suffix}` : `Forecast/report links loaded, but no gauge values were available for this water.${suffix}`;
    }

    function dataModelNotice(water) {
      const report = liveReports.byWater[water.id];
      const intel = localIntelForWater(water);
      if (report?.refreshing) return "Updating now. The app will keep using the saved local report if signal drops.";
      if (report?.status === "ready") {
        return intel.sources?.length
          ? `Stored locally on this device. Model blends USGS/NWS data with daily local report signals from ${intel.sources.slice(0, 3).join(", ")}.`
          : "Stored locally on this device. Fishability, hatch window, and fly suggestions are adjusted from USGS gauge values and the NWS forecast; local report pages are scrubbed daily when readable.";
      }
      if (report?.status === "loading") return "Pulling live USGS and NWS inputs for this water.";
      return "Seasonal baseline: refresh live inputs to update this water with USGS and NWS data.";
    }

    function liveReportPanel(water) {
      const report = liveReports.byWater[water.id];
      const intel = localIntelForWater(water);
      const status = report?.refreshing ? "refreshing" : report?.status || "idle";
      const meta = report?.meta || liveMetaFor(water);
      const usgsLabel = meta.usgs ? `USGS ${meta.usgs}` : "No gauge mapped";
      const intelUpdated = liveReports.cache?.localIntel?.updatedAt ? formatSavedTime(liveReports.cache.localIntel.updatedAt) : "Not scrubbed yet";
      const updated = report?.cachedAt ? `Saved locally ${formatSavedTime(report.cachedAt)}` : report?.updatedAt ? `Updated ${report.updatedAt}` : "Not pulled yet";
      const rows = report?.status === "ready" ? `
        <div class="line-row"><span>Gauge</span><b>${usgsLabel}${report.usgs?.flow ? ` - ${report.usgs.flow}` : ""}${report.usgs?.waterTemp ? ` - ${report.usgs.waterTemp}` : ""}</b></div>
        <div class="line-row"><span>Forecast</span><b>${report.nws?.air || "Air n/a"} - ${report.nws?.wind || "Wind n/a"}${report.nws?.forecast ? ` - ${report.nws.forecast}` : ""}</b></div>
        <div class="line-row"><span>Local intel</span><b>${intel.sources?.length ? `${intel.sources.join(" + ")} - ${uniqueItems([...intel.hatches, ...intel.flies]).slice(0, 4).join(", ")}` : `Daily scrub saved ${intelUpdated}`}</b></div>
        ${(report.errors || []).length ? `<div class="line-row"><span>Gaps</span><b>${report.errors.join(" / ")}</b></div>` : ""}
        ${report.refreshError ? `<div class="line-row"><span>Last update</span><b>${report.refreshError}</b></div>` : ""}
      ` : `
        <div class="line-row"><span>Gauge</span><b>${usgsLabel}</b></div>
        <div class="line-row"><span>Forecast point</span><b>${meta.lat.toFixed(2)}, ${meta.lon.toFixed(2)}</b></div>
      `;
      return `
        <div class="live-panel">
          <div class="panel-head">
            <div>
              <h3>Saved Report Inputs</h3>
              <p class="subtle">${updated} - ${status === "loading" ? "Loading live sources..." : liveRecommendationReason(water)}</p>
            </div>
            <button class="ghost-btn" data-refresh-live="${water.id}">${status === "loading" || status === "refreshing" ? "Updating..." : "Update"}</button>
          </div>
          ${rows}
          <p class="model-note">${dataModelNotice(water)}</p>
          <div class="source-links">
            ${reportLinks.map(([label, url]) => `<a href="${url}" target="_blank" rel="noopener">${label}</a>`).join("")}
          </div>
        </div>
      `;
    }

    function hatchProfileFor(name) {
      const key = name.toLowerCase();
      if (key.includes("bwo") || key.includes("blue")) return hatchProfiles.bwo;
      if (key.includes("pmd") || key.includes("pale")) return hatchProfiles.pmd;
      if (key.includes("drake")) return hatchProfiles.greenDrake;
      if (key.includes("callibaetis")) return hatchProfiles.callibaetis;
      if (key.includes("chironomid")) return hatchProfiles.chironomid;
      if (key.includes("midge")) return hatchProfiles.midge;
      if (key.includes("october")) return hatchProfiles.octoberCaddis;
      if (key.includes("sally")) return hatchProfiles.yellowSally;
      if (key.includes("caddis") || key.includes("sedge")) return hatchProfiles.caddis;
      if (key.includes("damsel")) return hatchProfiles.damsel;
      if (key.includes("terrestrial") || key.includes("hopper") || key.includes("ant") || key.includes("beetle") || key.includes("cricket")) return hatchProfiles.terrestrial;
      if (key.includes("baitfish") || key.includes("minnow") || key.includes("sculpin") || key.includes("streamer") || key.includes("clouser") || key.includes("muddler") || key.includes("zonker") || key.includes("kreelex")) return hatchProfiles.baitfish;
      if (key.includes("leech") || key.includes("bugger")) return hatchProfiles.leech;
      if (key.includes("stone") || key.includes("salmonfly") || key.includes("golden")) return hatchProfiles.stonefly;
      return { ...hatchProfiles.caddis, label: name, size: "12-16", trigger: "active feeding" };
    }

    function hatchThumbStyle(profile, stage = 2) {
      const bug = bugs.find((item) => item.id === profile.bugId) || bugs[0];
      return bugImageStyle(bug, stage);
    }

    function stageFlyStyle(ref) {
      return `background-image:url('${ref.plate}');background-position:${ref.pos};background-size:${ref.size || "200% 200%"};`;
    }

    function flyLibraryForBug(bugId, stageName = null) {
      const normalizedStage = String(stageName || "").toLowerCase();
      return flyLibrary.filter((fly) => {
        if (fly.bugId !== bugId) return false;
        if (!normalizedStage) return true;
        const flyStage = fly.stage.toLowerCase();
        if (normalizedStage.includes(flyStage) || flyStage.includes(normalizedStage)) return true;
        if (normalizedStage.includes("larva") && flyStage.includes("pupa")) return true;
        if (normalizedStage.includes("pupa") && flyStage.includes("larva")) return true;
        if (normalizedStage.includes("mature") && flyStage.includes("nymph")) return true;
        if (normalizedStage.includes("swimming") && flyStage.includes("nymph")) return true;
        if (normalizedStage.includes("dry") && flyStage.includes("adult")) return true;
        return false;
      });
    }

    function flyReferenceForLibraryItem(item) {
      return artificialFlyRefsByName[item?.name] || item?.ref || flyRefFor(item?.name || "");
    }

    function selectedFlyFrom(items) {
      return items.find((item) => item.name === activeFlyName) || items[0] || flyLibrary[0];
    }

    function findLibraryFlyByName(name) {
      const text = String(name || "").toLowerCase();
      return flyLibrary.find((fly) => fly.name.toLowerCase() === text)
        || flyLibrary.find((fly) => fly.name.toLowerCase().includes(text) || text.includes(fly.name.toLowerCase()));
    }

    function flyRefFor(name) {
      const text = name.toLowerCase();
      if (artificialFlyRefsByName[name]) return artificialFlyRefsByName[name];
      const exact = findLibraryFlyByName(name);
      if (exact) return flyReferenceForLibraryItem(exact);
      if (text.includes("clouser") || text.includes("zonker") || text.includes("minnow")) return text.includes("sparkle") || text.includes("kreelex") ? flyRefs.sparkleMinnowFly : flyRefs.clouserMinnowFly;
      if (text.includes("muddler") || text.includes("sculpin") || text.includes("sculpzilla")) return flyRefs.muddlerMinnowFly;
      if (text.includes("baby rainbow") || text.includes("juvenile trout")) return flyRefs.babyRainbowFly;
      if (text.includes("hopper")) return text.includes("parachute") ? flyRefs.parachuteHopperFly : flyRefs.morrishHopperFly;
      if (text.includes("ant")) return flyRefs.foamAntFly;
      if (text.includes("beetle") || text.includes("terrestrial")) return flyRefs.foamBeetleFly;
      if (text.includes("cricket")) return flyRefs.foamAntFly;
      if (text.includes("chubby")) return text.includes("stone") ? flyRefs.chubbyStoneFly : flyRefs.chubbyChernobylFly;
      if (text.includes("stimulator") || text.includes("sally")) return flyRefs.yellowStimulatorFly;
      if (text.includes("stone") || text.includes("rubber") || text.includes("pat")) return flyRefs.patsRubberLegsFly;
      if (text.includes("x-caddis") || text.includes("tan caddis")) return flyRefs.xCaddisFly;
      if (text.includes("elk") || text.includes("cdc")) return flyRefs.elkHairCaddisFly;
      if (text.includes("caddis") || text.includes("sedge")) return text.includes("pupa") ? flyRefs.orangeSedgeFly : flyRefs.xCaddisFly;
      if (text.includes("drake")) return text.includes("cripple") ? flyRefs.greenDrakeCrippleFly : flyRefs.greenDrakeDunFly;
      if (text.includes("bwo") && text.includes("comparadun")) return flyRefs.bwoComparadunFly;
      if (text.includes("pmd") || text.includes("sparkle") || text.includes("comparadun") || text.includes("dun") || text.includes("parachute") || text.includes("adams")) return text.includes("parachute") || text.includes("adams") ? flyRefs.parachuteAdamsFly : flyRefs.pmdSparkleDunFly;
      if (text.includes("rs2") || text.includes("bwo")) return flyRefs.rs2Fly;
      if (text.includes("emerger") || text.includes("soft hackle") || text.includes("split case")) return flyRefs.pmdEmergerFly;
      if (text.includes("ice cream")) return flyRefs.iceCreamConeFly;
      if (text.includes("zebra")) return flyRefs.zebraMidgeFly;
      if (text.includes("midge") || text.includes("chironomid") || text.includes("black midge")) return text.includes("chromie") ? flyRefs.chromieFly : flyRefs.blackChironomidFly;
      if (text.includes("damsel")) return text.includes("marabou") ? flyRefs.marabouDamselFly : flyRefs.damselNymphFly;
      if (text.includes("leech") || text.includes("balanced")) return text.includes("balanced") ? flyRefs.balancedLeechFly : flyRefs.oliveLeechFly;
      if (text.includes("bugger") || text.includes("willy") || text.includes("streamer")) return flyRefs.woollyBuggerFly;
      if (text.includes("pheasant")) return flyRefs.pheasant;
      if (text.includes("hare")) return flyRefs.hares;
      return flyRefs.parachuteAdamsFly;
    }

    function flyCard(fly, subtext, reason = "", water = null) {
      const ref = flyRefFor(fly);
      const feedback = flyFeedbackLabel(fly);
      const confidence = water ? flyConfidenceFor(water, fly) : "";
      return `
        <div class="fly" data-fly-name="${fly}">
          <div class="fly-photo" style="background-image:url('${ref.plate}');background-position:${ref.pos};background-size:${ref.size || "200% 200%"};" role="img" aria-label="${fly} artificial fly reference"></div>
          <div>
            <strong>${fly}</strong>
            ${confidence ? `<span class="fly-confidence ${confidenceClass(confidence)}">${confidence}</span>` : ""}
            <div class="subtle">${subtext}</div>
            ${reason ? `<div class="fly-reason">${reason}</div>` : ""}
            <div class="subtle">${ref.cue}${feedback ? ` - ${feedback}` : ""}</div>
            <div class="fly-feedback" aria-label="Fly feedback for ${fly}">
              <button class="${flyFeedback[fly] === "worked" ? "active" : ""}" data-fly-feedback="${fly}" data-feedback-value="worked">Worked</button>
              <button class="ignored ${flyFeedback[fly] === "ignored" ? "active" : ""}" data-fly-feedback="${fly}" data-feedback-value="ignored">Ignore</button>
            </div>
          </div>
        </div>
      `;
    }

    function watersSearchState() {
      const query = waterQuery.trim().toLowerCase();
      const filtered = waters.filter((water) => {
        if (!showHiddenWaters && hiddenWaterIds.includes(water.id)) return false;
        const matchesType = waterFilter === "All" || water.type === waterFilter;
        const searchable = `${water.name} ${water.section} ${water.hatch.join(" ")} ${predictedHatches(water).join(" ")}`.toLowerCase();
        return matchesType && (!query || searchable.includes(query));
      });
      const ranked = rankedWatersForCurrentMode(filtered);
      // No match means no top water. Falling back to the selected water put a
      // water the filter had just excluded in the hero, headlined "TOP WATER
      // TODAY", directly above a count that read "0 waters".
      const topWater = ranked[0] || null;
      // Deriving the list must not change what the angler picked. This used to
      // reassign activeWater to the top result whenever the selected water fell
      // out of the filter, so typing "todd" in the search box silently moved a
      // trip planned for the Lower Deschutes onto Todd Lake - and clearing the
      // search did not move it back. Selection changes only in setActiveWater,
      // when a card is tapped.
      return { filtered, ranked, topWater };

    /* ---------------------------------------------------------------------
       Catch log storage.

       Previously: every entry, photo included, was a base64 data URL inside a
       single localStorage key on a file:// origin, and the save path capped the
       journal at eight entries and silently dropped the ninth.

       Now: photos are written to the app container by the native layer and the
       entry keeps only an identifier, so the JSON stays small; the log is
       uncapped; and the whole log is mirrored to a file in Application Support
       so a localStorage eviction cannot take the journal with it.
       --------------------------------------------------------------------- */

    const LOG_STORAGE_KEY = "riseLogs";
    const LOG_SAVED_AT_KEY = "riseLogsSavedAt";
    let logCache = null;
    let logRestoreNotice = "";

    function hasNativeStoreBridge() {
      return Boolean(window.webkit?.messageHandlers?.riseStore);
    }

    function postStoreMessage(payload) {
      if (!hasNativeStoreBridge()) return;
      try {
        window.webkit.messageHandlers.riseStore.postMessage(payload);
      } catch {
        // The native store is a durability mirror; localStorage still holds the log.
      }
    }

    function normalizeLogEntry(entry) {
      if (!entry || typeof entry !== "object") return null;
      const normalized = { ...entry };
      // Entries written before dates carried a year are kept and marked, rather
      // than discarded or silently attributed to the current year.
      if (!normalized.loggedAt) {
        normalized.loggedAt = "";
        normalized.dateApproximate = true;
      }
      return normalized;
    }

    function readLogsFromStorage() {
      try {
        const saved = localStorage.getItem(LOG_STORAGE_KEY);
        if (saved === null) return null;
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) ? parsed.map(normalizeLogEntry).filter(Boolean) : null;
      } catch (error) {
        return null;
      }
    }

    // The user's own journal, and nothing else. An empty journal is empty.
    function getLogs() {
      if (logCache) return logCache;
      logCache = readLogsFromStorage() || [];
      return logCache;
    }

    function readLogsSavedAt() {
      try {
        return localStorage.getItem(LOG_SAVED_AT_KEY) || "";
      } catch {
        return "";
      }
    }

    // Returns false only when the log could not be persisted anywhere.
    function setLogs(logs) {
      const savedAt = new Date().toISOString();
      let localOk = false;
      try {
        localStorage.setItem(LOG_STORAGE_KEY, JSON.stringify(logs));
        localStorage.setItem(LOG_SAVED_AT_KEY, savedAt);
        localOk = true;
      } catch (error) {
        localOk = false;
      }
      // Mirror to the app container. This is what survives a localStorage purge.
      // The envelope carries the write time so a restore can tell which copy is
      // newer instead of guessing from row counts.
      postStoreMessage({ action: "saveLog", body: JSON.stringify({ version: 2, savedAt, logs }) });
      const persisted = localOk || hasNativeStoreBridge();
      // The in-memory journal is only advanced when the write landed somewhere.
      // Assigning it first meant a catch the app had just told the user it
      // could not save stayed in the list for the rest of the session and then
      // vanished at next launch.
      if (persisted) logCache = logs;
      return persisted;
    }

    // Accepts the v2 envelope and the bare array written by earlier builds.
    function parseLogPayload(body) {
      try {
        const parsed = JSON.parse(body || "null");
        if (Array.isArray(parsed)) return { savedAt: "", logs: parsed.map(normalizeLogEntry).filter(Boolean) };
        if (parsed && Array.isArray(parsed.logs)) {
          return { savedAt: String(parsed.savedAt || ""), logs: parsed.logs.map(normalizeLogEntry).filter(Boolean) };
        }
        return null;
      } catch {
        return null;
      }
    }

    /* Called by the native layer at startup with whatever the container holds.

       This used to replace the journal whenever the container copy had more
       rows in it - the guard compared array lengths and nothing else.
       A stale backup with two deleted catches in it therefore overwrote a live
       journal containing one real one - deleting the real catch and
       resurrecting both deleted ones - because three is more than one.

       The container mirror exists to survive a localStorage purge. It restores
       when localStorage has nothing, or when the container copy is provably
       newer by write time. It never merges on count. */
    window.riseLogRestore = function(payload) {
      const restored = parseLogPayload(payload?.body);
      if (!restored || !restored.logs.length) return;
      const current = readLogsFromStorage();
      if (current !== null) {
        // Both timestamps are required. A journal written by a build that did
        // not record one cannot be proved older than anything, and an
        // unprovable claim must not cost the angler a real catch.
        const localSavedAt = readLogsSavedAt();
        const containerIsNewer = Boolean(restored.savedAt) && Boolean(localSavedAt) && restored.savedAt > localSavedAt;
        if (!containerIsNewer) return;
      }
      // Hold on to what is being edited before the indexes move under it.
      const editingLoggedAt = editingLogIndex !== null ? getLogs()[editingLogIndex]?.loggedAt : null;
      logCache = restored.logs;
      try {
        localStorage.setItem(LOG_STORAGE_KEY, JSON.stringify(logCache));
        localStorage.setItem(LOG_SAVED_AT_KEY, restored.savedAt || new Date().toISOString());
      } catch {
        // In-memory restore still gives the user their journal for this session.
      }
      // An open edit form pointed at index 2 would otherwise now be pointed at
      // whatever entry landed at index 2, and Update would write one catch's
      // edits onto another.
      if (editingLogIndex !== null) {
        const movedTo = editingLoggedAt ? logCache.findIndex((entry) => entry.loggedAt === editingLoggedAt) : -1;
        if (movedTo === -1) {
          editingLogIndex = null;
          logFormOpen = false;
          logSaveMessage = "The catch you were editing is not in the restored journal. Nothing was overwritten.";
        } else {
          editingLogIndex = movedTo;
        }
      }
      logRestoreNotice = `Restored ${logCache.length} saved ${logCache.length === 1 ? "catch" : "catches"} from this device's backup.`;
      renderLog();
    };

    function photoSourceFor(entry) {
      if (entry?.photoId && hasNativeStoreBridge()) return `risephoto://photo/${entry.photoId}`;
      return entry?.photo || "";
    }

    function newPhotoId() {
      return `catch-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    }

    // Writes the photo into the app container and returns the id to store on the
    // entry. Falls back to the inline data URL when running outside the app.
    function storePhoto(dataUrl) {
      if (!dataUrl) return { photoId: "", photo: "" };
      if (!hasNativeStoreBridge()) return { photoId: "", photo: dataUrl };
      const photoId = newPhotoId();
      postStoreMessage({ action: "savePhoto", id: photoId, body: dataUrl });
      return { photoId, photo: "" };
    }

    function deleteStoredPhoto(entry) {
      if (entry?.photoId) postStoreMessage({ action: "deletePhoto", id: entry.photoId });
    }

    function formatLogDate(entry) {
      if (!entry?.loggedAt) return `${entry?.date || ""}${entry?.dateApproximate ? " (year unknown)" : ""}`;
      const parsed = new Date(entry.loggedAt);
      if (Number.isNaN(parsed.getTime())) return entry.date || "";
      return zonedDateLabel(parsed);
    }

    function logSeasonYears() {
      const years = new Set();
      getLogs().forEach((entry) => {
        if (!entry.loggedAt) return;
        const parsed = new Date(entry.loggedAt);
        if (!Number.isNaN(parsed.getTime())) years.add(parsed.getFullYear());
      });
      return [...years].sort();
    }

    /* saveLogEntry has recorded flowSource and tempSource since build 9, and
       every display site then threw them away. An entry logged on the Lower
       Deschutes with no signal stores "4,160 cfs" - the app's own seasonal
       reference value - and printed it on the card and in the CSV as if it
       were the flow the fish was caught in.

       The number and where it came from now travel together everywhere. */
    function readingProvenanceWord(entry, key) {
      const source = entry?.[`${key}Source`];
      if (source === "measured") return "measured";
      if (source === "stale") return "measured earlier";
      if (source === "reference") return "reference";
      if (source === "unavailable") return "";
      // Entries written before build 11 carry no source at all.
      return "source unknown";
    }

    function loggedReadingLabel(entry, key) {
      const value = String(entry?.[key] || "").trim();
      if (!value || value === "No live gauge") return "";
      const word = readingProvenanceWord(entry, key);
      return word ? `${value} (${word})` : value;
    }

    function logCsv() {
      const columns = ["Date", "Time", "Water", "Fly", "Species", "Length", "Count", "Flow", "Flow source", "Water temp", "Water temp source", "Notes"];
      const rows = getLogs().map((entry) => [
        formatLogDate(entry),
        entry.time || "",
        entry.waterName || "",
        entry.fly || "",
        entry.fish || "",
        entry.length || "",
        entry.count || "",
        entry.flow || "",
        readingProvenanceWord(entry, "flow"),
        entry.temp || "",
        readingProvenanceWord(entry, "temp"),
        entry.notes || ""
      ]);
      const escape = (value) => `"${String(value).replace(/"/g, '""')}"`;
      return [columns, ...rows].map((row) => row.map(escape).join(",")).join("\r\n");
    }

    function exportLog() {
      const csv = logCsv();
      if (hasNativeStoreBridge()) {
        postStoreMessage({ action: "exportLog", body: csv });
        return "Export sheet opened.";
      }
      try {
        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `the-rise-catch-log-${pacificDateKey()}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        return "Catch log downloaded as CSV.";
      } catch (error) {
        return "Export failed on this device.";
      }
    }

    function flyFamilyName(fly) {
      const text = String(fly || "").toLowerCase();
      if (text.includes("caddis") || text.includes("x-caddis")) return "Caddis";
      if (text.includes("bwo")) return "BWO";
      if (text.includes("pmd")) return "PMD";
      if (text.includes("damsel")) return "Damsel";
      if (text.includes("chironomid") || text.includes("midge") || text.includes("chromie")) return "Midge";
      if (text.includes("leech") || text.includes("bugger")) return "Leech";
      if (text.includes("callibaetis")) return "Callibaetis";
      return String(fly || "Caddis").replace(/\s?#\d+/, "");
    }

        return false;
      }
      window.webkit.messageHandlers.riseSubscription.postMessage(payload);

      // an error, so a failed purchase cannot arm the welcome panel later.
      subscriptionActionPending = null;

      subscriptionLoading = false;
      if (result?.prices?.monthly) subscriptionPrices.monthly = result.prices.monthly;
      if (result?.prices?.annual) subscriptionPrices.annual = result.prices.annual;
      subscriptionMessage = result?.message || (proAccessActive ? "The Rise Pro is active." : "The Rise Pro is not active yet.");
      // Pro now gates panels on the Today, Waters, Trip and Bugs screens, so an
      // access change has to repaint more than the Pro tab.
      if (previousAccess !== proAccessActive) {
        // A purchase or restore that just turned Pro on lands the buyer on the
        // rating breakdown - the one unlock that is a visible change rather
        // than a panel appearing on another screen - with the other three
        // listed above it. A relaunch as an existing subscriber does not, and
        // neither does losing access.
        if (proAccessActive && (pendingAction === "purchase" || pendingAction === "restore")) {
          proWelcomeOpen = true;
          scoreBreakdownOpen = true;
          renderAll();
          activateTab("today");
          // activateTab puts Today at its top, which on a phone is the hero and
          // nothing else. The panel is what the purchase has to be seen to have
          // done, so the screen opens on it.
          scrollAppTo("#today .pro-welcome");
          return;
        }
        renderAll();
        return;
      }
      renderPro();
    };

    /* ---------------------------------------------------------------------
       Rendering.

       renderAll used to rebuild the innerHTML of all six screens on every
       interaction, including the five the user could not see. Screens are now
       rendered on demand: the visible one immediately, the rest marked dirty
       and rebuilt when they are opened.
       --------------------------------------------------------------------- */

    const screenRenderers = {
      today: renderToday,
      waters: renderWaters,
      trip: renderTrip,
      bugs: renderBugs,
      log: renderLog,
      pro: renderPro
    };

    const dirtyScreens = new Set();

    function activeScreenId() {
      return document.querySelector(".view.active")?.id || "today";
    }

    function renderScreen(id) {
      const renderer = screenRenderers[id];
      if (!renderer) return;
      renderer();
      dirtyScreens.delete(id);
      /* Re-rendering the visible screen changes what is painted under the
         status bar without anyone scrolling. The simulator proved it: at boot
         the app measured an unsynced Today, asked for dark glyphs, and then
         the first sync replaced the screen under them and nothing looked
         again. One dark clock on teal for the rest of the launch. */
      if (id === activeScreenId()) syncStatusBarChrome();
      /* The same re-render moves the setup panel the app scrolled to, because
         the hero above it changes height as the readings land. On the
         simulator that lifted the panel's top corner back under the notch,
         and a single correction was not enough - a launch renders Today more
         than once. The position is held until the angler touches the screen,
         which is the point at which where they are looking stops being ours
         to decide. */
      if (id === "today" && firstRunScrollPending && document.querySelector("#today .first-run")) {
        scrollAppTo("#today .first-run");
      }
    }

    /* Set for the launch of a fresh install, cleared by the first touch. */
    let firstRunScrollPending = false;

    // Renders the visible screen now and defers the rest until they are shown.
    function renderAll() {
      const active = activeScreenId();
      Object.keys(screenRenderers).forEach((id) => {
        if (id !== active) dirtyScreens.add(id);
      });
      renderScreen(active);
    }

    // Marks the named screens stale and repaints only the one on screen.
    function renderScreens(...ids) {
      const active = activeScreenId();
      ids.forEach((id) => {
        if (id === active) {
          renderScreen(id);
        } else {
          dirtyScreens.add(id);
        }
      });
    }

    // Used at startup, where every screen must exist before the first paint.
    function renderEverything() {
      Object.keys(screenRenderers).forEach(renderScreen);
    }

    function runInitialDataSync() {
      if (navigator.onLine === false) return;
      if (shouldRunDailyOpenSync()) {
        refreshAllWaterReports("daily-open");
      } else if (!liveReports.byWater[activeWater]) {
        refreshLiveReport(activeWater, { mode: "startup" });
      }
    }

    function checkDailyOpenSync() {
      if (navigator.onLine === false || liveReports.bulkStatus) return;
      if (shouldRunDailyOpenSync()) refreshAllWaterReports("daily-open");
    }

    function startDailyOpenSyncWatcher() {
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) checkDailyOpenSync();
      });
      window.addEventListener("online", checkDailyOpenSync);
    }

    function activateTab(tab) {
      // Rebuild the screen before revealing it if it went stale while hidden.
      if (dirtyScreens.has(tab)) {
        renderScreen(tab);
      }
      all(".view").forEach((view) => view.classList.toggle("active", view.id === tab));
      all(".tab").forEach((button) => button.setAttribute("aria-selected", button.dataset.tab === tab ? "true" : "false"));
      // Scroll first: the glyph colour is read off what is under the strip,
      // and this is the line that puts the hero back under it.
      scrollAppToTop();
      syncStatusBarChrome();
    }

    /* The status bar glyphs are drawn by the container, over whatever the page
       paints in the top inset. The container cannot see the page, so the page
       has to tell it: white glyphs over the teal (#155a6b) blocks, dark ones
       over paper. Outside the iOS app there is no bridge and nothing to tell.

       This was first written as a list of teal *screens*, and only running the
       app showed why that is wrong: the teal is the hero, not the screen.
       Scroll Today past the hero and a white clock sits on cream - which is
       the first frame of a fresh install, because the setup panel is below the
       hero and the app scrolls down to it.

       Nor is the hero's own box the answer. The Today body is pulled up over
       the hero's bottom padding, so the hero's geometric bottom is 60-odd
       pixels below where the teal stops being visible. Asking the layout what
       is *painted* in the strip is the only description that cannot drift:
       hit-test it, walk up to the first opaque background, and read it. That
       also means a new screen, or a redesign of an old one, needs no list
       kept in sync with it. */
    let lastStatusBarStyle = null;

    function safeAreaInsetTop() {
      const probe = document.querySelector(".safe-area-probe");
      return probe ? probe.getBoundingClientRect().height : 0;
    }

    // Perceived brightness (Rec. 601) of whatever is painted at this height,
    // 0 black to 1 white. 1 when nothing is: paper is the safer assumption,
    // because dark glyphs on a dark bar are ugly and light glyphs on a light
    // bar are unreadable.
    function paintedBrightnessAt(x, y) {
      let element = document.elementFromPoint(Math.round(x), Math.round(y));
      while (element) {
        const parts = (getComputedStyle(element).backgroundColor || "").match(/[\d.]+/g);
        // Anything under half-opaque lets the layer beneath it decide.
        if (parts && parts.length >= 3 && (parts.length < 4 || Number(parts[3]) >= 0.5)) {
          return (0.299 * Number(parts[0]) + 0.587 * Number(parts[1]) + 0.114 * Number(parts[2])) / 255;
        }
        element = element.parentElement;
      }
      return 1;
    }

    function statusBarStyleNow() {
      // A device with no notch reports a zero inset while its glyphs still
      // occupy the top ~20px, so the strip is never treated as empty.
      const strip = Math.max(safeAreaInsetTop(), 20);
      /* Sampled where the glyphs are: the clock at the left, the battery at
         the right, in the middle of the inset's height. Not the centre -
         that is behind the Dynamic Island, and it is the one column that
         reads differently, because the paper body's top edge is a curve that
         rises in the middle. The simulator showed the cost: a dark clock on
         teal, because the arc had reached the centre while the clock was
         still over the hero. Not the strip's edges either - the bottom reads
         the wrong side of a boundary that falls inside the inset, and the top
         flickers for the 200ms every screen fades in from translateY(8px).

         One style has to serve both ends of a bar that is not always one
         colour, so it follows the average rather than any single point. */
      const samples = [];
      for (const x of [0.1, 0.9]) {
        for (const fraction of [0.4, 0.6]) {
          samples.push(paintedBrightnessAt(window.innerWidth * x, strip * fraction));
        }
      }
      const mean = samples.reduce((total, value) => total + value, 0) / samples.length;
      return mean < 0.5 ? "light" : "dark";
    }

    function syncStatusBarChrome() {
      const handler = window.webkit?.messageHandlers?.riseChrome;
      if (!handler) return;
      const style = statusBarStyleNow();
      if (style === lastStatusBarStyle) return;
      lastStatusBarStyle = style;
      try {
        handler.postMessage({ statusBar: style });
      } catch {
        // Chrome styling is cosmetic; a missing bridge must not break the tab.
      }
    }

    /* Scrolling is the event that changes what is under the clock, and on a
       phone it fires far faster than the status bar can repaint. Coalesced to
       one check per frame, passive so it never delays the scroll itself. */
    function startStatusBarChromeWatcher() {
      const scroller = document.querySelector("main");
      if (!scroller) return;
      let queued = false;
      const check = () => {
        if (queued) return;
        queued = true;
        requestAnimationFrame(() => {
          queued = false;
          syncStatusBarChrome();
        });
      };
      scroller.addEventListener("scroll", check, { passive: true });
      // Rotation and Split View change the inset and the hero's height with it.
      window.addEventListener("resize", check);
      window.addEventListener("orientationchange", check);
      // The first measurement happens before the web font and the fly plates
      // have arrived, and both move the boundary the sample lands either side
      // of, without a scroll or a re-render to announce it.
      window.addEventListener("load", check);
      if (document.fonts?.ready) document.fonts.ready.then(check).catch(() => {});
    }

    /* The app scrolls <main>, not the document: `main { overflow-y: auto }`
       inside a fixed-height shell. window.scrollTo() therefore did nothing,
       and switching tabs after scrolling to the bottom of Waters dropped the
       angler partway down Bugs. This was already known - the screenshot
       harness hit the same fact and was fixed for it - and the app was not. */
    function scrollAppToTop() {
      // Instant, not smooth. A tab bar should show the new screen already at
      // its top; animating 28,000px of the Waters list on the way out is both
      // slow and, on iOS, interruptible halfway.
      const scroller = document.querySelector("main");
      if (scroller) scroller.scrollTop = 0;
      window.scrollTo(0, 0);
    }

    /* Same scroller, a specific panel. Landing a buyer on the tab that holds
       what they bought is not enough on a phone: the Today hero is taller than
       a 390x844 screen, so a panel appended to the body below it sits 1,400px
       down and the buyer sees the screen they were already looking at. */
    function scrollAppTo(selector) {
      const target = document.querySelector(selector);
      const scroller = document.querySelector("main");
      if (!target || !scroller) return;
      // Measured against the scroller rather than read off offsetTop: the
      // screens and several of their panels establish their own containing
      // blocks, so offsetTop is a distance to some intermediate box and using
      // it left the target 1,371px down an 844px screen.
      const delta = target.getBoundingClientRect().top - scroller.getBoundingClientRect().top;
      /* The scroller starts at the top of the window now, so 12px below its
         top edge is behind the clock. On the simulator that put "SETUP - 0 OF
         3" under the Dynamic Island and the Skip button under the battery, on
         the one screen a fresh install opens on. The gap clears the inset. */
      const gap = safeAreaInsetTop() + 12;
      scroller.scrollTop = Math.max(0, scroller.scrollTop + delta - gap);
      // This is a programmatic scroll that moves the teal hero off the strip
      // - the first-run panel on Today is exactly that - so the glyphs have to
      // follow it here as well as on a finger scroll.
      syncStatusBarChrome();
    }

    function readPhotoFile(file) {
      return new Promise((resolve) => {
        if (!file) {
          resolve("");
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const image = new Image();
          image.onload = () => {
            try {
              const maxDimension = 1600;
              const scale = Math.min(1, maxDimension / Math.max(image.width, image.height));
              const canvas = document.createElement("canvas");
              canvas.width = Math.max(1, Math.round(image.width * scale));
              canvas.height = Math.max(1, Math.round(image.height * scale));
              const context = canvas.getContext("2d");
              if (!context) {
                resolve("");
                return;
              }
              context.drawImage(image, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL("image/jpeg", .82));
            } catch (error) {
              resolve("");
            }
          };
          image.onerror = () => resolve("");
          image.src = String(reader.result || "");
        };
        reader.onerror = () => resolve("");
        reader.readAsDataURL(file);
      });
    }

    /* ---------------------------------------------------------------------
       Event binding.

       bindDynamic() used to call addEventListener on every matching element
       in the document, from 41 call sites, on every render. renderScreen()
       only replaces one screen's markup, so nodes on the other six survived
       and collected another copy of the same handler on every pass. One
       Delete tap deleted several catches; one Save wrote the entry several
       times; a fresh install was already doubled before the user touched it.

       Handlers are now delegated from the document once, at startup. A
       repaint replaces markup and nothing else, so no amount of rendering
       can multiply a handler. Resolution walks up from the event target and
       takes the first element that matches an action, which gives the inner
       control priority over the card containing it - the behaviour the old
       stopPropagation() calls were there to produce.
       --------------------------------------------------------------------- */

    const clickActions = [
      ["[data-score-breakdown]", () => {
        scoreBreakdownOpen = !scoreBreakdownOpen;
        renderToday();
      }],
      ["[data-trip-mode]", (element) => {
        saveActiveWater(element.dataset.tripMode);
        renderAll();
        activateTab("trip");
      }],
      ["[data-hide-water]", (element) => {
        toggleHiddenWater(element.dataset.hideWater);
        renderAll();
      }],
      ["[data-show-hidden]", () => {
        showHiddenWaters = !showHiddenWaters;
        renderWaters();
      }],
      ["[data-save-water]", (element) => {
        toggleSavedWater(element.dataset.saveWater);
        renderScreens("today", "waters");
      }],
      ["[data-fly-feedback]", (element) => {
        setFlyFeedback(element.dataset.flyFeedback, element.dataset.feedbackValue);
        renderScreens("today", "waters", "bugs");
      }],
      ["[data-beginner-mode]", () => {
        setBeginnerMode(!beginnerMode);
        renderToday();
        renderBugs();
      }],
      ["[data-skill-mode]", (element) => {
        setSkillMode(element.dataset.skillMode);
        renderAll();
      }],
      ["[data-quick-log]", (element) => {
        const water = waterById(element.dataset.quickLog) || topRecommendedWater();
        saveActiveWater(water.id);
        activeWaterFlyByWater[water.id] = liveRecommendedFlies(water)[0];
        editingLogIndex = null;
        logFormOpen = true;
        renderLog();
        activateTab("log");
        requestAnimationFrame(() => $("#logForm")?.scrollIntoView({ behavior: "smooth", block: "start" }));
      }],
      ["[data-water-fly]", (element) => {
        activeWaterFlyByWater[element.dataset.waterId] = element.dataset.waterFly;
        renderWaters();
      }],
      ["[data-library-fly]", (element) => {
        const libraryFly = findLibraryFlyByName(element.dataset.libraryFly);
        if (libraryFly) {
          activeBug = libraryFly.bugId;
          activeBugStage = libraryFly.stage;
          activeFlyName = libraryFly.name;
        } else {
          activeFlyName = element.dataset.libraryFly;
        }
        renderBugs();
      }],
      ["[data-bug-stage]", (element) => {
        activeBugStage = element.dataset.bugStage;
        activeFlyName = null;
        renderBugs();
      }],
      ["[data-clear-bug-stage]", () => {
        activeBugStage = null;
        activeFlyName = null;
        renderBugs();
      }],
      ["[data-hatch-pick]", (element) => {
        activeBug = element.dataset.hatchPick;
        activeBugStage = null;
        activeFlyName = null;
        renderBugs();
        requestAnimationFrame(() => $(".bug-card.active")?.scrollIntoView({ behavior: "smooth", block: "start" }));
      }],
      ["[data-hatch-clear]", () => {
        hatchIdTraits = {};
        writeStoredObject("riseHatchIdTraits.v1", hatchIdTraits);
        renderBugs();
      }],
      ["[data-bug]", (element, event) => {
        if (event.target.closest("button, a, input, select, textarea")) return;
        activeBug = element.dataset.bug;
        activeBugStage = null;
        activeFlyName = null;
        renderBugs();
      }],
      ["[data-refresh-live]", (element) => refreshLiveReport(element.dataset.refreshLive, { mode: "manual" })],
      ["[data-refresh-all]", () => refreshAllWaterReports("manual")],
      ["[data-use-location]", () => requestUserLocation()],
      ["[data-water-sort]", (element) => {
        waterSortMode = element.dataset.waterSort;
        if (waterSortMode === "Near" && !userLocation) {
          requestUserLocation();
          return;
        }
        renderScreens("today", "waters");
      }],
      ["[data-water-filter]", (element) => {
        waterFilter = element.dataset.waterFilter;
        renderWaters();
      }],
      ["[data-tab-jump]", (element) => activateTab(element.dataset.tabJump)],
      ["[data-new-log]", () => {
        logFormOpen = !logFormOpen;
        logSaveMessage = "";
        editingLogIndex = null;
        renderLog();
        if (logFormOpen) $("#logForm")?.scrollIntoView({ behavior: "smooth", block: "start" });
      }],
      ["[data-edit-log]", (element) => {
        logSaveMessage = "";
        editingLogIndex = Number(element.dataset.editLog);
        logFormOpen = true;
        renderLog();
        $("#logForm")?.scrollIntoView({ behavior: "smooth", block: "start" });
      }],
      ["[data-export-log]", () => {
        logSaveMessage = exportLog();
        renderLog();
      }],
      ["[data-delete-log]", (element) => {
        const index = Number(element.dataset.deleteLog);
        const logs = getLogs();
        if (!logs[index]) return;
        deleteStoredPhoto(logs[index]);
        setLogs(logs.filter((_, itemIndex) => itemIndex !== index));
        if (editingLogIndex === index) {
          editingLogIndex = null;
          logFormOpen = false;
        }
        renderLog();
      }],
      ["[data-billing]", () => {
        billing = billing === "annual" ? "monthly" : "annual";
        renderPro();
      }],
      ["[data-subscribe-plan]", (element) => {
        subscriptionLoading = true;
        subscriptionActionPending = "purchase";
        subscriptionMessage = `Starting ${element.dataset.subscribePlan === "annual" ? "annual" : "monthly"} checkout...`;
        renderPro();
        postSubscriptionMessage({ action: "purchase", plan: element.dataset.subscribePlan });
      }],
      ["[data-restore-purchases]", () => {
        subscriptionLoading = true;
        subscriptionActionPending = "restore";
        subscriptionMessage = "Checking past purchases...";
        renderPro();
        postSubscriptionMessage({ action: "restore" });
      }],
      ["[data-dismiss-pro-welcome]", () => {
        proWelcomeOpen = false;
        renderToday();
      }],
      ["[data-dismiss-onboarding]", () => {
        dismissOnboarding();
        renderToday();
      }],
      ["[data-show-more-log]", () => {
        logVisibleCount += LOG_PAGE_SIZE;
        renderLog();
      }],
      ["[data-show-breakdown]", () => {
        if (!scoreBreakdownOpen) {
          scoreBreakdownOpen = true;
          renderToday();
        }
        scrollAppTo("#today .score-breakdown-panel");
      }],
      ["[data-refresh-subscription]", () => syncSubscriptionStatus()],
      ["[data-water]", (element, event) => {
        const nestedControl = event.target.closest("button, a, input, select, textarea");
        if (nestedControl && nestedControl !== element) return;
        const isShortcut = element.classList.contains("water-chip-card");
        if (isShortcut) {
          waterQuery = "";
          waterFilter = "All";
        }
        expandedWaterId = expandedWaterId === element.dataset.water ? null : element.dataset.water;
        saveActiveWater(element.dataset.water);
        renderAll();
        if (isShortcut) {
          requestAnimationFrame(() => {
            const activeCard = all(".waters-main-list [data-water]").find((item) => item.dataset.water === activeWater);
            activeCard?.scrollIntoView({ behavior: "smooth", block: "start" });
          });
        }
        if (!liveReports.byWater[activeWater] && navigator.onLine !== false) refreshLiveReport(activeWater, { mode: "manual" });
        if (element.dataset.go) activateTab(element.dataset.go);
      }],
      [".tab", (element) => activateTab(element.dataset.tab)]
    ];

    // Elements that a keyboard user can activate with Enter or Space. Anything
    // that is already a <button> gets this from the browser.
    const keyActivatedSelectors = ["[data-trip-mode]", "[data-library-fly]", "[data-bug]", "[data-water]"];

    // Walks up from the event target and returns the first element that owns an
    // action, so the innermost control wins over any card wrapping it.
    function resolveAction(target, selectors) {
      let node = target instanceof Element ? target : null;
      while (node && node !== document.documentElement) {
        for (const entry of clickActions) {
          if (selectors && !selectors.includes(entry[0])) continue;
          if (node.matches(entry[0])) return { element: node, handler: entry[1] };
        }
        node = node.parentElement;
      }
      return null;
    }

    function bindDelegatedEvents() {
      document.addEventListener("click", (event) => {
        const match = resolveAction(event.target, null);
        if (match) match.handler(match.element, event);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        // A real button already fires click on Enter/Space; binding here too
        // would run the action twice.
        if (event.target instanceof Element && event.target.closest("button, a, input, select, textarea")) return;
        const match = resolveAction(event.target, keyActivatedSelectors);
        if (!match) return;
        event.preventDefault();
        match.handler(match.element, event);
      });

      document.addEventListener("change", (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;
        if (target.matches("[data-home-water]")) {
          saveHomeWater(target.value);
          saveActiveWater(target.value);
          renderAll();
          if (!liveReports.byWater[homeWaterId] && navigator.onLine !== false) refreshLiveReport(homeWaterId, { mode: "manual" });
          return;
        }
        if (target.matches("[data-hatch-trait]")) {
          hatchIdTraits[target.dataset.hatchTrait] = target.value;
          writeStoredObject("riseHatchIdTraits.v1", hatchIdTraits);
          renderBugs();
        }
      });

      document.addEventListener("input", (event) => {
        const target = event.target;
        if (!(target instanceof Element) || !target.matches("[data-water-search]")) return;
        // The field itself is never re-rendered, so focus, caret and the iOS
        // keyboard all survive on their own. Only the results repaint, and a
        // fast typist gets one repaint instead of one per character.
        waterQuery = target.value;
        clearTimeout(waterSearchRepaint);
        waterSearchRepaint = setTimeout(renderWaterResults, WATER_SEARCH_REPAINT_MS);
      });

      document.addEventListener("submit", (event) => {
        const form = event.target;
        if (!(form instanceof Element) || form.id !== "logForm") return;
        event.preventDefault();
        saveLogEntry(form);
      });
    }

    // Save is async — it awaits the photo decode, which is a real second or two
    // on a large JPEG. Without this guard a second tap in that window ran the
    // whole function again against the same form and wrote the catch twice.
    let logSaveInFlight = false;

    async function saveLogEntry(logForm) {
      if (logSaveInFlight) return;
      logSaveInFlight = true;
      const submitButton = logForm.querySelector('button[type="submit"]');
      if (submitButton) submitButton.disabled = true;
      try {
        await writeLogEntry(logForm);
      } finally {
        logSaveInFlight = false;
        if (submitButton && submitButton.isConnected) submitButton.disabled = false;
      }
    }

    async function writeLogEntry(logForm) {
      const form = new FormData(logForm);
      const water = waters.find((item) => item.id === form.get("water")) || getWater();
      const existingEntry = editingLogIndex !== null ? getLogs()[editingLogIndex] : null;
      const capturedPhoto = await readPhotoFile(form.get("photo"));
      // A new photo replaces the old one, but the old file is not removed until
      // the journal write has actually succeeded. Deleting first meant a quota
      // failure destroyed the photo while the entry still pointed at it.
      let photoFields;
      let photoToDelete = null;
      if (capturedPhoto) {
        if (existingEntry) photoToDelete = existingEntry;
        photoFields = storePhoto(capturedPhoto);
      } else {
        photoFields = {
          photoId: existingEntry?.photoId || "",
          photo: form.get("existingPhoto") || existingEntry?.photo || ""
        };
      }
      const now = new Date();
      const entry = {
        // Full timestamp, so entries can be sorted and compared across seasons.
        loggedAt: now.toISOString(),
        date: zonedDateLabel(now),
        time: form.get("time"),
        waterName: water.name,
        waterId: water.id,
        fly: form.get("fly"),
        fish: form.get("fish"),
        length: form.get("length"),
        count: form.get("count"),
        notes: form.get("notes"),
        // Record what was actually on screen, not the seed value.
        flow: liveDisplayValue(water, "flow"),
        flowSource: valueProvenance(water, "flow"),
        temp: liveDisplayValue(water, "temp"),
        tempSource: valueProvenance(water, "temp"),
        ...photoFields
      };
      const logs = getLogs();
      let nextLogs;
      if (editingLogIndex !== null) {
        // An edit changes what the angler typed. It must never restate the
        // conditions: the readings belong to the moment the fish was caught,
        // and rewriting them with today's numbers silently converted a real
        // measurement into whatever the app happens to be showing now.
        const original = logs[editingLogIndex];
        const preservedReadings = {};
        for (const key of ["flow", "flowSource", "temp", "tempSource"]) {
          if (original[key] !== undefined) preservedReadings[key] = original[key];
        }
        const edited = {
          ...original,
          ...entry,
          ...preservedReadings,
          loggedAt: original.loggedAt || entry.loggedAt,
          date: original.date || entry.date
        };
        // Built as a new array rather than written into the one getLogs handed
        // back: that array *is* the live cache, so editing it in place applied
        // the edit before the write was attempted and survived a failure.
        nextLogs = logs.map((item, itemIndex) => (itemIndex === editingLogIndex ? edited : item));
      } else {
        // No cap. The journal is the user's own record and is never truncated.
        nextLogs = [entry, ...logs];
      }
      if (!setLogs(nextLogs)) {
        // The write failed, so the new photo is an orphan and the old one is
        // still the entry's only copy. Remove the orphan, keep the original.
        if (capturedPhoto) deleteStoredPhoto(photoFields);
        logSaveMessage = "This catch could not be saved to this device. Free up storage and try again.";
        renderLog();
        return;
      }
      if (photoToDelete) deleteStoredPhoto(photoToDelete);
      if (entry.fly && flyFeedback[entry.fly] !== "worked") {
        flyFeedback[entry.fly] = "worked";
        writeStoredObject(FLY_FEEDBACK_KEY, flyFeedback);
      }
      logSaveMessage = "";
      logFormOpen = false;
      editingLogIndex = null;
      maybeCompleteOnboarding();
      renderLog();
    }

    function syncSubscriptionStatus() {
      if (!hasSubscriptionBridge()) {
        subscriptionLoading = false;
        subscriptionMessage = "Localized subscription prices are available in the iOS app.";
        renderPro();
        return;
      }
      subscriptionPrices = { monthly: null, annual: null };
      subscriptionLoading = true;
      // A status query is not a purchase, so its reply must not open the
      // welcome panel for a subscriber who has simply relaunched the app.
      subscriptionActionPending = null;
      subscriptionMessage = "Loading localized subscription prices from the App Store...";
      renderPro();
      postSubscriptionMessage({ action: "status" });
    }

    // Bound once, for the life of the document.
    bindDelegatedEvents();

    userLocation = readUserLocation();
    hydrateWaterCache();
    renderEverything();
    // Today is the screen the app opens on, and its hero is teal to the top
    // edge - but only until something scrolls it away, so the watcher goes on
    // before the first-run scroll below rather than after it.
    startStatusBarChromeWatcher();
    syncStatusBarChrome();
    /* On a phone the Today hero is taller than the screen, so a panel below it
       is not on the screen anyone is looking at. An install with none of the
       three steps done therefore opens on the setup panel instead of on a hero
       built entirely from seasonal reference data - which is also the first
       thing an App Review tester sees. As soon as any one step is done the app
       opens at the top again, so this is not a scroll position to fight every
       launch. */
    if (!onboardingDismissed && onboardingSteps().every(([, done]) => !done)) {
      firstRunScrollPending = true;
      // A finger on the screen outranks the correction above, from then on.
      for (const event of ["touchstart", "pointerdown", "wheel", "keydown"]) {
        window.addEventListener(event, () => { firstRunScrollPending = false; }, { passive: true, once: true });
      }
      scrollAppTo("#today .first-run");
    }
    syncSubscriptionStatus();
    runInitialDataSync();
    startDailyOpenSyncWatcher();
  </script>
</body>
</html>
